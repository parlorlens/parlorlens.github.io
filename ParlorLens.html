  ["milker", "vacuum", "liner"].forEach(g2 => C[g2].filter(bad).forEach(x => items.push(Object.assign({ group: g2 }, x))));
  const pBad = C.pulsation.filter(bad);
  if (pBad.length) items.push({ group: "pulsation", id: "puls", title: "Pulsation timing", status: pBad.some(x => x.status === "crit") ? "crit" : "warn",
    value: pBad.map(x => x.title.replace(" (milk phase)", "") + " " + x.value).join(" · "), cows: [],
    farmer: "The pulsators run at " + fmt(P.rate, 0) + " cycles/min, " + fmt(P.ratioMilk, 0) + ":" + fmt(100 - P.ratioMilk, 0) + ", phases a/b/c/d " + [P.a, P.b, P.c, P.d].map(v => fmt(v, 0)).join("/") +
      " ms. That differs from the " + (S.preset === "guide" ? "VaDia 2 guide" : "VaDia Suite default") + " settings on " + pBad.length + " point" + (pBad.length > 1 ? "s" : "") + ". The defaults are not this parlor's specification — the pulsation section below shows what each phase does.",
    cow: "Pulsation decides how long the liner stays open on the teat and how long it rests closed against it. The closed phase is the only relief the teat end gets from vacuum.",
    checks: ["Confirm what the pulsators were commissioned to, then run a dry pulsator test (ISO 6690) on this pulsator before changing any setting."] });
  items.sort((p, q) => (p.status === "crit" ? 0 : 1) - (q.status === "crit" ? 0 : 1));
  const f = sec("What we found, and what to do", items.length ? "In order of importance. Each item says who should act." : "");
  if (!items.length) f.append(para("No graded result fell outside its reference on this unit."));
  items.forEach((x, k) => {
    const box = el("div", { class: "fitem" });
    box.append(el("div", { class: "fitem-h" }, [el("span", { class: "fnum", text: String(k + 1) }), el("strong", { text: x.title }),
      el("span", { class: "pill " + STATUS_CLASS[x.status], text: STATUS_LABEL[x.status] })]));
    box.append(el("div", { class: "fitem-v", text: x.value }));
    const dl = el("dl", { class: "fitem-dl" });
    const add = (k2, v) => { if (v) dl.append(el("dt", { text: k2 }), el("dd", { text: v })); };
    add("For the farm", x.farmer); add("For the cow", x.cow);
    add("Cows concerned", x.cows && x.cows.length ? x.cows.join(", ") : "");
    add("What to do", x.checks && x.checks.length ? x.checks.slice(0, 2).join(" ") : "");
    add("Who", WHO[x.group]);
    box.append(dl);
    f.append(box);
  });
  out.push(f);

  /* ---- time on the unit ---- */
  if (!H.notMTT) {
    const t = sec("Where the unit's time went", "Each bar is one cow, from cluster on to cluster off");
    t.append(minutesChart(M));
    const per100 = H.overmilk != null ? H.overmilk * 100 / 60 : null;
    t.append(para("The median milking took " + hms(H.machineOn) + ": " + hms(H.letdown) + " waiting for full flow, " + hms(H.main) + " of real milking, " + hms(H.overmilk) +
      " of overmilking and " + fmt(H.detach, 0) + " s taking the cluster off. Across the " + MT.length + " fully recorded milkings, " + fmt(H.overmilkTotal / 60, 1) +
      " minutes of unit time — " + fmt(H.overmilkShare, 0) + " % — went on overmilking." + (per100 != null && H.overmilk > 0 ? " At the median, that is about " + fmt(per100, 0) +
      " unit-minutes for every 100 cows milked (an estimate: it assumes every cow behaves like the median on this unit)." : "")));
    if (Y && Y.perUnitHour != null) t.append(para("The unit harvested " + fmt(Y.perUnitHour) + " " + Y.unit + " per hour over the recording; each " + (Y.unit === "kg" ? "kilogram" : "litre") + " took " + fmt(Y.secPerUnit, 0) + " s of unit time."));
    out.push(t);
  }

  if (!H.notMTT) {
    /* ---- preparation and let-down ---- */
    const L = _byN(MT, c => c.letdown);
    if (L.length) {
      const p = sec("Preparation and let-down", "What the routine before cluster-on does to the milking");
      p.append(para("Milk let-down is a reflex. Touching, forestripping and cleaning the teats starts it, and it takes time to arrive: the recommended lag from first touch to cluster-on is 60–120 seconds (Penn State Extension). When the cluster goes on before let-down, the machine first takes the small amount of milk already in the teat and gland cistern, then flow slows or stops until the rest arrives. That is delayed let-down, and when flow visibly dips and recovers it is called bimodal milking (Penn State Extension; Fernandes et al. 2023)."));
      p.append(para("VaDia cannot see the routine itself. It sees the result: once milk flows, vacuum at the teat end falls and settles at a lower working level. The time from cluster-on to that settled level is the let-down figure in this report (VaDia Suite manual rule, which cannot report less than 15 s)."));
      const fast = L[0], slow = L[L.length - 1];
      const span = Math.max(75, slow.letdown + 45);
      const win = c => [Math.max(0, idxAtT(tAt(c.att) - 5)), Math.min(S.signal.n - 1, idxAtT(tAt(c.att) + span))];
      const zr = _zoomRange("SMT", [fast, slow].map(c => [idxAtT(tAt(c.att) + 6), win(c)[1]]));
      const pair = slow.letdown - fast.letdown >= 20;
      const fig = c => { const [a, b] = win(c); return figTrace({ i0: a, i1: b, xFrom: c.att, chs: ["SMT"], yMin: zr[0], yMax: zr[1], height: pair ? 230 : 210, width: pair ? 520 : 760,
        phases: _phOf(c).filter(q => q[0] === "Let-down" || q[0] === "Peak flow"), marks: [[c.att, "Cluster on"], [c.pf, "Full flow"]],
        title: _Who(c) + " — full flow after " + hms(c.letdown) }); };
      if (pair) {
        p.append(el("div", { class: "figpair" }, [fig(fast), fig(slow)]));
        ht(p, "Time runs from cluster-on (0:00); the blue line is the vacuum at the teat end. It jumps as each cup goes on, then settles. When milk starts to flow the line falls to a lower working level — the milk absorbs part of the vacuum. Compare how long each cow takes to reach the <b>Full flow</b> marker. In the peak-flow stretch the blue band is the 36–42 kPa reference: the line is darker where it runs above it and lighter, dashed where it runs below.");
        p.append(para("Left: the fastest let-down on this unit. Right: the slowest. Time is counted from cluster-on; the vacuum scale is zoomed to the working range so the fall in teat-end vacuum as milk starts to flow can be seen. On the right the teat end stays near its no-flow level for longer before milk arrives to absorb the vacuum — the cups are on and pulling while little milk is coming.", "src"));
      } else {
        p.append(fig(slow));
        ht(p, "Time runs from cluster-on (0:00). The teat-end vacuum (blue) falls to a lower working level once milk flows; the <b>Full flow</b> marker is where it stops falling.");
        p.append(para("Every milking on this unit reached full flow within " + hms(slow.letdown) + " — the slowest is shown.", "src"));
      }
      const slowList = L.filter(c => slowLetdown(c, H));
      p.append(h3("On this unit"));
      p.append(para(T("letdown_slow_gap") == null ? "The slow let-down listing is switched off under Thresholds; the fastest and slowest milkings are shown above." : slowList.length
        ? (L.length - slowList.length) + " of " + L.length + " milkings reached full flow within " + hms((H.letdown || 0) + T("letdown_slow_gap")) + " (the unit's median plus the slow let-down rule set under Thresholds). " + slowList.length + " took longer: " +
          slowList.map(c => _who(c) + " " + hms(c.letdown)).join(", ") + ". In Fernandes et al. 2023, cows with bimodal milking gave less milk per milking (12.6 against 15.7 kg) — an association, not a proven cause. Watch the preparation of these cows: lag from first touch to cluster-on, and whether forestripping is done (about 10 seconds per cow, Becker 2026)."
        : "Every milking reached full flow within " + hms((H.letdown || 0) + T("letdown_slow_gap")) + " of cluster-on — the unit's median plus the slow let-down rule set under Thresholds."));
      p.append(para("Read the let-down figure with one caution. The VaDia Suite rule stops at the first 10-second period in which teat-end vacuum no longer falls — and a vacuum that falls, then rises again, also stops it. A delayed let-down can therefore be read as a prompt one. The Bimodal section below shows the first two minutes of every milking so it can be checked by eye.", "small muted"));
      out.push(p);
    }

    /* ---- liner ---- */
    const LF = [];
    const pfLen = (c, om) => tAt(om != null ? om : c.to) - tAt(c.pf);
    MT.forEach(c => { if (c.mpc && c.mpc.fav != null) LF.push({ c, ch: "MPC", om: c.om1, fav: c.mpc.fav, mean: c.mpc.mean, cls: c.mpc.cls, len: pfLen(c, c.om1) });
                      if (c.mpc2 && c.mpc2.fav != null) LF.push({ c, ch: "MPC2", om: c.om2, fav: c.mpc2.fav, mean: c.mpc2.mean, cls: c.mpc2.cls, len: pfLen(c, c.om2) }); });
    if (LF.length) {
      const l = sec("Liner quality, design and fit", "The only part of the machine that touches the cow");
      l.append(para("The liner does two jobs at every pulsation cycle: it opens to let milk flow, and it collapses under the teat to massage it. How well it does both depends on how its mouthpiece and barrel suit the teats. Pulsation cannot work if a teat is too long for the liner to collapse fully beneath it, or too short to be compressed by it (Mein et al. 2004). Liners also change as they wear, so liner age matters as well as liner model."));
      l.append(para("VaDia measures fit directly: a tap in the mouthpiece chamber — the space between the liner lip and the teat — records the vacuum around the base of the teat. Rønningen & Postma classed it as low (below 10 kPa), medium (10–30 kPa) and high (above 30 kPa). In their field study of many herds, the share of cows in the medium class was a very strong indicator of udder health at herd level. High mouthpiece vacuum became more likely as teats got shorter and thinner, low vacuum as they got longer and thicker, and the liner type made a significant difference. Their advice where results are poor: select a liner more suitable for the teats in the herd."));
      // examples need at least a minute of peak flow on the teat shown, so the picture shows a fit, not a moment
      const pool = LF.filter(e => e.len >= 60).length >= 2 ? LF.filter(e => e.len >= 60) : LF;
      const sorted = pool.slice().sort((p2, q) => q.fav - p2.fav), best = sorted[0], worst = sorted[sorted.length - 1];
      const fig = e => figTrace({ i0: Math.max(0, idxAtT(tAt(e.c.att) - 3)), i1: Math.min(S.signal.n - 1, idxAtT(tAt(e.c.end) + 3)), xFrom: e.c.att,
        chs: ["SMT", e.ch], yMax: 55, height: 210, band: [T("mpcFav_lo"), T("mpcFav_hi")],
        phases: milkingPhases({ attach: e.c.att, peakStart: e.c.pf, overmilkStart: e.om, takeoff: e.c.to, end: e.c.end }),
        title: _Who(e.c) + ", " + (e.ch === "MPC" ? "first" : "second") + " teat — " + fmt(e.fav, 0) + " % of its " + hms(e.len) + " peak flow in the favourable band (" + e.cls + " class)" });
      if (best !== worst && best.fav - worst.fav >= 15) {
        l.append(fig(best)); l.append(fig(worst));
        ht(l, "The red (first teat) or black (second teat) line is the vacuum around the base of the teat; the green band is the favourable 10–30 kPa range. Inside the band during peak flow is the class associated with a liner that suits the teat. <b>Darker, above the band</b> — the high class, typical of a liner gripping or riding up. <b>Lighter and dashed, below</b> — the low class, typical of one sitting loose (Rønningen &amp; Postma). Blue is the teat-end vacuum, for reference.");
        l.append(para("Top: the best liner fit recorded on this unit. Bottom: the worst. The green band is the favourable 10–30 kPa range for the mouthpiece (red or black line). " +
          "Peak flow and overmilking are shown for the teat being measured — each quarter empties at its own time. " + (worst.mean > T("mpcFav_hi") ? "In the lower picture the mouthpiece sits above the band — the high class." : worst.mean < T("mpcFav_lo") ? "In the lower picture the mouthpiece sits below the band — the low class." : "In the lower picture the mouthpiece spends much of peak flow outside the band."), "src"));
      } else { l.append(fig(worst)); l.append(para("Liner fit was similar on every milking; the weakest is shown.", "src")); }
      l.append(h3("On this unit"));
      const clsTxt = (cl, nm) => nm + ": " + cl.medium + " medium, " + cl.high + " high, " + cl.low + " low";
      const parts = [];
      if (H.mpcFav != null) parts.push("first teat " + fmt(H.mpcFav, 0) + " %");
      if (H.mpc2Fav != null) parts.push("second teat " + fmt(H.mpc2Fav, 0) + " %");
      l.append(para("Median time in the favourable band during peak flow: " + parts.join(", ") + " (target 80 % or more, action level below 70 % — VaDia 2 guide). Milkings by class — " +
        [H.mpcFav != null ? clsTxt(H.classes[0], "first teat") : null, H.mpc2Fav != null ? clsTxt(H.classes[1], "second teat") : null].filter(Boolean).join("; ") + "." +
        (H.mpcClimb != null && H.mpcClimb > 2 ? " Once the quarter empties, mouthpiece vacuum rises by " + fmt(H.mpcClimb) + " kPa on the median milking — consistent with the liner climbing the teat while the cluster stays on, which is where overmilking and liner fit meet." : "")));
      const m = S.meta;
      l.append(para(m.liner || m.linerAge
        ? "Liner fitted: " + (m.liner || "model not recorded") + (m.linerAge ? "; " + m.linerAge + " milkings since change" : "") + ". Compare it against the teat sizes in this group, and the age against the liner maker's replacement interval."
        : "Liner model and age were not entered. Add them under Farm details so this section can name the liner the results belong to.", m.liner || m.linerAge ? "" : "small muted"));
      out.push(l);
    }

    /* ---- overmilking ---- */
    const O = _byN(MT, c => c.overmilk);
    if (O.length && H.overmilk != null) {
      const o = sec("Overmilking", "The machine still on a quarter that has emptied");
      o.append(para("When a quarter empties, nothing flows to absorb the vacuum, so the full vacuum reaches the teat end. The teat is still being pulled and massaged with nothing to gain. Overmilking is associated with impaired circulation in the teat tissue, thicker teat ends and more hyperkeratosis (Uí Chearbhaill et al. 2026; Fernandes et al. 2023). Penn State Extension advises one minute or less."));
      o.append(para("VaDia sees it two ways, and this report uses both: the mouthpiece vacuum changes as the teat empties (the VaDia manual's rule), and teat-end vacuum climbs back to its no-flow level. One cluster serves four quarters and comes off only when the last one finishes, so the first quarter to empty waits for the others."));
      const agree = O.filter(c => c.omAgree), longest = (agree.length ? agree : O)[(agree.length ? agree : O).length - 1], shortest = O[0];
      const fig = c => figTrace({ i0: Math.max(0, idxAtT(tAt(c.att) - 3)), i1: Math.min(S.signal.n - 1, idxAtT(tAt(c.end) + 3)), xFrom: c.att,
        chs: ["SMT", "MPC"], yMax: 55, height: 220, phases: _phOf(c),
        levels: [[c.pf, c.om1 != null ? c.om1 : c.to, c.smtPF, "teat end while milk flows " + fmt(c.smtPF) + " kPa"],
                 c.om1 != null && c.smtOM != null ? [c.om1, c.to, c.smtOM, "after emptying " + fmt(c.smtOM) + " kPa"] : [0, 0, null, ""]],
        title: _Who(c) + " — " + hms(c.overmilk) + " of overmilking" + (c.yield != null ? " · " + fmt(c.yield) + " " + yUnit() : "") });
      o.append(fig(longest));
      ht(o, "The amber stretch starts when the monitored quarter emptied. Watch the red mouthpiece line change and the blue teat-end line climb to its dashed 'after emptying' level — the teat is now taking the full vacuum. The <b>dashed red line</b> is where take-off should have happened at the latest, one minute later (Penn State Extension); the deeper red shading after it is overmilking beyond that limit.");
      if (longest.overmilk - shortest.overmilk >= 30) o.append(fig(shortest));
      o.append(para("The amber stretch is overmilking: from the moment the monitored quarter emptied to the start of take-off. The dashed lines are the mean teat-end vacuum before and after. " +
        (longest.overmilk - shortest.overmilk >= 30 ? "Top: the longest overmilking on this unit" + (agree.length ? " where both signals agree" : "") + ". Bottom: the shortest." : ""), "src"));
      o.append(h3("On this unit"));
      const omLim = T("overmilk_warn") != null ? T("overmilk_warn") : 60;
      const over = O.filter(c => c.overmilk > omLim);
      o.append(para("Median overmilking " + hms(H.overmilk) + " (" + hms(_med(MT.map(c => c.overmilkSMT))) + " by teat-end vacuum), " + over.length + " of " + O.length + " milkings over " + hms(omLim) +
        (over.length ? ": " + over.map(c => _who(c) + " " + hms(c.overmilk)).join(", ") : "") + ". Teat-end vacuum rose from " + fmt(H.smtPF) + " kPa while milk flowed to " + fmt(H.smtOM) + " kPa after emptying." +
        (Y && Y.split ? " The " + Y.split.size + " lower-yield milkings were overmilked " + hms(Y.split.omLo) + " (median), the " + Y.split.size + " higher-yield ones " + hms(Y.split.omHi) +
          "; on higher-yield cows the vacuum method can start counting while milk is still flowing, so those figures may be overstated (Uí Chearbhaill et al. 2026)." : "")));
      o.append(para("What to look at: with automatic take-off, the removal flow threshold and delay — raising the threshold to 0.8 kg/min showed no adverse udder-health effect in twice-daily milking in the studies cited by Uí Chearbhaill et al. 2026. With manual removal, the milkers — manual removal averaged 223 s of overmilking against 64 s automatic in Fernandes et al. 2023. Either way, the claw air-bleed holes: clogged holes added 38 s on average in the same study."));
      out.push(o);
    }

    /* ---- bimodal ---- */
    if (L.length) {
      const b = sec("Bimodal milking pattern", "The first two minutes of every milking, side by side");
      b.append(para("Bimodal milking is defined on the milk-flow curve: flow rises as the cistern milk comes out, falls, then rises again when the rest of the milk is let down (Fernandes et al. 2023). It is a sign that the cluster went on before the cow was ready. Teat-end vacuum moves the other way to flow, so the same event shows as vacuum falling, recovering towards its no-flow level, then falling again. A recovery like that is consistent with a bimodal start — but it is also consistent with a slipping liner or a cow shifting her weight, so the pictures need reading, not counting."));
      const thr = T("bimodal_drop");
      const ER = new Map(L.map(c => [c, earlyRecovery(c)]));
      const grid = el("div", { class: "figgrid" });
      const bw = c => [Math.max(0, idxAtT(tAt(c.att) - 3)), Math.min(S.signal.n - 1, idxAtT(tAt(c.att) + 120), c.end)];
      const bz = _zoomRange("SMT", L.map(c => [idxAtT(tAt(c.att) + 6), bw(c)[1]]));
      L.slice().sort((p2, q) => p2.n - q.n).forEach(c => {
        const [a, e] = bw(c);
        grid.append(figTrace({ i0: a, i1: e, xFrom: c.att, chs: ["SMT"], yMin: bz[0], yMax: bz[1], width: 560, height: 200, marks: [[c.pf, "Full flow"]],
          title: _Who(c) + " · let-down " + hms(c.letdown) + (ER.get(c) ? " · early recovery " + fmt(ER.get(c).rise, 1) + " kPa" : "") }));
      });
      b.append(grid);
      ht(b, "Each picture is the first two minutes after cluster-on — teat-end vacuum only, on a zoomed scale. A clean start: the line drops once and stays down. A dip that climbs back up before dropping again is the shape to look for — consistent with a delayed or bimodal start, but also with a slipping liner or a cow moving.");
      b.append(para("Each picture runs from cluster-on to two minutes after it, on the same zoomed vacuum scale (" + bz[0] + "–" + bz[1] + " kPa), so the dips and recoveries in teat-end vacuum can be compared between cows.", "src"));
      b.append(h3("On this unit"));
      const slowList = L.filter(c => slowLetdown(c, H));
      const rec = L.filter(c => ER.get(c)).sort((p2, q) => ER.get(q).rise - ER.get(p2).rise);
      if (rec.length) b.append(para("Early recovery is how far teat-end vacuum climbed back after it first fell — from the lowest second in the half-minute after the cups were on and sealed to the highest second after it, within two minutes of cluster-on. Largest first: " +
        rec.slice(0, Math.min(4, rec.length)).map(c => _who(c) + " " + fmt(ER.get(c).rise, 1) + " kPa, peaking " + hms(ER.get(c).peakS) + " after cluster-on").join("; ") +
        "; smallest " + _who(rec[rec.length - 1]) + " " + fmt(ER.get(rec[rec.length - 1]).rise, 1) + " kPa. The largest ones are where a delayed or bimodal start is most likely — and where the liner and the cow's behaviour at attachment should be checked too."));
      b.append(para((slowList.length ? "The milkings with a slow let-down — " + slowList.map(_who).join(", ") + " — are the ones to look at first for a dip-and-recover shape. " : "No milking had a slow let-down, which makes a bimodal start less likely on this unit. ") +
        (thr == null ? "No published threshold turns this vacuum shape into a bimodal verdict, so none is given. Not enough documented information to interpret automatically. Expert review required. A user-defined threshold can be set under Thresholds; it will be labelled as such."
                     : "A user-defined threshold of " + fmt(thr) + " kPa is set (user-defined threshold — not universal); see the single-milking analysis for its result.")));
      b.append(para("To confirm bimodal milking, record milk flow at the same time — the parlor's electronic milk meters, or a portable flow meter — and compare the two curves.", "small muted"));
      out.push(b);
    }
  }

  /* ---- pulsation phases ---- */
  if (P.rate != null) {
    const pp = sec("Pulsation — the four phases a, b, c, d", "What happens to the liner at every cycle");
    pp.append(para("The pulsator switches the space around the liner between vacuum and air, about once a second. Each cycle has four phases, measured between reference levels 4 kPa from the bottom and the top of the pulsation-chamber wave (ISO 6690):"));
    pp.append(el("ul", { class: "phase-list" }, [
      ["a", "Opening", "vacuum builds in the pulsation chamber and the liner opens."],
      ["b", "Open — milking", "the chamber is at full vacuum, the liner is wide open and milk flows."],
      ["c", "Closing", "air is let in and the liner starts to close."],
      ["d", "Closed — massage", "the chamber is at atmospheric pressure and the collapsed liner presses on the teat end. This is the only part of the cycle that relieves the congestion vacuum causes; when pulsation fails to do it, congestion and oedema build in the teat wall and the teat canal closes more slowly (Mein et al. 2004). It must last at least 150 ms (ISO 5707)."]
    ].map(([k, t, d]) => el("li", null, [el("span", { class: "phk ph-" + k, text: k }), el("div", null, [el("strong", { text: t + " — " }), document.createTextNode(d)])]))));
    const mc = _byN(MT.filter(c => c.puls), c => c.machineOn);
    const pick = mc.length ? mc[Math.floor(mc.length / 2)] : null;
    const pf = pick ? figPulsation(pick) : null;
    if (pf) { pp.append(pf); ht(pp, "Read the two strips first — measured on top, standard below; the same phase should line up. Then follow the green line against the dashed standard wave: <b>darker</b> where it runs more than 4 kPa above it, <b>lighter and dashed</b> where it runs more than 4 kPa below (a visual aid, not a limit). In blue, teat-end vacuum rises and falls with every cycle; the blue band is its average ± 2.0 kPa, the tolerance in the VaDia 2 guide."); pp.append(para("Green is the pulsation chamber; blue is the vacuum at the teat end in the same moments. The top strip gives each measured phase and its length; the strip below it, and the dashed line, show the standard cycle started at the same moment — where the green line leaves the dashed one, that phase is longer or shorter than standard.", "src")); }
    pp.append(h3("Measured on this unit against the preset"));
    pp.append(phaseBars(P));
    const pd = pulsDiff(P); if (pd) pp.append(pd);
    const rows = ["a", "b", "c", "d"].map(k => {
      const tg = T(k + "_target"), tol = T(k + "_tol"), v = P[k];
      const st = tg == null ? "—" : Math.abs(v - tg) <= tol ? "inside" : "outside";
      return [k, fmt(v, 0) + " ms", fmt(v / (P.a + P.b + P.c + P.d) * 100, 1) + " %", tg == null ? "—" : fmt(tg, 0) + " ± " + fmt(tol, 0) + " ms", st];
    });
    pp.append(tableOf(["Phase", "Measured", "Share of cycle", (S.preset === "guide" ? "VaDia 2 guide" : "VaDia Suite default"), ""], rows));
    pp.append(para("Rate " + fmt(P.rate, 1) + " cycles/min; ratio " + fmt(P.ratioMilk, 1) + " % milk phase (a + b). d-phase " + fmt(P.d, 0) + " ms — " + (T("d_min") == null ? "no minimum set" : (P.d >= T("d_min") ? "meets" : "below") + " the " + fmt(T("d_min"), 0) + " ms minimum (" + threshSrc("d_min") + ")") + "." + (P.nExcluded ? " " + P.nExcluded + " of " + P.nFound + " cycles on the median milking were irregular and left out of the phase timing — see the technical audit." : "") +
      (H.bPhase != null && H.dPhase != null ? " Teat-end vacuum averaged " + fmt(H.bPhase) + " kPa while the liner was open (b) and " + fmt(H.dPhase) + " kPa while it was closed (d)." : "") +
      " The presets are reference settings, not this parlor's specification: where the measured phases differ, confirm what the pulsators were commissioned to before changing anything, and check with a dry pulsator test (ISO 6690)."));

  /* ---- cow by cow ---- */
  if (!H.notMTT) {

    const rowsC = M.map(c => {

      if (c.mpc && T("mpcFav_pct") != null && c.mpc.fav < T("mpcFav_pct")) notes.push("liner fit " + fmt(c.mpc.fav, 0) + " % (1st teat)");

      if (c.slips.length) notes.push(c.slips.length + " vacuum drops");
      if (c.reattach) notes.push("possible reattachment — not confirmed");
      if (aboveRef(c.smtPF, hi)) notes.push("teat-end vacuum " + fmt(c.smtPF) + " kPa");
      return [String(c.n), c.cow || "—"].concat(Y ? [c.yield != null ? fmt(c.yield) : "—"] : [],
        [hms(c.machineOn), !c.timingOK ? "—" : hms(c.letdown), !c.timingOK || c.overmilk == null ? "—" : hms(c.overmilk), notes.length ? notes.join("; ") : "nothing to note"]);
    });

  const dropEvidence=sec("Irregular fluctuations and observed events", "Automatic events and tester observations are separate");
  dropEvidence.append(para("During milking: "+H.ivfTot1M+" type-1 and "+H.ivfTot2M+" type-2 events using the implemented VaDia Suite chapter 22 rules. These totals exclude attachment/removal events and are not counts of confirmed slips; types may overlap."));
  dropEvidence.append(para("Supporting detail: "+H.slips+" vacuum drops met the 10 kPa / 0.25 s rule. "+cyclicRangeDetail(M)+" Normal cyclic movement can contribute to this count."));
  const observedCard=cardOf('observedSlips');
  if(observedCard)dropEvidence.append(para(observedCard.title+": "+observedCard.value),para(observedCard.farmer),para(observedCard.ref,'small muted'));
  out.push(dropEvidence);

  /* ---- action plan ---- */
  if (items.length) {
    const ap = sec("Action plan", "One line per finding — act, then repeat the test on the same unit");
    ap.append(tableOf(["#", "Action", "Finding", "Who"], items.map((x, k) => [String(k + 1), (x.checks && x.checks[0]) || "Review with the consultant.", x.title, WHO[x.group]])));

  lim.append(para("One logger on one cluster: these results describe this unit on this day. Vacuum is measured; milk flow is not — overmilking, let-down and bimodal patterns are read from vacuum by documented rules. Nothing here states compliance with any standard or links a reading to disease in a particular cow. The working behind every figure, its reference and how accurate it is are in the Technical audit and Method tabs.", "small muted"));
  out.push(lim);
  return out;
}

   TEACHING MODE — the reference behind every curve, and plain explanations.

   One switch (top bar). When on:
     • every trace shows the documented reference for each line — a band, not
       an invented curve: SMT 36–42 kPa during peak flow, MPC 10–30 kPa during
       peak flow, the standard pulsation cycle, the one-minute overmilking limit;
     • the measured line is drawn darker and thicker where it sits above its
       reference, lighter and dashed where it sits below;
     • hovering explains what is happening at that moment;
     • every chart has an ⓘ button that opens "how to read this chart";
     • the report adds "how to read this picture" under each figure and an

   Every explanation here comes from a source already cited in the report.

/* ------------------------------------------------------------ colour helpers */
function _hex(c) {
  c = String(c || "").trim();
  if (/^#[0-9a-f]{3}$/i.test(c)) c = "#" + c.slice(1).split("").map(x => x + x).join("");
  const m = c.match(/^#([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i);
  return m ? [parseInt(m[1], 16), parseInt(m[2], 16), parseInt(m[3], 16)] : [80, 80, 80];
}
/** f > 0 mixes toward black (darker), f < 0 toward white (lighter) */
function shadeCol(c, f) {
  const [r, g, b] = _hex(c), t = f > 0 ? 0 : 255, k = Math.abs(f);
  const mix = v => Math.round(v + (t - v) * k);
  return "rgb(" + mix(r) + "," + mix(g) + "," + mix(b) + ")";
}
/** stroke style for a zone: 1 above the reference, -1 below, 0 inside */
function zoneStyle(x, base, z, lw) {
  if (z > 0) { x.strokeStyle = shadeCol(base, .45); x.lineWidth = (lw || 2) + 1.4; x.setLineDash([]); }
  else if (z < 0) { x.strokeStyle = shadeCol(base, -.5); x.lineWidth = lw || 2; x.setLineDash([5, 3]); }
  else { x.strokeStyle = base; x.lineWidth = lw || 2; x.setLineDash([]); }
}
/** draw a polyline split into runs of equal zone */
function strokeZoned(x, pts, base, lw) {
  // pts: [[x, y, zone], …] with null entries breaking the line
  let run = [], zr = null;
  const flush = () => {
    if (run.length > 1) { zoneStyle(x, base, zr, lw); x.beginPath(); run.forEach(([px, py], j) => j ? x.lineTo(px, py) : x.moveTo(px, py)); x.stroke(); }
    run = [];
  };
  pts.forEach(p => {
    if (!p) { flush(); zr = null; return; }
    if (zr !== null && p[2] !== zr) { const last = run[run.length - 1]; flush(); run = [last]; }
    zr = p[2]; run.push(p);
  });
  flush(); x.setLineDash([]);
}

/* ------------------------------------------------------- references per line */
function bandFor(role) {
  if (role === "SMT" && T("smtPF_min") != null && T("smtPF_max") != null)
    return { lo: T("smtPF_min"), hi: T("smtPF_max"), name: "teat-end band " + fmt(T("smtPF_min"), 0) + "–" + fmt(T("smtPF_max"), 0) + " kPa", src: "VaDia 2 guide; Stewart et al. 1996 via DAIReXNET" };
  if (/^MPC/.test(role) && T("mpcFav_lo") != null && T("mpcFav_hi") != null)
    return { lo: T("mpcFav_lo"), hi: T("mpcFav_hi"), name: "favourable mouthpiece band " + fmt(T("mpcFav_lo"), 0) + "–" + fmt(T("mpcFav_hi"), 0) + " kPa", src: "Rønningen & Postma; VaDia Suite manual" };
  return null;
}
/** the stretch where those bands apply: start of peak flow to start of overmilking (or take-off) */
function peakWindow(m) {
  if (!m || m.peakStart == null) return null;
  const e = m.overmilkStart != null ? m.overmilkStart : m.takeoff != null ? m.takeoff : m.end;
  return e != null && e > m.peakStart ? [m.peakStart, e] : null;
}
/** the latest acceptable take-off: start of overmilking + the overmilking limit */
function ghostTakeoff(m) {
  if (!m || m.overmilkStart == null || m.takeoff == null) return null;
  const lim = T("overmilk_warn") != null ? T("overmilk_warn") : 60;
  const g = idxAtT(tAt(m.overmilkStart) + lim);
  return g < m.takeoff ? { i: g, lim } : null;
}
/** one-second running mean via prefix sums, for zone decisions that ignore the pulsation ripple */
function runningMean(arr, i0, i1, fs) {
  const a = Math.max(0, i0 - fs), b = Math.min(arr.length, i1 + fs);
  const P = new Float64Array(b - a + 1);
  for (let i = a; i < b; i++) P[i - a + 1] = P[i - a] + (isFinite(arr[i]) ? arr[i] : 0);
  const h = Math.round(fs / 2);
  return i => { const lo = Math.max(a, i - h), hi = Math.min(b, i + h); return hi > lo ? (P[hi - a] - P[lo - a]) / (hi - lo) : NaN; };
}

function anatomySection(A) {

  const pool = MT.filter(c => c.omAgree).length ? MT.filter(c => c.omAgree) : MT;
  const c = pool.slice().sort((p, q) => p.machineOn - q.machineOn)[Math.floor(pool.length / 2)];
  const smt = chArray("SMT"), mpc = chArray("MPC"), fs = S.signal.fs;
  const at = (arr, i) => runningMean(arr, i, i + 1, fs)(i);
  const mid = (a, b) => idxAtT((tAt(a) + tAt(b)) / 2);

  const ev = [];
  const add = (i, arr, text) => ev.push({ i, v: at(arr, i), text });
  add(idxAtT(tAt(c.att) + 1), smt, "<b>Cups on.</b> Teat-end vacuum jumps up as the cluster goes on. Each cup lets in a gulp of air — " + c.cupDrops + " sharp dip" + (c.cupDrops === 1 ? "" : "s") + " here" + (c.settle != null ? "; all four cups were sealed after " + fmt(c.settle, 1) + " s" : "") + ".");
  add(mid(c.att, c.pf), smt, "<b>Waiting for milk.</b> " + hms(c.letdown) + " from cluster-on to full flow. The cups are on and pulling while milk is still coming down; how long this takes depends mostly on preparation — 60–120 s from first touch to cluster-on is recommended (Penn State Extension).");
  add(idxAtT(tAt(c.pf) + 5), smt, "<b>Full flow.</b> Milk now absorbs part of the vacuum: teat-end vacuum settles at " + fmt(c.smtPF) + " kPa during peak flow (reference " + fmt(T("smtPF_min"), 0) + "–" + fmt(T("smtPF_max"), 0) + " kPa).");
  add(mid(c.pf, c.om1), mpc, "<b>Liner fit.</b> Around the base of the teat the mouthpiece holds " + fmt(c.mpc.mean) + " kPa — the " + c.mpc.cls + " class; " + fmt(c.mpc.fav, 0) + " % of peak flow inside the favourable 10–30 kPa band (Rønningen & Postma).");
  add(c.om1, mpc, "<b>Quarter empty.</b> Mouthpiece vacuum changes as the teat empties (VaDia Suite manual)" + (c.smtOM != null ? " and teat-end vacuum climbs to " + fmt(c.smtOM) + " kPa — with no milk left, the teat takes the full vacuum" : "") + ".");

  sec.append(el("p", { text: "This is " + (c.cow ? "cow " + c.cow + ", " : "") + "milking " + c.n + " — the middle milking by length among those where both overmilking signals agree. Follow the numbers along the trace." }));

/* ==========================================================================
   THE SIX VADIA TESTS — one recording, the test you choose.

   VaDia Suite offers six analyses on a recording: Milking Time Test, Pulsator
   Test, Fall Off Test, Milking Parlour Efficiency, Slug Test and Milkflow
   Resistance Test. Two of them (MTT, MPE) work on any milking recording; the
   Pulsator Test works on any recording where a tap pulsates (dry, or wet during
   milking); Fall Off, Slug and Resistance need their own set-up in the parlor,
   so this module says plainly when the loaded recording does not hold them.

   What is checked against VaDia Suite's own stored results (this installation's
   database) is stated per test in its "How it is measured" section:
     MPE   Sun Dairy: 14 of 14 milking times and 13 of 13 loading times within
           2 s; turns per hour 4.72 against VaDia's 4.73 (VaDia sums whole seconds).
     PT    Limping = highest minus lowest (a+b) ratio of the channels in the test:
           24 of 24 stored tests reproduced from VaDia's own phase times.
           Phase times: dry pulsation within a few ms; wet (during milking) the
           a-phase reads ~25 ms longer than VaDia's per-cow tests — not resolved.
     MRT   formula from the manual (ch. 20); no stored record could be matched.
     FOT, ST  no stored VaDia result exists on this installation; definitions
           are ParlorLens's and are printed with every figure.
   ========================================================================== */

const TESTS = [
  ["MTT", "Milking Time Test"], ["PT", "Pulsator Test"], ["FOT", "Fall Off Test"],
  ["MPE", "Milking Parlour Efficiency"], ["ST", "Slug Test"], ["MRT", "Milkflow Resistance Test"]

const testName = id => (TESTS.find(t => t[0] === id) || [id, id])[1];

/* ------------------------------------------------ per-second swing, cached */
function secSwing() {
  const s = S.signal; if (!s) return [];
  if (S._swingFor === s && S._swing) return S._swing;
  S._swing = s.ch.map(a => {
    const r = new Float32Array(s.nBlocks);
    for (let b = 0; b < s.nBlocks; b++) {
      let mn = Infinity, mx = -Infinity;
      for (let i = b * s.fs, e = Math.min(s.n, (b + 1) * s.fs); i < e; i++) { const v = a[i]; if (v < mn) mn = v; if (v > mx) mx = v; }
      r[b] = mx > mn ? mx - mn : 0;
    }
    return r;
  });

const PULS_SWING = 15;   // kPa per second: a pulsation tube swings the working range (35–50 kPa); a milk or mouthpiece tap a few kPa
function pulsatingIn(i0, i1) {
  const s = S.signal, sw = secSwing(), b0 = Math.floor(i0 / s.fs), b1 = Math.max(b0 + 1, Math.ceil(i1 / s.fs));
  return s.ch.map((_, c) => c).filter(c => {
    if (S.mapping[c] === "OFF") return false;
    const v = Array.from(sw[c].slice(b0, b1)).sort((a, b) => a - b);
    return v.length && v[Math.floor(v.length / 2)] > PULS_SWING;

}

function pulsRuns() {
  const s = S.signal, sw = secSwing(), nb = s.nBlocks, on = new Uint8Array(nb);
  for (let b = 0; b < nb; b++) on[b] = sw.some((r, c) => S.mapping[c] !== "OFF" && r[b] > PULS_SWING) ? 1 : 0;
  const gap = b => b + 1 < nb && s.blockT[b + 1] - s.blockT[b] > 1.5;
  const runs = []; let b = 0;
  while (b < nb) {
    while (b < nb && !on[b]) b++;
    if (b >= nb) break;
    const st = b; let last = b;
    while (b < nb) {
      if (on[b]) { last = b; if (gap(b)) { b++; break; } b++; continue; }
      let h = b; while (h < nb && !on[h] && h - b < 2) h++;          // a hole of up to 2 s does not end the run
      if (h < nb && on[h] && h - b < 2) { b = h; continue; }
      break;
    }
    if (last - st + 1 >= 5) runs.push([st * s.fs, Math.min(s.n, (last + 1) * s.fs)]);
    b = Math.max(b, last + 1);
  }
  return runs;
}

/* Offline Word export. Works on sharedReportSnapshot() — exactly what prints — and turns it into a

   · a block whose content is only text and inline markup becomes ONE paragraph of formatted runs
     (bold, italic, monospace, status colours), never one paragraph per text fragment;
   · label/value lists (dl, .kvlist), label + text rows and cards (tiles) become two-column tables;
   · report tables stay tables (header row repeated, widths from their content, numbers right-aligned);
   · list items keep a bullet (numbered lists keep their numbers);

  SKIP: ".noprint,.print-footer,button,input,select,textarea,script,style,template,[hidden]",

  NOTE: { base: ["0B5FA5", "E4EEF7"], warn: ["8A5A04", "FBF0D9"], crit: ["A62119", "FBE6E4"], ok: ["12704F", "E0F0E8"] },

function sharedReportSnapshot(root, all=false){
 const clone=root.cloneNode(true);
 // pair every live element with its copy in document order — before anything is removed from the copy
 const pairs=sel=>{const a=root.querySelectorAll(sel),b=clone.querySelectorAll(sel);return a.length===b.length?Array.from(b,(c,i)=>[a[i],c]):[];};
 const size=(o,c)=>{const r=o.getBoundingClientRect();if(r.width>0&&r.height>0){c.setAttribute('data-w',String(Math.round(r.width)));c.setAttribute('data-h',String(Math.round(r.height)));}};
 // SVG charts take their colours from CSS classes and variables, which a serialized SVG loses: write each element's computed style inline
 pairs('svg').forEach(([o,c])=>{const oe=[o,...o.querySelectorAll('*')],ce=[c,...c.querySelectorAll('*')];if(oe.length===ce.length)oe.forEach((e,i)=>{const cs=getComputedStyle(e);SVG_STYLE_PROPS.forEach(p=>{const v=cs.getPropertyValue(p);if(v)ce[i].style.setProperty(p,v);});});size(o,c);

 // a label typed into the report (pulsator names) prints as text; every other form control is dropped below

 clone.querySelectorAll('.noprint,.visit-excluded,.atabs,.page-head,.helpbtn,button,input,select,textarea,script').forEach(n=>n.remove());

}

/** Farm report for one recording: the full farm write-up — result, findings and action plan first,

function farmReportClose(){const s=FARM_ABOUT||rsecA('About this report','');FARM_ABOUT=null;s.append(contactBlock());return s;}

/* Read-only waveform preview: no marker, threshold or analysis changes. */
function channelPreview(c){
 const a=S.signal?.ch[c];if(!a?.length)return el('span',{text:'No signal'});
 const width=300,height=56,step=Math.max(1,Math.ceil(a.length/width));let points=[];
 for(let x=0;x<width;x++){const first=x*step;if(first>=a.length)break;let max=-Infinity;for(let i=first;i<Math.min(a.length,first+step);i++)if(Number.isFinite(a[i]))max=Math.max(max,a[i]);if(Number.isFinite(max))points.push(x+','+(height-4-Math.max(0,Math.min(60,max))/60*(height-8)));}
 const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('viewBox','0 0 300 56');svg.setAttribute('class','channel-preview');svg.setAttribute('role','img');svg.setAttribute('aria-label','Channel '+(c+1)+' whole-recording overview, 0 to 60 kPa; use Advanced channels for detail');
 const line=document.createElementNS(svg.namespaceURI,'polyline');line.setAttribute('points',points.join(' '));line.setAttribute('fill','none');line.setAttribute('stroke',['#2378b9','#b06a14','#27835e','#9759a6'][c]);line.setAttribute('stroke-width','1.5');svg.append(line);return svg;
}
