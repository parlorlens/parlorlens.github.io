    how: "Start of take-off to end of milking, by the VaDia manual's rules.",
    farmer: "The time from the unit starting to come off until vacuum at the teat is gone.",
    cow: "", checks: []
  }));

  /* ================================================================ VACUUM */
  const lo = T("smtPF_min"), hi = T("smtPF_max");
  const vOut = list(c => outsideRef(c.smtPF, lo, hi));
  out.vacuum.push(card({
    id: "smtPF", title: "Teat-end vacuum during peak flow",
    value: K_(H.smtPF) + " kPa median (range " + K_(H.smtPFR && H.smtPFR[0]) + "–" + K_(H.smtPFR && H.smtPFR[1]) + ")",
    status: H.smtPF == null ? "info" : outsideRef(H.smtPF, lo, hi) ? "warn" : (lo == null || hi == null ? "info" : "ok"),
    ref: lo == null || hi == null ? "Reference range incomplete — " + (lo == null && hi == null ? "no limits set" : "only the " + (lo == null ? "upper" : "lower") + " limit is set") + "; a blank limit is not assessed." : fmt(lo, 0) + "–" + fmt(hi, 0) + " kPa (VaDia 2 guide) — 10.5–12.5 inHg, described as the best combination of rapid, complete milk removal with minimal physical harm (Stewart et al. 1996, via DAIReXNET).",
    src: ["guide", "dairex"],
    how: "Mean short-milk-tube vacuum from start of peak flow to start of overmilking. Reproduces VaDia Suite's own figure to within 0.1 kPa on 7 of 9 test milkings.",
    cows: vOut,
    farmer: aboveRef(H.smtPF, hi) ? "Teat-end vacuum sits above the recommended band on most milkings. Milk-out may be fast, but the teats are working harder than they need to." : belowRef(H.smtPF, lo) ? "Teat-end vacuum sits below the recommended band, which can slow milk-out." : "Teat-end vacuum sits inside the recommended band.",
    cow: "This is the vacuum the teat end feels while milk is actually flowing.",
    checks: aboveRef(H.smtPF, hi) ? ["Compare system vacuum with what the milkline height calls for; the installer's specification is the reference, not a default.",
      "Check that take-off is not late — the teat spends longer at high vacuum when it is."]
      : belowRef(H.smtPF, lo) ? ["Check vacuum reserve and regulator response under load.", "Check the milk path from liner to milkline for restrictions."] : []
  }));

  out.vacuum.push(card({
    id: "smtOM", title: "Teat-end vacuum once the quarter is empty",
    value: K_(H.smtOM) + " kPa median, against " + K_(H.smtPF) + " kPa during peak flow", status: "info",
    ref: "No published limit. With no milk flowing, system vacuum reaches the teat end directly (Uí Chearbhaill et al. 2026).",
    src: ["uic"], how: "Mean short-milk-tube vacuum from start of overmilking to start of take-off.",
    farmer: "The difference is the vacuum the milk itself was absorbing. Once it stops, the teat takes the full load.",
    cow: "This is what the teat end feels during overmilking.", checks: []
  }));

  const cvfSide = Math.max(H.cvfAbove || 0, H.cvfBelow || 0);
  // the thresholds are peak-to-peak; VaDia reports either side of the mean, so each side gets half
  const cvfW = T("cvf_warn") != null ? T("cvf_warn") / 2 : null, cvfC = T("cvf_crit") != null ? T("cvf_crit") / 2 : null;
  out.vacuum.push(card({
    id: "cvf", title: "Cyclic vacuum fluctuation",
    value: "+" + K_(H.cvfAbove, 2) + " / −" + K_(H.cvfBelow, 2) + " kPa around " + K_(H.cvfAvg) + " kPa",
    status: H.cvfAbove == null || cvfW == null ? "info" : cvfSide <= cvfW ? "ok" : (cvfC == null || cvfSide <= cvfC) ? "warn" : "crit",
    ref: cvfW == null ? "No tolerance set." : "±" + fmt(cvfW, 1) + " kPa" + (cvfC != null ? "; action level above ±" + fmt(cvfC, 1) + " kPa" : "") + " (" + threshSrc("cvf_warn") + " — the guide gives ±1.5–2.0). VaDia Suite reports this figure as fluctuation above and below the average.",
    src: ["guide", "manual"],
    how: "Exactly as VaDia Suite: ten pulsation cycles starting 60 s after start of peak flow; per-cycle minimum, mean and maximum of teat-end vacuum, averaged.",
    cows: list(c => c.cvf && cvfW != null && Math.max(c.cvf.above, c.cvf.below) > cvfW),
    farmer: cvfW != null && cvfSide > cvfW ? "Teat-end vacuum swings more than it should with every pulsation cycle." : "Teat-end vacuum is steady through each pulsation cycle.",
    cow: "Every second the liner opens and closes, and the vacuum at the teat end rises and falls with it. In bacterial-challenge studies, large cyclic and irregular fluctuations together raised new infections far more than either did alone (Mein et al. 2004).",
    checks: cvfW != null && cvfSide > cvfW ? ["Inspect liner condition and age.", "Check the claw air vent for partial blockage.", "Check short milk tubes and claw for kinks or restriction."] : []
  }));

  const i1W = T("ivf1_max"), i1C = T("ivf1_crit"), i2W = T("ivf2_max");
  out.vacuum.push(card({
    id: "ivf", title: "Irregular vacuum fluctuations during milking",
    value: K_(H.ivf1M, 0) + " type 1 / " + K_(H.ivf2M, 0) + " type 2 per milking (median). VaDia-comparable totals including attachment: " +
           K_(H.ivf1, 0) + " / " + K_(H.ivf2, 0),
    status: H.ivf1M == null || i1W == null ? "info" : (i1C != null && H.ivf1M > i1C ? "crit" : (H.ivf1M > i1W || (i2W != null && H.ivf2M > i2W)) ? "warn" : "ok"),
    ref: i1W == null ? "No limits set." : "Type 1: 0–" + fmt(i1W, 0) + " per milking" + (i1C != null ? ", more than " + fmt(i1C, 0) + " flags possible major air entry" : "") + ". Type 2: 0–" + fmt(i2W, 0) + " per milking (" + threshSrc("ivf1_max") + "). Judged on events during milking only.",
    src: ["guide", "manual"],
    how: "VaDia Suite's own definitions: type 1 a fall of at least 21 kPa at 100 kPa/s or faster; type 2 at least 14 kPa at 56 kPa/s. Counted over the whole milking these reproduce VaDia Suite's counts. But in this recording " +
         (H.ivfTot1 - H.ivfTot1M) + " of " + H.ivfTot1 + " type-1 events fell in the first " + VD.ATTACH_WINDOW_S +
         " s after attachment — teatcups going on, not liners slipping. The verdict therefore uses only events between attachment and take-off.",
    cows: list(c => i1W != null && (c.ivf1M > i1W || (i2W != null && c.ivf2M > i2W))),
    farmer: "Sudden sharp drops in teat-end vacuum while the cow is being milked — consistent with air entry, liner slips or a cup being disturbed; the signal alone does not confirm the cause.",
    cow: "Air rushing in can drive milk droplets back against neighbouring teat ends (Mein et al. 2004).",
    checks: i1W != null && (H.ivf1M > i1W || (i2W != null && H.ivf2M > i2W)) ? ["See the liner slip item under Liner & cluster for when in the milking they happen and what that points to."] : []
  }));

  out.vacuum.push(card({
    id: "sysvac", title: "System vacuum (seen at the pulsation chamber)",
    value: K_(H.sysVac) + " kPa median", status: "info",
    ref: "No universal target — the right level depends on milkline height and parlor design. Compare with the installer's specification for this parlor.",
    src: [], how: "Median of the per-cycle maximum in the pulsation chamber, which reaches system vacuum each cycle.",
    farmer: "The vacuum the whole parlor is running at.", cow: "", checks: []
  }));

  out.vacuum.push(card({
    id: "pathloss", title: "Vacuum lost between system and teat end during peak flow",
    value: K_(H.pathLoss) + " kPa median", status: "info",
    ref: "No published limit.", src: [],
    how: "System vacuum minus teat-end vacuum during peak flow.",
    farmer: "The vacuum used up moving milk through the liner, short milk tube, claw and long milk tube. A large or rising figure points at restrictions in that path.",
    cow: "", checks: []
  }));

  if (H.slips) out.vacuum.push(card({
    id: "recover", title: "Recovery after sudden vacuum drops",
    value: K_(H.recover) + " s median", status: "info", ref: "No published limit.", src: [],
    how: "Time for teat-end vacuum to return within 2 kPa of its level before each detected vacuum drop.",
    farmer: "How quickly the regulator and vacuum reserve restore vacuum after air gets in.", cow: "", checks: []
  }));

  /* ======================================================== LINER & CLUSTER */
  const fav = H.mpcFav, fav2 = H.mpc2Fav, favAlt = H.mpcFavAlt;
  const fT = T("mpcFav_pct"), fC = T("mpcFav_pct_crit"), bLo = T("mpcFav_lo"), bHi = T("mpcFav_hi");
  const gF = v => v == null || fT == null ? null : v >= fT ? "ok" : (fC == null || v >= fC) ? "warn" : "crit";
  const s1 = fav == null ? null : (gF(fav) === gF(favAlt) ? gF(fav) : "borderline");
  const s2 = gF(fav2);
  const rank = { ok: 0, borderline: 1, warn: 2, crit: 3 };
  const mpcStatus = s1 == null && s2 == null ? "info" : [s1, s2].filter(Boolean).sort((a, b) => rank[b] - rank[a])[0];
  const worstTeat = s2 && (!s1 || rank[s2] > rank[s1]) ? "second" : "first";
  const cls = H.classes[0], cls2 = H.classes[1];
  const clsTxt = c => c.medium + " medium · " + c.high + " high · " + c.low + " low";
  out.liner.push(card({
    id: "mpc", title: "Liner fit — mouthpiece chamber vacuum",
    value: (fav == null ? "—" : "First teat " + fmt(fav, 0) + " % of peak flow in the 10–30 kPa band") +
           (favAlt != null && Math.abs(favAlt - fav) >= 1 ? " (" + fmt(favAlt, 0) + " % if peak flow ends where teat-end vacuum says milk stopped)" : "") +
           (fav2 != null ? "; second teat " + fmt(fav2, 0) + " %" : ""),
    status: mpcStatus,
    ref: fmt(bLo, 0) + "–" + fmt(bHi, 0) + " kPa is the favourable class, above it high, below it low (" + threshSrc("mpcFav_lo") + "; Rønningen & Postma). Time in band: " + fmt(fT, 0) + " % or more" + (fC != null ? "; action level below " + fmt(fC, 0) + " %" : "") + " (" + threshSrc("mpcFav_pct") + ").",
    src: ["ronning", "manual", "guide"],
    how: "Share of the peak-flow period with mouthpiece vacuum between 10 and 30 kPa, exactly as VaDia Suite defines it — each mouthpiece channel measured up to its own overmilking marker. Reproduced VaDia Suite's figure within 5 points on 8 of 9 test milkings (first teat) and within 3 points on 7 of 9 (second teat). The verdict is the worse of the two teats. Class by the milking's mean: first teat " + clsTxt(cls) + (fav2 != null ? "; second teat " + clsTxt(cls2) : "") + ".",
    cows: list(c => fT != null && ((c.mpc && c.mpc.fav < fT) || (c.mpc2 && c.mpc2.fav < fT))),
    farmer: (mpcStatus !== "ok" && mpcStatus !== "info" ? "The weaker result is on the " + worstTeat + " teat monitored. " : "") + "This is the best single view of whether the liners suit this herd's teats. In the TINE / BioControl work, the share of cows in the medium class was a very strong indicator of udder health at herd level, and inadequate liner choice showed up as herds with mostly high or mostly low mouthpiece vacuum (Rønningen & Postma).",
    cow: "The mouthpiece sits around the base of the teat. Medium vacuum there is the class associated with a liner that suits the teat; high is typical of a liner gripping or riding up; low of one sitting loose (Rønningen & Postma).",
    checks: fT != null && ((fav != null && fav < fT) || (fav2 != null && fav2 < fT)) ? [
      "Compare the liner model against the teat sizes in this group — mouthpiece vacuum is mostly a liner-to-teat fit question.",
      "Record liner age in milkings; worn liners change their fit.",
      "Look at cluster alignment on the stalls with the worst figures."] : []
  }));

  const observedRate=observedIncidentRate(), observedLimit=T('slips_per100'), obs=S.observedIncidents||{};
  out.liner.push(card({id:'observedSlips',title:'Observed slips and fall-offs',
    value:observedRate==null?'Not assessed — enter observed events and cow-milkings':fmt(observedRate,1)+' per 100 observed cow-milkings ('+obs.slips+' slips + '+obs.falloffs+' fall-offs / '+obs.milkings+' observed milkings)',
    status:observedRate==null||observedLimit==null?'info':observedRate>observedLimit?'warn':'ok',
    ref:observedLimit==null?'No observed-event limit set.':'Compared with the selected slips/fall-offs limit of '+fmt(observedLimit,1)+' per 100 ('+threshSrc('slips_per100')+').',
    src:['dairex'],how:'Operator observations only. Automatic vacuum drops and suspected reattachments are not added.',cows:[],
    farmer:observedRate==null?'No field-observation verdict is available.':observedLimit==null?'Observed rate reported without a limit.':observedRate>observedLimit?'The observed rate exceeds the selected limit; investigate the circumstances recorded by the tester.':'The observed rate is within the selected limit for the milkings watched.',cow:'',checks:[]
  }));
  const slipRate = N ? H.slips / N * 100 : null;
  out.liner.push(card({
    id: "slips", title: "Supporting detail: 10 kPa vacuum drops",
    value: H.slips + " in " + N + " milkings = " + K_(slipRate, 0) + " per 100 (" + H.slipsEarly + " in the first half of milking, " +
           H.slipsLate + " in the second); " + H.reattach + " suspected reattachments listed separately. " + cyclicRangeDetail(M),
    status: "info",
    ref: "A problem exists above 5–10 slips or fall-offs per 100 cow-milkings that need correcting (Mein & Reid 1996, via DAIReXNET). The logger counts every drop of 10 kPa or more within 0.25 s (the definition Baxter et al. 1992 used, via Mein et al. 2004) — including ones nobody had to correct — so this event count alone cannot establish compliance with that field-observation limit. Suspected reattachments are excluded.",
    src: ["dairex", "mein"],
    how: "Counted on teat-end vacuum after the first " + VD.ATTACH_WINDOW_S + " s (cups going on) and before take-off. Short-gap reattachment candidates are reported separately; they are not confirmed fall-offs.",
    cows: list(c => c.slips.length > 0),
    farmer: "Vacuum drops may indicate liner slips or air entry, but the logger does not establish which events needed correction. Observe this unit and check cow notes before judging compliance or recommending parts.",
    cow: "When a cup slips, air rushing in can drive droplets of milk from the claw up against the ends of the other teats (Mein et al. 2004).",
    checks: (H.slipsEarly ? ["Slips early in milking most often come from low vacuum, blocked air vents or restrictions in the short milk tube (Mein & Reid 1996)."] : [])
      .concat(H.slipsLate ? ["Slips late in milking most often come from poor cluster alignment, poor liner condition or uneven weight on the cluster (Mein & Reid 1996)."] : [])
  }));

  out.liner.push(card({
    id: "climb", title: "Mouthpiece vacuum at the end of milking",
    value: (H.mpcClimb == null ? "—" : (H.mpcClimb >= 0 ? "+" : "") + fmt(H.mpcClimb) + " kPa") + " from peak flow to overmilking", status: "info",
    ref: "No published limit. When the teat empties there is ordinarily a shift in mouthpiece vacuum level, a marked change in its fluctuation, or both (VaDia Suite manual).",
    src: ["manual"], how: "Mean mouthpiece vacuum during overmilking minus mean during peak flow.",
    farmer: "A large rise means the liner is climbing the teat once the quarter empties.",
    cow: "", checks: []
  }));

  if (H.qGap != null) out.liner.push(card({
    id: "quarter", title: "Quarters finishing at different times",
    value: (H.qGap >= 0 ? "second teat overmilked " + S_(H.qGap) + " longer" : "first teat overmilked " + S_(-H.qGap) + " longer") + " (median)",
    status: "info", ref: "No published limit. Overmilking is a quarter-level event (Uí Chearbhaill et al. 2026).",
    src: ["uic", "manual"], how: "Start of overmilking on each mouthpiece channel, by the VaDia manual's rule — one marker per channel, as VaDia Suite does.",
    farmer: "One cluster serves four quarters and comes off when the last one finishes. The quarter that empties first is overmilked for all the time the others take.",
    cow: "", checks: []
  }));

  if (H.notMTT) {
    out.milker = []; out.liner = [];
    out.vacuum = out.vacuum.filter(x => ["smtPF", "cvf", "sysvac", "pathloss"].includes(x.id))
      .map(x => Object.assign(x, { status: "info", farmer: "Measured on a recording that does not show a teat in a liner — reported as a machine measurement, not judged against limits set for cows." }));
    out.parlor = [];
  }

  /* ============================================================= PULSATION */
  const P = H.puls;
  if (P.rate != null) {
    const pr = (id, title, v, u, target, tol, src, how, farmer) => out.pulsation.push(card({
      id, title, value: K_(v, u === "ms" ? 0 : 1) + " " + u,
      status: tolBand(v, target, tol) === "na" ? "info" : tolBand(v, target, tol) === "ok" ? "ok" : tolBand(v, target, tol) === "warn" ? "warn" : "warn",
      ref: target == null ? "No target set." : fmt(target, u === "ms" ? 0 : 1) + " ± " + fmt(tol, u === "ms" ? 0 : 1) + " " + u + " (" + (S.preset === "guide" ? "VaDia 2 guide" : "VaDia Suite defaults") + ")",
      src, how, farmer, cow: "", checks: []
    }));
    pr("rate", "Pulsation rate", P.rate, "cycles/min", T("rate_target"), T("rate_tol"), ["suite", "guide"],
       "Mean cycle length on the pulsation channel during milking.", "How many times a minute the liner opens and closes.");
    pr("ratio", "Pulsator ratio (milk phase)", P.ratioMilk, "%", T("ratio_target"), T("ratio_tol"), ["suite", "guide"],
       "(a + b) ÷ cycle length.", "Share of every cycle the liner is open and milking.");
    ["a", "b", "c", "d"].forEach(k => pr(k, k + "-phase", P[k], "ms", T(k + "_target"), T(k + "_tol"), ["suite", "guide", "iso"],
       "Phase boundaries at the ISO 6690 reference levels, 4 kPa from the cycle minimum and maximum.",
       { a: "Liner opening.", b: "Liner open — milk flows.", c: "Liner closing.", d: "Liner closed — the massage that relieves congestion at the teat end." }[k]));
    out.pulsation.push(card({
      id: "dmin", title: "d-phase against its minimum", value: K_(P.d, 0) + " ms",
      status: T("d_min") == null ? "info" : P.d >= T("d_min") ? "ok" : "crit", ref: T("d_min") == null ? "No minimum set." : "At least " + fmt(T("d_min"), 0) + " ms (" + threshSrc("d_min") + ").", src: ["iso", "guide"],
      how: "Median d-phase across milkings.",
      farmer: T("d_min") == null ? "" : P.d >= T("d_min") ? "The massage phase meets its minimum." : "The massage phase is too short.",
      cow: "The d-phase is the only part of each cycle when the collapsed liner squeezes the teat end. Pulsation that fails to do this is associated with congestion and oedema in the teat wall and slower closure of the teat canal (Mein et al. 2004).",
      checks: T("d_min") != null && P.d < T("d_min") ? ["Check rate and ratio settings together, then pulsator valve and pulsation line."] : []
    }));
    out.pulsation.push(card({
      id: "dip", title: "b-phase dip", value: K_(P.dip) + " kPa",
      status: T("dip_max") == null ? "info" : P.dip <= T("dip_max") ? "ok" : "warn",
      ref: T("dip_max") == null ? "No limit set." : "A dip is a short drop of more than " + fmt(T("dip_max"), 0) + " kPa below the maximum b-phase vacuum (VaDia Suite manual, p. 49; " + threshSrc("dip_max") + ").", src: ["manual"],
      how: "Largest fall inside the central 80 % of each b-phase, median across milkings. Measured during milking: a dry pulsator test on the same pulsator can read differently.",
      farmer: T("dip_max") != null && P.dip > T("dip_max") ? "Pulsation chamber vacuum does not hold flat while the liner is open." : "Pulsation chamber vacuum holds while the liner is open.",
      cow: "", checks: T("dip_max") != null && P.dip > T("dip_max") ? ["Check the pulsation line and T-pieces for restriction or leaks, and pulsator air consumption against vacuum reserve.", "Repeat as a dry pulsator test before replacing anything."] : []
    }));
    out.pulsation.push(card({
      id: "limp", title: "Alternate-cycle asymmetry (limping proxy)", value: K_(P.limp) + " %",
      status: "info", ref: "Limping below 5 % (ISO 5707, as cited in the VaDia Suite manual). True limping needs both pulsation chambers recorded — one was recorded here, so this is a proxy and is not graded.",
      src: ["iso", "manual"], how: "Difference between odd and even cycles' b-phase, as a share of cycle length.",
      farmer: "", cow: "", checks: []
    }));
  }

  if (P.rate != null) {
    const found = M.reduce((a, c) => a + (c.pulsFound || 0), 0), exc = [].concat(...M.map(c => (c.pulsExcluded || []).map(r => Object.assign({ n: c.n }, r))));
    if (found) out.pulsation.push(card({
      id: "pregular", title: "Pulsation cycles left out of the phase timing", value: exc.length + " of " + found + " cycles",
      status: "info", ref: "No published limit. Cycles more than 20 % shorter or longer than the median, or that never reach full vacuum, are usually two cycles merged or one split by noise — but they can also be genuine irregularity, so they are counted and listed rather than silently dropped.",
      src: ["iso"], how: "Rate is calculated over every cycle found, irregular ones included; a/b/c/d phases over the regular cycles only.",
      farmer: exc.length ? "Irregular cycles: " + exc.slice(0, 8).map(r => "milking " + r.n + " at " + clockAt(r.i0) + " (" + fmt(r.len / S.signal.fs * 1000, 0) + " ms, " + r.reason + ")").join("; ") + (exc.length > 8 ? "; and " + (exc.length - 8) + " more" : "") + ". If there are many, check the pulsator with a dry test." : "Every cycle found was regular enough to be timed.",
      cow: "", checks: []
    }));
  }

  /* ================================================================ PARLOR */
  out.parlor.push(card({ id: "count", title: "Milkings on this unit", value: String(N) + " in " + S_(H.spanS), status: "info", ref: "", how: "First attachment to last end of milking, real clock time.", farmer: "", cow: "" }));
  out.parlor.push(card({ id: "perhour", title: "Milkings per hour on this unit", value: K_(H.perHour), status: "info", ref: "No benchmark applied — depends on parlor type and size.", how: "Milkings ÷ recording span.", farmer: "Throughput of the one unit that carried the logger.", cow: "" }));
  out.parlor.push(card({ id: "idle", title: "Unit idle between cows", value: S_(H.idle) + " median", status: "info", ref: "", how: "End of one milking to the next attachment, excluding re-attachments.", farmer: "Time the unit waits for the next cow — loading, preparation and the milker's routine all sit in here.", cow: "" }));
  if (Y && Y.perUnitHour != null) out.parlor.push(card({ id: "milkhour", title: "Milk harvested per unit-hour", value: K_(Y.perUnitHour) + " " + U, status: "info", ref: "No benchmark applied.", how: "Total milk entered ÷ recording span.", farmer: "Milk through the one unit that carried the logger, per hour of the recording.", cow: "" }));
  out.parlor.push(card({ id: "share", title: "Machine time spent overmilking", value: K_(H.overmilkShare, 0) + " %  (" + K_(H.overmilkTotal / 60) + " min in total)", status: "info", ref: "", how: "Sum of overmilking ÷ sum of unit-on time.", farmer: "Unit time that could be released by taking clusters off when the quarters are empty.", cow: "" }));

  return out;
}

/* ==========================================================================
   THE AUDIT REPORT — what the farm reads, what the engineer checks.
   ========================================================================== */

/* measured accuracy of the automatic markers on this installation's own database */
const VALIDATION = [
  ["Milking split", "Teat-end vacuum rises above 25 kPa after the cluster has been off (below 5 kPa for 2 s). Periods shorter than " + "the Thresholds setting, or with too small a dip, are listed separately, never silently dropped", "9 of 9 milkings found"],
  ["Attachment", "Same rule", "8 of 9 exact — the ninth had been moved by hand (4.6 s)"],
  ["Start of peak flow", "10-second means of teat-end vacuum; flow is established when the next period declines by less than 0.15 kPa", "Exact on all 8 milkings whose marker had not been moved by hand. Periods are laid on the recording clock"],
  ["Start of overmilking", "Mouthpiece vacuum variation per 2 s rising to 1.3 × its running average (manual ch. 22). A milking usually has several such candidates; the manual does not say which one VaDia uses. ParlorLens reports the one chosen under Thresholds (default: the strongest one with a ≥ 2 kPa rise in mouthpiece vacuum behind it — none if no candidate has it) and prints the candidate count", "Three farms, 50 mouthpiece channels against VaDia's stored markers: 29 within 6 s with the default rule, 26 with the strongest change; 5 channels left unmarked and flagged instead of marked wrongly. Held-out Sun Dairy: 4 of 14 either way. Cedar hand-placed markers: 3 of 3 within 1 s on the first mouthpiece channel, 2 of 3 within 1.5 s on the second. No candidate rule reproduces VaDia's automatic markers consistently — this step is not validated"],

      (Y ? " Milk yield was entered, not measured by the logger; average flow is yield ÷ unit-on time and says nothing about the shape of the flow curve." : " Milk yield was not entered."),
    "Channel roles were decided by rule. A wrong assignment makes every figure that uses that channel wrong — check the channel table.",
    "Pulsation was measured during milking. A dry pulsator test (ISO 6690) on the same pulsator can read differently and remains the reference for pulsator condition.",
    "Nothing here states compliance with any standard, and nothing links a reading to mastitis in a particular cow. Where the literature links a condition to udder health, it says so and is cited.",
    demo ? "THIS AUDIT WAS BUILT FROM SYNTHETIC DEMO DATA." : null
  ].filter(Boolean).map(x => el("li", { text: x }))));
  pMeth.append(li);
  const rf = rsecA("References", "");

  rf.append(rl);
  pMeth.append(rf);
  const at = rsecA("Audit trail", "Every step taken in this session, in order");
  at.append(tableOf(["Time", "Step", "Detail"], AUDIT.map(a => [clockOf(a.t), a.step, cleanReportText(a.detail)])));
  pMeth.append(at);

  wrap.append(printFooter());
  host.append(wrap);

  host.append(el("div", { class: "panel noprint", style: "margin-top:16px" }, el("div", { class: "row" }, [
    el("button", { class: "btn primary", type: "button", text: "WhatsApp summary (image)", onclick: () => shareSummary(A, navigator.canShare ? "share" : "save") }),
    el("button", { class: "btn", type: "button", text: "Export Word (.docx)", onclick: exportWordReport }),
    el("button", { class: "btn primary", type: "button", text: "Print this tab / PDF", onclick: () => window.print() }),
    el("button", { class: "btn", type: "button", text: "Print the full report", onclick: () => {
      document.body.classList.add("print-all"); window.print(); setTimeout(() => document.body.classList.remove("print-all"), 400); } }),
    el("button", { class: "btn", type: "button", text: "Export every milking (CSV)", onclick: exportAuditCSV }),
    el("button", { class: "btn", type: "button", text: "Add farm details", onclick: () => go("farm") }),
    el("button", { class: "btn ghost", type: "button", text: "Change thresholds", onclick: () => go("thresholds") }),
    el("button", { class: "btn ghost", type: "button", text: "Re-run the audit", onclick: () => { S.auto = null; render(); } })
  ])));
}

    b.append(el("p", { class: "small", html: "<strong>Milkings concerned:</strong> " + esc(x.cows.join(", ")) + " of " + N }));

  }
  return c;

      " ms. That closed d-phase is the teat's massage: the collapsed liner presses on the teat end, working against the congestion vacuum causes." : "") +

/* ------------------------------------------- where the minutes went (SVG) */
function minutesChart(M) {
  const rows = M.map(c => ({ n: c.n, start: c.start, cow: c.cow,
    seg: [["Let-down", c.letdown, "--ink-3"], ["Milking", c.main, "--accent"], ["Overmilking", c.overmilk || 0, "--warn"], ["Detachment", c.detach, "--line"]] }));
  const max = Math.max.apply(null, M.map(c => c.machineOn)) || 1;
  const W = 760, rowH = 22, padL = 86, padR = 64, top = 30, H = top + rows.length * rowH + 26;
  const x = v => padL + v / max * (W - padL - padR);
  let svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Minutes per milking by phase" style="width:100%;height:auto;display:block">';
  // legend
  let lx = padL;
  rows[0].seg.forEach(([name, , col]) => {
    svg += '<rect x="' + lx + '" y="6" width="10" height="10" rx="2" fill="var(' + col + ')"/>' +
           '<text x="' + (lx + 14) + '" y="15" font-size="11" fill="var(--ink-2)">' + name + '</text>';
    lx += 14 + name.length * 6.4 + 18;
  });
  // grid
  const stepS = max > 480 ? 120 : 60;
  for (let s = 0; s <= max; s += stepS) {
    svg += '<line x1="' + x(s) + '" x2="' + x(s) + '" y1="' + (top - 4) + '" y2="' + (H - 22) + '" stroke="var(--line-soft)"/>' +
           '<text x="' + x(s) + '" y="' + (H - 8) + '" font-size="10" text-anchor="middle" fill="var(--ink-3)">' + (s / 60) + ' min</text>';
  }
  rows.forEach((r, i) => {
    const y = top + i * rowH;
    svg += '<text x="' + (padL - 8) + '" y="' + (y + 14) + '" font-size="11" text-anchor="end" fill="var(--ink-2)">' + (r.cow ? 'Cow ' + esc(r.cow) : '#' + r.n + ' ' + r.start.slice(0, 5)) + '</text>';
    let acc = 0;
    r.seg.forEach(([name, v, col]) => {
      if (!(v > 0)) return;
      svg += '<rect x="' + (x(acc) + 1) + '" y="' + (y + 3) + '" width="' + Math.max(1, x(acc + v) - x(acc) - 2) + '" height="' + (rowH - 7) + '" rx="3" fill="var(' + col + ')">' +
             '<title>#' + r.n + ' ' + name + ': ' + hms(v) + '</title></rect>';
      acc += v;
    });
    const om = r.seg[2][1];
    svg += '<text x="' + (x(acc) + 6) + '" y="' + (y + 14) + '" font-size="10.5" fill="var(--ink-2)">' + (om > 0 ? hms(om) + ' over' : '') + '</text>';
  });
  svg += '</svg>';
  return el("div", { class: "chartbox", style: "padding:10px", html: svg });
}

/* Channel roles: tell the reader whether they were confirmed by the person who
   placed the taps, or inferred from waveform shape — and let them settle it. */
function mapCheckBanner(A) {
  const mc = A.mapCheck; if (!mc) return null;
  const roles = m => Object.keys(m).sort().map(c => "CH" + (+c + 1) + " " + (m[c] || "OFF")).join(" · ");
  const rerun = () => { S.auto = null; render(); saveIfConsented(); };
  if (mc.source === "user" && mc.agrees) return null;
  if (mc.source === "user") {
    return el("section", { class: "rsec" }, el("div", { class: "note warn" }, [
      el("strong", { text: "Channel roles: your placement was used. " }),
      document.createTextNode("The waveform shapes suggest a different placement on " + mc.diff.map(c => "CH" + (+c + 1)).join(", ") +
        " (suggested: " + roles(mc.suggested) + "; used: " + roles(S.mapping) + "). Physical placement in the parlor always takes priority — if the taps were connected as you set them, keep it. Otherwise every result below is on the wrong channel."),
      el("div", { class: "row noprint", style: "margin-top:8px;gap:8px" }, [
        el("button", { class: "btn", type: "button", text: "Keep my placement", onclick: () => {
          A.mapCheck = { source: "user", agrees: true, suggested: mc.suggested, diff: [] };
          logAudit("Channel check", "User kept their own placement despite the waveform suggestion"); render(); } }),
        el("button", { class: "btn", type: "button", text: "Use the suggested placement", onclick: () => {
          S.mapping = Object.assign({}, mc.suggested); S.mappingSource = "user";
          logAudit("Channel mapping", "User switched to the waveform suggestion: " + roles(mc.suggested)); rerun(); } })
      ])
    ]));
  }
  const doubt = (mc.doubts || []).length;
  return el("section", { class: "rsec" }, el("div", { class: "note " + (doubt ? "crit" : "warn") }, [
    el("strong", { text: doubt ? "Channel roles could not be identified with confidence — confirm them before using this report. " : "Channel roles were inferred from the waveforms, not confirmed. " }),
    doubt ? document.createTextNode("Why: " + mc.doubts.join("; ") + ". ") : null,
    document.createTextNode("Used: " + roles(S.mapping) + ". The software chose these from signal shape (pulsating trace = pulsation tube; highest steady vacuum = short milk tube; mouthpiece taps below it). Confirm them against where the taps were actually connected in the parlor."),
    el("div", { class: "row noprint", style: "margin-top:8px;gap:8px" }, [
      el("button", { class: "btn primary", type: "button", text: "Confirm — taps were connected like this", onclick: () => {
        S.mappingSource = "user"; A.mapCheck = { source: "user", agrees: true, suggested: mc.suggested, diff: [] };
        logAudit("Channel mapping", "User confirmed the channel placement: " + roles(S.mapping)); saveIfConsented(); render(); } }),
      el("button", { class: "btn", type: "button", text: "Change on the Channels step", onclick: () => go("channels") })
    ])
  ]));
}

/* A "checked" mark belongs to the markers that were looked at. If the file, the channel
   roles, any marker of that milking or the reasons it was flagged change afterwards (a rule,
   a threshold, a hand correction), the mark no longer applies and the milking needs checking again. */
function reviewSignature(c) {
  return JSON.stringify([S.source && S.source.name, [0, 1, 2, 3].map(i => S.mapping[i]),
    [c.att, c.pf, c.om1, c.om2, c.to, c.end, c.cvf ? c.cvf.at : null], c.review]);
}
function validReview(c) {
  const r = (S.reviewed || {})[c.start];
  return r && r.signature === reviewSignature(c) ? r : null;   // a mark with no signature (saved before v15) cannot be verified
}
const staleReview = c => !!((S.reviewed || {})[c.start] && !validReview(c));
const needsReview = c => c.review.length > 0 || staleReview(c);

/* marker status of one milking: rules only, corrected by hand, checked, or needing a look */
function markerStatusPill(c) {
  const done = validReview(c);
  if (needsReview(c) && !done) return el("span", { class: "pill warn", title: c.review.join("\n"), text: "check" });
  if (done) return el("span", { class: "pill ok", title: "Checked " + done.on, text: c.hand.length ? "corrected" : "checked" });
  if (c.hand.length) return el("span", { class: "pill ok", title: "Moved by hand: " + c.hand.join(", "), text: "corrected" });
  return el("span", { class: "pill flat na", text: "rules" });
}
/* overall status: the report is provisional while channel roles are unconfirmed or flagged milkings are unchecked */
function reportStatus(A) {
  const open = A.milkings.filter(c => needsReview(c) && !validReview(c));
  const why = [];
  if (S.mappingSource !== "user") why.push("channel roles not confirmed");
  if (open.length) why.push(open.length + " of " + A.milkings.length + " milkings with markers not yet checked");
  return { final: !why.length, why, open };
}

/* ==========================================================================
   COW NUMBERS AND MILK YIELD — optional, entered by hand, pasted, or taken
   from VaDia Suite's own milking-time-test export.

   What yield adds, and only this:
     • average milk flow per cow, by VaDia Suite's own formula
       (milk yield ÷ machine-on time — reproduces the figure VaDia stores);
     • which cows the overmilking and long unit-on times belong to;
     • whether overmilking sits on the lower- or the higher-yield cows;
     • a plausibility check on the vacuum markers: cows that give more milk
       should show a longer milk-flow period;
     • the caution, from Uí Chearbhaill et al. 2026, that the vacuum method's
       overmilking figure departs further from flow-based figures as yield rises.
   No threshold is applied to yield or flow — none is published for this use.
   ========================================================================== */

/* ------------------------------------------------ attach entries to milkings */
function attachCowInfo(M) {
  const rows = (S.cowInfo && S.cowInfo.rows) || {};
  M.forEach(c => {
    const r = rows[c.start] || null;
    c.cow = r && r.cow ? String(r.cow) : null;
    c.yield = r && isFinite(r.yield) && r.yield > 0 ? r.yield : null;
    c.yieldSrc = r ? r.src : null;
    c.flow = c.yield != null && c.machineOn > 0 ? c.yield / (c.machineOn / 60) : null;
    c.secPerUnit = c.yield != null ? c.machineOn / c.yield : null;
  });
}
const mLabel = c => c.cow ? c.n + " (cow " + c.cow + ")" : String(c.n);
const yUnit = () => (S.cowInfo && S.cowInfo.unit) || "L";

/* ------------------------------------------------------------- statistics */
function _ranks(a) {
  const idx = a.map((v, i) => [v, i]).sort((x, y) => x[0] - y[0]);
  const r = new Array(a.length);
  for (let i = 0; i < idx.length;) {
    let j = i; while (j + 1 < idx.length && idx[j + 1][0] === idx[i][0]) j++;
    const avg = (i + j) / 2 + 1;
    for (let k = i; k <= j; k++) r[idx[k][1]] = avg;
    i = j + 1;
  }
  return r;
}
/* log-gamma and regularised incomplete beta (Numerical Recipes) for Student's t */
function _lgam(x) {
  const c = [76.18009172947146, -86.50532032941677, 24.01409824083091, -1.231739572450155, 0.1208650973866179e-2, -0.5395239384953e-5];
  let y = x, t = x + 5.5; t -= (x + 0.5) * Math.log(t); let s = 1.000000000190015;
  for (let j = 0; j < 6; j++) s += c[j] / ++y;
  return -t + Math.log(2.5066282746310005 * s / x);
}
function _betacf(a, b, x) {
  let qab = a + b, qap = a + 1, qam = a - 1, c = 1, d = 1 - qab * x / qap;
  if (Math.abs(d) < 1e-30) d = 1e-30; d = 1 / d; let h = d;
  for (let m = 1; m <= 200; m++) {
    const m2 = 2 * m; let aa = m * (b - m) * x / ((qam + m2) * (a + m2));
    d = 1 + aa * d; if (Math.abs(d) < 1e-30) d = 1e-30; c = 1 + aa / c; if (Math.abs(c) < 1e-30) c = 1e-30; d = 1 / d; h *= d * c;
    aa = -(a + m) * (qab + m) * x / ((a + m2) * (qap + m2));
    d = 1 + aa * d; if (Math.abs(d) < 1e-30) d = 1e-30; c = 1 + aa / c; if (Math.abs(c) < 1e-30) c = 1e-30; d = 1 / d;
    const del = d * c; h *= del; if (Math.abs(del - 1) < 3e-12) break;
  }

}
function _ibeta(a, b, x) {
  if (x <= 0) return 0; if (x >= 1) return 1;
  const bt = Math.exp(_lgam(a + b) - _lgam(a) - _lgam(b) + a * Math.log(x) + b * Math.log(1 - x));
  return x < (a + 1) / (a + b + 2) ? bt * _betacf(a, b, x) / a : 1 - bt * _betacf(b, a, 1 - x) / b;
}
/** Spearman rank correlation with a two-sided p from the t approximation. */
function spearman(x, y) {
  const P = x.map((v, i) => [v, y[i]]).filter(p => p[0] != null && p[1] != null && isFinite(p[0]) && isFinite(p[1]));
  const n = P.length; if (n < 6) return null;
  const rx = _ranks(P.map(p => p[0])), ry = _ranks(P.map(p => p[1]));

}

/* ------------------------------------------------------------- herd view */
function yieldHerd(M, H) {
  const Y = M.filter(c => c.yield != null);
  const cowsN = M.filter(c => c.cow).length;
  if (!Y.length) return cowsN ? { n: 0, cowsN, of: M.length } : null;
  const unit = yUnit();
  const total = Y.reduce((a, c) => a + c.yield, 0);
  const YT = Y.filter(c => c.timingOK);                // overmilking / flow-period comparisons need the whole curve
  const sorted = YT.slice().sort((a, b) => a.yield - b.yield);
  const half = Math.floor(YT.length / 2);
  const lo = YT.length >= 4 ? sorted.slice(0, half) : [], hi = YT.length >= 4 ? sorted.slice(YT.length - half) : [];
  const share = g => { let o = 0, t = 0; g.forEach(c => { if (c.overmilk != null) { o += c.overmilk; t += c.machineOn; } }); return t ? o / t * 100 : null; };
  const medY = _med(Y.map(c => c.yield));
  const flowPeriod = c => c.letdown + c.main;              // attachment → start of overmilking
  const R = {
    n: Y.length, of: M.length, cowsN, unit, total,
    yield: medY, yieldR: _range(Y.map(c => c.yield)),
    flow: _med(Y.map(c => c.flow)), flowR: _range(Y.map(c => c.flow)),
    secPerUnit: _med(Y.map(c => c.secPerUnit)),
    perUnitHour: Y.length === M.length && H.spanS > 0 ? total / (H.spanS / 3600) : null,
    split: lo.length ? {
      loMax: lo[lo.length - 1].yield, hiMin: hi[0].yield, size: half,
      omLo: _med(lo.map(c => c.overmilk)), omHi: _med(hi.map(c => c.overmilk)),
      shareLo: share(lo), shareHi: share(hi),
      loCows: lo.map(mLabel), hiCows: hi.map(mLabel)
    } : null,
    rhoFlow: spearman(YT.map(c => c.yield), YT.map(flowPeriod)),
    rhoOn: spearman(Y.map(c => c.yield), Y.map(c => c.machineOn)),
    rhoOM: spearman(YT.map(c => c.yield), YT.map(c => c.overmilk)),
    slow: Y.slice().sort((a, b) => a.flow - b.flow).slice(0, Math.max(1, Math.ceil(Y.length / 4))),
    longLow: T("unitOn_max") == null ? [] : Y.filter(c => c.machineOn > T("unitOn_max") && c.yield < medY),
    omHighYield: T("overmilk_warn") == null ? [] : YT.filter(c => c.overmilk != null && c.overmilk > T("overmilk_warn") && c.yield > medY)
  };
  // plausibility of the vacuum markers against yield
  const r = R.rhoFlow;
  R.plaus = !r ? "few" : r.rho > 0 && r.p < 0.05 ? "consistent" : r.rho <= 0 ? "against" : "unclear";
  return R;
}

function plausText(Y) {
  const r = Y.rhoFlow;
  if (!r) return "Too few fully recorded milkings with a yield to test whether the vacuum markers follow milk flow — six or more are needed.";
  const tag = "ρ = " + fmt(r.rho, 2) + ", n = " + r.n + ", p ≈ " + (r.p < 0.001 ? "<0.001" : fmt(r.p, 3));
  return {
    consistent: "Cows that gave more milk showed a longer milk-flow period from attachment to start of overmilking (" + tag + "). That is what should happen if the vacuum markers follow milk flow, and it supports the overmilking and peak-flow markers on this recording.",
    unclear: "The milk-flow period rose with yield, but not clearly enough to rule out chance (" + tag + "). With this many cows that is common; it neither supports nor rules out the markers.",
    against: "The milk-flow period did not rise with yield (" + tag + "). If the markers followed milk flow it should. Check the overmilking markers on the traces before relying on the overmilking figures from this recording."
  }[Y.plaus];
}

/* ------------------------------------------- reading VaDia Suite's own export */
function _secOfClock(s) {
  const m = String(s || "").trim().match(/^(\d{1,2}):(\d{2})(?::(\d{2}))?/);
  return m ? (+m[1]) * 3600 + (+m[2]) * 60 + (+(m[3] || 0)) : null;
}
function _durSec(s) {   // "05:33" (m:ss) or "0:05:33"
  const p = String(s || "").trim().split(":").map(Number);
  if (p.some(v => !isFinite(v))) return null;
  return p.length === 3 ? p[0] * 3600 + p[1] * 60 + p[2] : p.length === 2 ? p[0] * 60 + p[1] : null;
}
function _dateKey(d) { return d ? [d.getDate(), d.getMonth() + 1, d.getFullYear()].join("-") : null; }
function _csvDateKey(s) {
  const m = String(s || "").trim().match(/^(\d{1,4})[-./](\d{1,2})[-./](\d{1,4})/);
  if (!m) return null;
  return m[1].length === 4 ? [+m[3], +m[2], +m[1]].join("-") : [+m[1], +m[2], +m[3]].join("-");
}

/** Match a VaDia Suite MTT export to the milkings found in the recording, by attachment clock time. */
function linkMTTExport(text, fileName) {
  const A = S.auto; if (!A || !A.milkings) throw new Error("Load the .vd6 recording first, then the VaDia Suite export.");
  const r = parseDelimited(text, fileName);
  if (!r.tables || r.tables.kind !== "mtt") throw new Error(fileName + " is not a VaDia Suite milking-time-test export (no MTT columns found).");
  const cols = r.tables.cols, dc = r.tables.decimalComma;
  const find = re => cols.find(c => re.test(c.trim()));
  const cAnimal = find(/^animal/i), cAtt = find(/^attachment$/i), cYield = find(/milk\s*yield/i), cOn = find(/^machine\s*on/i), cDate = find(/create\s*date/i);
  if (!cAtt) throw new Error("The export has no Attachment column, so its rows cannot be matched to the milkings in the recording.");
  const unit = cYield && /\(kg\)/i.test(cYield) ? "kg" : "L";
  // VaDia's "Create date" is the day the milking was analysed in VaDia Suite, not the day it was
  // recorded — so it cannot be matched to the recording, only used to exclude rows analysed
  // before this recording existed and to keep the rows of one analysis session together.
  const t0 = S.signal && S.signal.t0, recDay = t0 ? new Date(t0.getFullYear(), t0.getMonth(), t0.getDate()).getTime() : null;
  const dayOf = k => { if (!k) return null; const [d, m, y] = k.split("-").map(Number); return new Date(y, m - 1, d).getTime(); };
  const all = r.tables.rows.map(o => ({
    animal: cAnimal ? String(o[cAnimal] || "").trim() : "", t: _secOfClock(o[cAtt]),
    yield: cYield ? toNum(o[cYield], dc) : NaN, on: cOn ? _durSec(o[cOn]) : null,
    date: cDate ? _csvDateKey(o[cDate]) : null, used: false
  })).filter(x => x.t != null && (recDay == null || !x.date || dayOf(x.date) >= recDay));
  if (!all.length) throw new Error("No row in " + fileName + " could belong to this recording (all were analysed before " + stamp(t0).slice(0, 10) + ").");

  const TOL = 60;               // seconds between our attachment and VaDia's
  const matchIn = rows => {
    rows.forEach(x => { x.used = false; });
    const pairs = [];
    A.milkings.forEach(c => {
      const t = _secOfClock(c.start); if (t == null) return;
      let best = null;
      rows.forEach(x => { if (x.used) return; const d = Math.abs(x.t - t); if (d <= TOL && (!best || d < best.d)) best = { x, d }; });
      if (best) { best.x.used = true; pairs.push({ c, x: best.x, d: best.d }); }
    });
    return pairs;
  };
  // one analysis session (one Create date) at a time; keep the one that explains most milkings
  const groups = {}; all.forEach(x => { (groups[x.date || "?"] = groups[x.date || "?"] || []).push(x); });
  let pairs = [], chosen = null;
  Object.keys(groups).forEach(g => { const p = matchIn(groups[g]); if (p.length > pairs.length) { pairs = p; chosen = g; } });

  let matched = 0, maxDt = 0, maxDon = 0, yieldN = 0;
  const next = Object.assign({}, S.cowInfo.rows);
  pairs.forEach(({ c, x, d }) => {
    matched++; maxDt = Math.max(maxDt, d);
    if (x.on != null) maxDon = Math.max(maxDon, Math.abs(x.on - c.machineOn));
    const y = isFinite(x.yield) && x.yield > 0 ? x.yield : null;   // VaDia stores 0 when no yield was entered
    if (y != null) yieldN++;
    next[c.start] = { cow: x.animal || null, yield: y, src: "VaDia Suite export" };
  });
  if (!matched) throw new Error("None of the " + all.length + " rows in " + fileName + " has an attachment time within " + TOL + " s of a milking in this recording.");
  S.cowInfo.rows = next; S.cowInfo.unit = unit;
  const msg = matched + " of " + A.milkings.length + " milkings matched by attachment time" + (chosen && chosen !== "?" ? " to rows analysed in VaDia Suite on " + chosen : "") + " (largest difference " + maxDt + " s" +
    (maxDon ? "; machine-on times differ by at most " + maxDon.toFixed(0) + " s" : "") + "), " + yieldN + " with a milk yield";
  logAudit("Cow numbers and milk yield imported", fileName + " — " + msg + ". Source: VaDia Suite export (entered in VaDia Suite, not measured by the logger).");
  return msg;
}

/** Paste: one line per milking — "cow yield", optionally led by the attachment time. */
function applyPastedCowList(text) {
  const A = S.auto; if (!A || !A.milkings) return "";
  const lines = text.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  const next = Object.assign({}, S.cowInfo.rows);
  let k = 0, n = 0; const skipped = [];
  lines.forEach((l, li) => {
    const parts = l.split(/[\t;,]\s*|\s+/).filter(Boolean);
    let c = null;
    if (parts.length && _secOfClock(parts[0]) != null && /:/.test(parts[0])) {
      const t = _secOfClock(parts.shift());
      c = A.milkings.reduce((b, m) => { const d = Math.abs(_secOfClock(m.start) - t); return d <= 60 && (!b || d < b.d) ? { m, d } : b; }, null);
      c = c ? c.m : null;

    const cow = parts[0] || null, y = parts[1] != null ? toNum(parts[1].replace(",", "."), false) : NaN;
    if (parts[1] != null && !(y > 0 && y < 100)) { skipped.push(li + 1); return; }
    next[c.start] = { cow, yield: y > 0 ? y : null, src: "entered by hand" }; n++;
  });
  S.cowInfo.rows = next;
  logAudit("Cow numbers and milk yield entered", n + " milkings from a pasted list" + (skipped.length ? "; lines skipped: " + skipped.join(", ") : ""));
  return n + " milkings filled" + (skipped.length ? " · lines not used: " + skipped.join(", ") + " (no matching milking, or milk not between 0 and 100)" : "");
}

/* ==========================================================================
   FARM MANAGER REPORT — what the recording means for the farm, with
   pictures taken from the test itself.

   Every figure here is drawn from the recording that was loaded: real
   milkings, real cows. Example milkings are chosen by rule (fastest against
   slowest let-down, best against worst liner fit, longest against shortest
   overmilking) and the rule is printed under each picture.

   A section appears only when the recording carries the data it needs.
   ========================================================================== */

/* Figures are drawn on a white, print-ready palette whatever the screen
   theme, so they read the same on screen, on paper and in a PDF. */
const FIG = {
  bg: "#ffffff", ink: "#0e1c2a", ink2: "#3d5163", ink3: "#6b7f91", grid: "#e2eaf1", frame: "#ccd8e2",
  role: { SMT: "#1a5fd4", SPT: "#1d8c39", MPC: "#d3261c", MPC2: "#111111" },
  phase: { "Let-down": ["#e8eef4", "#6b7f91"], "Peak flow": ["#e4eef7", "#0b5fa5"], "Overmilking": ["#fbf0d9", "#8a5a04"], "Take-off": ["#fbe6e4", "#a62119"] },
  puls: { a: "#dbe8f6", b: "#dcefe3", c: "#dbe8f6", d: "#f8e7c4" },
  band: "rgba(18,112,79,.10)", font: '"Source Sans 3", system-ui, sans-serif', mono: '"IBM Plex Mono", monospace'

/* ------------------------------------------------------- a picture of the trace */
function figTrace(o) {

  const x = cv.getContext("2d"); x.scale(dpr, dpr);

  const top = (phases.length ? 24 : 6) + (marks.length ? 18 : 0) + 4;
  const pad = { l: 48, r: 12, b: 28 };
  const pw = W - pad.l - pad.r, ph = H - top - pad.b;
  const t0 = tAt(o.i0), t1 = tAt(o.i1), tz = tAt(o.xFrom != null ? o.xFrom : o.i0);
  const X = t => pad.l + (t - t0) / (t1 - t0) * pw;
  const XI = i => X(tAt(i));
  const roles = o.chs.filter(r => chArray(r));
  let y0 = o.yMin || 0, y1 = o.yMax || 0;
  if (!o.yMax) { roles.forEach(r => { const a = chArray(r); for (let i = o.i0; i < o.i1; i += 5) if (a[i] > y1) y1 = a[i]; });
    y1 = Math.max(10, Math.ceil((y1 + 3) / 10) * 10); }
  const Y = v => top + (1 - (v - y0) / (y1 - y0)) * ph;

  // phase tint and ribbon
  phases.forEach(([name, a, b]) => {
    const xa = Math.max(pad.l, XI(a)), xb = Math.min(W - pad.r, XI(b)); if (xb - xa < 1) return;
    const [soft, strong] = FIG.phase[name] || ["#eef2f6", "#6b7f91"];
    x.fillStyle = soft; x.fillRect(xa, top, xb - xa, ph);
    x.fillRect(xa, 4, xb - xa, 16); x.fillStyle = strong; x.fillRect(xa, 17, xb - xa, 3);
    const lab = name + " " + hms(tAt(b) - tAt(a));
    x.font = "600 10.5px " + FIG.font; x.textAlign = "center"; x.textBaseline = "middle"; x.fillStyle = FIG.ink;
    const fit = t => x.measureText(t).width + 6 < xb - xa;
    if (fit(lab)) x.fillText(lab, (xa + xb) / 2, 11); else if (fit(name)) x.fillText(name, (xa + xb) / 2, 11);
  });
  // favourable mouthpiece band
  if (o.band) { x.fillStyle = FIG.band; x.fillRect(pad.l, Y(o.band[1]), pw, Y(o.band[0]) - Y(o.band[1]));
    x.fillStyle = "#12704f"; x.font = "10px " + FIG.font; x.textAlign = "right"; x.textBaseline = "top";
    x.fillText("favourable mouthpiece band " + o.band[0] + "–" + o.band[1] + " kPa", W - pad.r - 4, Y(o.band[1]) + 2); }
  // grid
  x.strokeStyle = FIG.grid; x.lineWidth = 1; x.font = "14px " + FIG.mono; x.fillStyle = FIG.ink3;
  x.textAlign = "right"; x.textBaseline = "middle";
  const stepY = y1 - y0 > 60 ? 20 : y1 - y0 > 25 ? 10 : y1 - y0 > 12 ? 5 : 2;
  for (let v = Math.ceil(y0 / stepY) * stepY; v <= y1; v += stepY) { const yy = Math.round(Y(v)) + .5; x.beginPath(); x.moveTo(pad.l, yy); x.lineTo(W - pad.r, yy); x.stroke(); x.fillText(String(v), pad.l - 5, yy); }
  x.textAlign = "left"; x.textBaseline = "top"; x.fillText("kPa", 4, top + ph + 5);
  const span = t1 - t0;
  const ms = o.xUnit === "ms";
  const step = ms ? (span > 2.5 ? 500 : 250) / 1000 : [1, 2, 5, 10, 15, 30, 60, 120, 300].find(v => span / v <= 8) || 600;
  x.textAlign = "center"; x.textBaseline = "top";
  for (let t = Math.ceil((t0 - tz) / step) * step; t + tz <= t1 + 1e-9; t += step) {
    const xx = Math.round(X(t + tz)) + .5;
    x.strokeStyle = FIG.grid; x.beginPath(); x.moveTo(xx, top); x.lineTo(xx, top + ph); x.stroke();
    x.fillStyle = FIG.ink3;
    x.fillText(ms ? Math.round(t * 1000) + " ms" : (t < 0 ? "−" : "") + hms(Math.abs(t)), xx, top + ph + 5);
  }
  // teaching mode: the published band for each line over peak flow, and the zone colouring
  const teach = o.teach != null ? o.teach : S.teach;
  const pk = phases.find(p => p[0] === "Peak flow"), pwin = teach && pk ? [pk[1], pk[2]] : null;
  if (pwin) roles.forEach(r => {
    const band = bandFor(r); if (!band || (r !== "SMT" && o.band)) return;
    const xa = Math.max(pad.l, XI(pwin[0])), xb = Math.min(W - pad.r, XI(pwin[1]));
    const ya = Math.max(top, Y(band.hi)), yb = Math.min(top + ph, Y(band.lo)); if (yb <= ya || xb - xa < 2) return;
    const col = FIG.role[r];
    x.fillStyle = col; x.globalAlpha = .09; x.fillRect(xa, ya, xb - xa, yb - ya); x.globalAlpha = .6;
    x.strokeStyle = col; x.lineWidth = 1; x.setLineDash([4, 3]);
    [ya, yb].forEach(yy => { x.beginPath(); x.moveTo(xa, Math.round(yy) + .5); x.lineTo(xb, Math.round(yy) + .5); x.stroke(); });
    x.setLineDash([]); x.globalAlpha = 1;
    const lab = r + " band " + fmt(band.lo, 0) + "–" + fmt(band.hi, 0) + " kPa (peak flow)";
    x.font = "600 10px " + FIG.font; const tw = x.measureText(lab).width + 8, lx = Math.min(xb - tw - 2, xa + 4), ly = yb - 15;
    x.fillStyle = "rgba(255,255,255,.88)"; x.fillRect(lx, ly, tw, 13);
    x.fillStyle = col; x.textAlign = "left"; x.textBaseline = "middle"; x.fillText(lab, lx + 4, ly + 7);
  });
  // teaching mode: the latest acceptable take-off
  let ghost = o.ghost || null;
  const omP = phases.find(p => p[0] === "Overmilking"), lim = T("overmilk_warn") != null ? T("overmilk_warn") : 60;
  if (!ghost && teach && omP && tAt(omP[2]) - tAt(omP[1]) > lim) ghost = [idxAtT(tAt(omP[1]) + lim), omP[2]];
  if (ghost && teach) {
    const xa = XI(ghost[0]), xb = XI(ghost[1]);
    x.fillStyle = "#a62119"; x.globalAlpha = .12; x.fillRect(xa, top, Math.max(0, xb - xa), ph); x.globalAlpha = 1;
    x.save(); x.setLineDash([6, 4]); x.strokeStyle = "#a62119"; x.lineWidth = 1.8; x.beginPath(); x.moveTo(Math.round(xa) + .5, top); x.lineTo(Math.round(xa) + .5, top + ph); x.stroke(); x.restore();
    x.font = "600 10px " + FIG.font; const gl = "take-off by here (" + fmt(lim, 0) + " s)", gw = x.measureText(gl).width + 8;
    x.fillStyle = "rgba(255,255,255,.9)"; x.fillRect(xa - gw - 2, top + ph - 17, gw, 13);
    x.fillStyle = "#a62119"; x.textAlign = "right"; x.textBaseline = "middle"; x.fillText(gl, xa - 6, top + ph - 10);
  }
  // traces
  x.save(); x.beginPath(); x.rect(pad.l, top, pw, ph); x.clip();
  roles.forEach(r => {
    const a = chArray(r), col = FIG.role[r] || FIG.ink2;
    const band = pwin ? bandFor(r) : null;
    const nS = o.i1 - o.i0, dense = nS / pw > 1.5;
    if (!dense) {
      const rm = band ? runningMean(a, o.i0, o.i1, S.signal.fs) : null, pts = [];
      for (let i = o.i0; i <= o.i1; i++) {
        let z = 0; if (band && i >= pwin[0] && i < pwin[1]) { const m = rm(i); z = m > band.hi ? 1 : m < band.lo ? -1 : 0; }
        pts.push([XI(i), Y(a[i]), z]);
      }
      x.lineJoin = "round"; strokeZoned(x, pts, col, 2.1); return;
    }
    const cols = Math.floor(pw), lo = new Float64Array(cols).fill(NaN), hi = new Float64Array(cols).fill(NaN),
          sum = new Float64Array(cols), cnt = new Float64Array(cols);
    for (let i = o.i0; i < o.i1; i++) {
      const v = a[i]; if (!isFinite(v)) continue;
      const k = Math.floor(XI(i) - pad.l); if (k < 0 || k >= cols) continue;
      if (!(lo[k] <= v)) lo[k] = v; if (!(hi[k] >= v)) hi[k] = v; sum[k] += v; cnt[k]++;
    }
    // envelope
    x.fillStyle = col; x.globalAlpha = r === "SPT" ? .10 : .16;
    let k = 0;
    while (k < cols) { while (k < cols && !cnt[k]) k++; const st = k; while (k < cols && cnt[k]) k++; if (k - st < 2) continue;
      x.beginPath(); for (let j = st; j < k; j++) x.lineTo(pad.l + j + .5, Y(hi[j])); for (let j = k - 1; j >= st; j--) x.lineTo(pad.l + j + .5, Y(lo[j])); x.closePath(); x.fill(); }
    x.globalAlpha = 1;
    // one-second running mean across columns
    const w = Math.max(1, Math.round(pw / span / 2)), pts = [];
    for (let j = 0; j < cols; j++) {
      let sm = 0, n = 0; for (let q = Math.max(0, j - w); q <= Math.min(cols - 1, j + w); q++) { sm += sum[q]; n += cnt[q]; }
      if (!cnt[j] || !n) { pts.push(null); continue; }
      const v = sm / n;
      let z = 0;
      if (band) { const idx = idxAtT(t0 + (j + .5) / pw * span); if (idx >= pwin[0] && idx < pwin[1]) z = v > band.hi ? 1 : v < band.lo ? -1 : 0; }
      pts.push([pad.l + j + .5, Y(v), z]);
    }
    x.lineJoin = "round"; strokeZoned(x, pts, col, 2.1);
  });
  // horizontal level annotations: [fromIdx, toIdx, value, label]
  (o.levels || []).forEach(([a, b, v, lab]) => {
    if (v == null || !isFinite(v)) return;
    const xa = XI(a), xb = XI(b), yy = Y(v);
    x.save(); x.setLineDash([5, 3]); x.strokeStyle = FIG.ink; x.lineWidth = 1.3; x.beginPath(); x.moveTo(xa, yy); x.lineTo(xb, yy); x.stroke(); x.restore();
    x.font = "600 10.5px " + FIG.font; x.textAlign = "left"; x.textBaseline = "bottom";
    const tw = x.measureText(lab).width + 6, lx = Math.min(xa + 4, W - pad.r - tw);
    x.fillStyle = "rgba(255,255,255,.85)"; x.fillRect(lx - 2, yy - 15, tw, 13); x.fillStyle = FIG.ink; x.fillText(lab, lx + 1, yy - 3);
  });
  x.restore();
  // markers with labels in their own row
  const placed = [];
  marks.slice().sort((p, q) => p[0] - q[0]).forEach(([i, lab]) => {
    if (i == null || i < o.i0 || i > o.i1) return;
    const xx = Math.round(XI(i)) + .5;
    x.strokeStyle = FIG.ink2; x.lineWidth = 1.2; x.beginPath(); x.moveTo(xx, top - 4); x.lineTo(xx, top + ph); x.stroke();
    x.font = "600 10px " + FIG.font; const tw = x.measureText(lab).width + 8;
    let lx = Math.max(2, Math.min(W - tw - 2, xx - tw / 2));
    if (placed.some(([a, b]) => lx < b + 2 && lx + tw > a - 2)) { const last = placed[placed.length - 1]; lx = Math.min(W - tw - 2, last[1] + 3); }
    placed.push([lx, lx + tw]);
    const ly = top - 18;
    x.fillStyle = FIG.bg; x.strokeStyle = FIG.ink2; x.lineWidth = 1; x.fillRect(lx, ly, tw, 13); x.strokeRect(lx + .5, ly + .5, tw - 1, 12);
    x.fillStyle = FIG.ink; x.textAlign = "left"; x.textBaseline = "middle"; x.fillText(lab, lx + 4, ly + 7);
  });
  // numbered call-outs: [index, value, number]
  (o.callouts || []).forEach(([i, v, n]) => {
    if (i == null || !isFinite(v)) return;
    const cx = XI(i), cy = Y(v), by = Math.max(top + 12, cy - 22);
    x.strokeStyle = FIG.ink; x.lineWidth = 1.2; x.beginPath(); x.moveTo(cx, cy); x.lineTo(cx, by); x.stroke();
    x.fillStyle = FIG.ink; x.beginPath(); x.arc(cx, cy, 2.5, 0, 6.2832); x.fill();
    x.beginPath(); x.arc(cx, by, 10, 0, 6.2832); x.fill();
    x.fillStyle = "#fff"; x.font = "700 11.5px " + FIG.font; x.textAlign = "center"; x.textBaseline = "middle"; x.fillText(String(n), cx, by + .5);
  });
  // frame
  x.strokeStyle = FIG.frame; x.lineWidth = 1; x.strokeRect(pad.l + .5, top + .5, pw - 1, ph - 1);

  const img = el("img", { src: cv.toDataURL("image/png"), alt: o.alt || o.title || "Vacuum trace from the test", style: "width:100%;height:auto;display:block" });
  const legend = el("div", { class: "figlegend" }, roles.map(r => el("span", null, [
    el("span", { class: "swatch", style: "height:4px;background:" + (FIG.role[r] || FIG.ink2) }), document.createTextNode(r + " — " + roleLabel(r) + " (measured)")]))
    .concat(pwin && roles.some(r => bandFor(r)) ? [el("span", { class: "zkey" }, [el("span", { class: "zk zk-up" }), document.createTextNode("above its band"),
      el("span", { class: "zk zk-dn" }), document.createTextNode("below its band")])] : []));
  return el("figure", { class: "fig" }, [
    o.title ? el("div", { class: "figtitle", text: o.title }) : null, img, legend,
    o.caption ? el("figcaption", { text: o.caption }) : null
  ]);
}

/* -------------------------------------------- one pulsation cycle, a b c d shaded */

  if (!det.ok || det.cycles.length < 5) return null;

  const W = 760, H = 300, dpr = 2;

    caption: "two consecutive cycles from milking " + c.n + (c.cow ? " (cow " + c.cow + ")" : "") + " during peak flow" }).std;
  const img = el("img", { src: cv.toDataURL("image/png"), alt: "Two pulsation cycles from the test with phases a, b, c and d shaded, and the standard cycle dashed", style: "width:100%;height:auto;display:block" });

/* measured phase lengths against the preset, as two proportional bars */
function phaseBars(P) {
  const tg = { a: T("a_target"), b: T("b_target"), c: T("c_target"), d: T("d_target") };
  const row = (label, v) => {

      el("div", { class: "pbar" }, ["a", "b", "c", "d"].map(k => el("div", { class: "pbar-s ph-" + k, style: "width:" + (v[k] / tot * 100).toFixed(2) + "%",
        title: k + " " + fmt(v[k], 0) + " ms", text: v[k] / tot > .07 ? k + " " + fmt(v[k], 0) : k })))]);
  };

/* a vacuum range that shows the working level in detail, shared by a set of pictures */
function _zoomRange(role, wins) {
  const a = chArray(role), v = [];
  wins.forEach(([i, j]) => { for (let k = i; k < j; k += 20) if (isFinite(a[k])) v.push(a[k]); });
  if (v.length < 10) return [0, 55];
  v.sort((p, q) => p - q);
  const lo = v[Math.floor(v.length * 0.02)], hi = v[Math.floor(v.length * 0.995)];
  return [Math.max(0, Math.floor((lo - 2) / 5) * 5), Math.ceil((hi + 2) / 5) * 5];
}

/* Early recovery of teat-end vacuum after flow starts: 1-second means from the
   moment all four cups are on and sealed; the lowest point in the first 30 s, then the
   highest point after it within two minutes of cluster-on. A measurement only —
   no published threshold turns it into a bimodal verdict. */
function earlyRecovery(c) {
  const smt = chArray("SMT"); if (!smt) return null;
  const ta = tAt(c.att), sec = [];
  for (let k = 0; k < 120; k++) {
    const a = idxAtT(ta + k), b = idxAtT(ta + k + 1); if (b > c.to) break;
    sec.push(b - a >= S.signal.fs / 2 ? _mean(smt, a, b) : NaN);
  }
  if (sec.length < 40) return null;
  // start once the cups are on and sealed: air gulps as each cup goes on are not flow
  const j0 = Math.ceil(Math.max(4, (c.settle != null ? c.settle : 8) + 2));
  let mn = -1; for (let j = j0; j < Math.min(sec.length, j0 + 30); j++) if (isFinite(sec[j]) && (mn < 0 || sec[j] < sec[mn])) mn = j;
  if (mn < 0) return null;
  let mx = mn; for (let j = mn; j < sec.length; j++) if (isFinite(sec[j]) && sec[j] > sec[mx]) mx = j;
  return { rise: sec[mx] - sec[mn], minS: mn, peakS: mx };
}

/* --------------------------------------------------------------- the report */
function farmManagerReport(A) {
  const H = A.herd, M = A.milkings, C = A.cards, MT = M.filter(c => c.timingOK);
