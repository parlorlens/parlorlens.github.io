   ========================================================================== */

const BASIS = { M: "Measured", C: "Calculated", I: "Inferred", U: "Manually entered" };

/** A blank limit is not assessed: only a side whose limit is set can be crossed. */
const aboveRef = (v, hi) => hi != null && v != null && isFinite(v) && v > hi;
const belowRef = (v, lo) => lo != null && v != null && isFinite(v) && v < lo;
const outsideRef = (v, lo, hi) => aboveRef(v, hi) || belowRef(v, lo);
function band(v, lo, hi, critLo, critHi) {
  if (v == null || !isFinite(v)) return "na";
  if (critLo != null && v < critLo) return "crit";
  if (critHi != null && v > critHi) return "crit";
  if (lo != null && v < lo) return "warn";
  if (hi != null && v > hi) return "warn";
  return "ok";
}
function tolBand(v, target, tol) {
  if (v == null || !isFinite(v) || target == null) return "na";
  if (tol == null) return "na";
  // outside tolerance is "warn": no source gives an action level at a multiple of the tolerance
  return Math.abs(v - target) <= tol ? "ok" : "warn";
}

function F(o) {
  return Object.assign({
    status: "na", basis: BASIS.C, confidence: "Medium",
    measured: "—", calc: "—", threshold: "Not set", source: "—", where: "—", text: "", actions: []
  }, o);
}

function runAnalysis() {
  const s = S.signal;
  if (!s) { S.results = null; return; }
  const m = S.markers, fs = s.fs;
  const smt = chArray("SMT"), spt = chArray("SPT"), mpc = chArray("MPC"), mpc2 = chArray("MPC2");

  /* ONE ENGINE. The single-milking report runs through analyseMilkingVD, the
     same function the full audit uses for every milking, so the two report
     modes cannot give different numbers for the same milking. A marker counts
     as an override only if the user moved it away from where the rule put it;
     every other marker is placed by the engine's rule. */
  const g = (S.sessions || [])[S.sessionIdx || 0];
  const base = { att: m.attach != null ? m.attach : g ? g.i0 : 0, end: m.end != null ? m.end : g ? g.i1 : s.n };
  const ov = {};
  ["attach", "peakStart", "takeoff", "end", "overmilkStart", "overmilkStart2", "cvfPoint"].forEach(k => {
    if (m[k] != null && !(S.markerAuto && S.markerAuto[k] === m[k])) ov[k] = m[k];
  });
  if (S.markerKey != null && g && g.i0 === S.markerKey) {
    const prev = JSON.stringify((S.handMarkers || {})[S.markerKey] || {}), now = JSON.stringify(ov);
    if (prev !== now) {
      S.handMarkers = S.handMarkers || {};
      if (Object.keys(ov).length) S.handMarkers[S.markerKey] = Object.assign({}, ov); else delete S.handMarkers[S.markerKey];
      S.auto = null;                       // the audit re-runs with the corrected markers
      logAudit("Markers corrected by hand", "Milking at " + clockAt(S.markerKey) + ": " + (Object.keys(ov).join(", ") || "back to the rules"));
    }
  }
  const E = smt ? analyseMilkingVD(g && g.m ? g.m : base, S.sessionIdx || 0, { smt, spt, mpc, mpc2 }, fs, null, ov) : null;
  const rFrom = E ? E.att : base.att, rTo = E ? E.to : base.end;
  const om = E ? (E.om1 != null ? E.om1 : E.om2) : null;
  const pfFrom = E ? E.pf : rFrom, pfTo = E ? (om != null ? om : E.to) : rTo;
  const handSet = Object.keys(ov);
  const pfManual = !!E;          // peak-flow window always bounded now: by hand where moved, otherwise by the manual's rule

  const R = {
    engine: E, overrides: handSet,
    window: { from: rFrom, to: rTo, pfFrom, pfTo, pfManual, pulsFrom: pfFrom, pulsTo: rTo,
              how: handSet.length ? "markers moved by hand: " + handSet.join(", ") + "; all others by the VaDia Suite manual ch. 22 rules"
                                  : "all markers by the VaDia Suite manual ch. 22 rules" },
    chStats: computeVacuumStats(rFrom, rTo),
    findings: [], actions: []
  };

  /* ---- pulsation: start of peak flow to start of take-off, as the audit does ---- */
  R.puls = !spt ? { ok: false, reason: "No channel is mapped to SPT." }
         : E && E.puls ? E.puls
         : { ok: false, reason: "Too few regular pulsation cycles between start of peak flow and take-off." };
  // CVF exactly as VaDia reports it: ten cycles from 60 s after start of peak flow (or the CVF marker)
  R.cvf = E && E.cvf ? Object.assign({ amp: E.cvf.max - E.cvf.min }, E.cvf) : null;
  R.cvfSpot = null;

  // Mouthpiece favourable time: start of peak flow to each channel's own overmilking marker
  const mp = (x, a, b) => x ? { pct: x.fav, abovePct: x.above, belowPct: x.below, lo: x.lo, hi: x.hi, mean: x.mean,
                                n: Math.max(0, b - a), from: a, to: b } : null;
  R.mpc  = E ? mp(E.mpc, pfFrom, pfTo) : null;
  R.mpc2 = E ? mp(E.mpc2, pfFrom, E.om2 != null ? E.om2 : E.to) : null;
  R.npg  = (smt && mpc) ? npgAnalysis(smt, mpc, pfFrom, pfTo) : null;
  R.bimodal = bimodalCheck();

  // clock time, not sample count
  const dT = (a, b) => tAt(b) - tAt(a);
  const machineOnS = E ? E.machineOn : dT(rFrom, rTo);
  const overmilkS = E ? E.overmilk : null;
  R.timing = { machineOnS, overmilkS,
               prepS: (m.attach != null && m.prepStart != null) ? dT(m.prepStart, m.attach) : null,
               peakFlowS: E ? dT(pfFrom, pfTo) : null };

  const f = R.findings;

  /* ---- 1. teat-end vacuum during peak flow ---- */
  if (smt) {
    const st = stats(smt, pfFrom, pfTo);
    if (E && E.smtPF != null) st.mean = E.smtPF;      // the engine's figure — identical window, shown so both report modes agree
    const lo = T("smtPF_min"), hi = T("smtPF_max");
    f.push(F({
      id: "smt_pf", group: "vacuum", title: "Teat-end vacuum during peak flow",
      value: st.mean, unit: "kPa", status: band(st.mean, lo, hi, null, null),
      basis: BASIS.C,
      confidence: S.mappingSource !== "user" ? "Provisional — channel roles not confirmed (Channels step)"
        : E && (typeof needsReview === "function" ? needsReview(E) && !validReview(E) : E.review.length > 0) ? "Provisional — this milking's markers are flagged for checking (" + E.review.join("; ") + ")"
        : handSet.length ? "High — window bounded by markers you placed" : "High — window bounded by the VaDia Suite manual ch. 22 rules",
      measured: "SMT channel, " + st.n.toLocaleString() + " samples between " + clockAt(pfFrom) + " and " + clockAt(pfTo),
      calc: "Arithmetic mean of the short-milk-tube vacuum over that window. Min " + fmt(st.min) +
            " kPa, max " + fmt(st.max) + " kPa, SD " + fmt(st.sd, 2) + " kPa.",
      threshold: lo == null && hi == null ? "Not set" : (lo == null ? "—" : fmt(lo)) + "–" + (hi == null ? "—" : fmt(hi)) + " kPa",
      source: threshSrc("smtPF_min"),
      where: "CH" + (chIndex("SMT") + 1) + " (SMT) · " + clockAt(pfFrom) + "–" + clockAt(pfTo),
      text: lo == null && hi == null ? "No range is set, so no judgement is made."
        : aboveRef(st.mean, hi) ? "Mean teat-end vacuum sits above the reference range. Sustained high teat-end vacuum is associated in the literature with teat-end hyperkeratosis and congestion; this measurement is consistent with that risk but does not on its own establish it."
        : belowRef(st.mean, lo) ? "Mean teat-end vacuum sits below the reference range, which may indicate slow or incomplete milk-out, restricted milk flow, or insufficient vacuum reserve. Requires verification against system vacuum and pump capacity."
        : lo == null || hi == null ? "Only one limit of the range is set. The value does not cross it; the other side is not assessed."
        : "Mean teat-end vacuum is inside the reference range for this test.",
      actions: aboveRef(st.mean, hi) ? ["Check system vacuum setting and regulator response at the receiver.",
                               "Verify take-off setting — a late take-off raises the time spent at high teat-end vacuum.",
                               "Re-test after any change and compare against this recording."]
             : belowRef(st.mean, lo) ? ["Check vacuum reserve and regulator response under load.",
                               "Inspect the milk path from liner to milkline for restriction; run a milk-flow resistance test.",
                               "Check liner condition and age."] : []
    }));
  }

  /* ---- 2. cyclic vacuum fluctuation — VaDia's definition, the same figure as the audit ---- */
  if (R.cvf) {
    const w = T("cvf_warn") != null ? T("cvf_warn") / 2 : null, c = T("cvf_crit") != null ? T("cvf_crit") / 2 : null;
    const side = Math.max(R.cvf.above, R.cvf.below);
    const st = side == null || w == null ? "na" : side <= w ? "ok" : (c == null || side <= c) ? "warn" : "crit";
    f.push(F({
      id: "cvf", group: "vacuum", title: "Cyclic vacuum fluctuation at the teat end",
      value: side, unit: "kPa either side", status: st,
      basis: BASIS.C, confidence: ov.cvfPoint != null ? "High — CVF point placed by hand" : "High",
      measured: R.cvf.n + " pulsation cycles on the SMT channel from " + clockAt(R.cvf.at),
      calc: "VaDia Suite's definition (manual v3.7 ch. 21–22): ten pulsation cycles starting " + (ov.cvfPoint != null ? "at the CVF point you placed" : "60 s after start of peak flow") +
            "; for each cycle the minimum, mean and maximum teat-end vacuum, then averaged. Min " + fmt(R.cvf.min) + " kPa, mean " + fmt(R.cvf.avg) +
            " kPa, max " + fmt(R.cvf.max) + " kPa → +" + fmt(R.cvf.above, 1) + " / −" + fmt(R.cvf.below, 1) + " kPa about the mean (peak to peak " + fmt(R.cvf.amp, 1) + " kPa).",
      threshold: w == null ? "Not set" : "±" + fmt(w, 1) + " kPa" + (c != null ? ", action level ±" + fmt(c, 1) + " kPa" : "") + " (half of the peak-to-peak settings " + fmt(T("cvf_warn")) + " / " + fmt(T("cvf_crit")) + " kPa)",
      source: threshSrc("cvf_warn"),
      where: "CH" + (chIndex("SMT") + 1) + " (SMT), " + clockAt(R.cvf.at),
      text: st === "crit"
        ? "Cyclic fluctuation exceeds the action level. This is consistent with liner instability, air admission, or an undersized milk path, and should be checked before any conclusion is drawn about pulsation settings."
        : st === "warn"
        ? "Cyclic fluctuation is above tolerance. Worth re-checking on other units to see whether it is unit-specific."
        : st === "ok" ? "Cyclic fluctuation is within tolerance." : "No tolerance is set, so no judgement is made.",
      actions: st === "warn" || st === "crit"
        ? ["Inspect liner condition, age and fit; note liner milkings since change.",
           "Check the claw air vent for partial blockage.",
           "Check short milk tube and claw for kinks or restriction.",
           "Repeat the test on at least two further units before concluding it is a system fault."] : []
    }));
  }

  /* ---- 3–9. pulsation ---- */
  if (R.puls.ok) {
    const P = R.puls;
    const rT = T("rate_target"), rTol = T("rate_tol");
    f.push(F({
      id: "rate", group: "puls", title: "Pulsation rate", value: P.rate, unit: "cycles/min",
      status: tolBand(P.rate, rT, rTol), basis: BASIS.C, confidence: "High",
      measured: P.n + " complete cycles on the SPT channel",
      calc: "Mean cycle length " + fmt(P.cycleMs, 0) + " ms → 60000 ÷ cycle length. Cycle-to-cycle SD " + fmt(P.rateSd, 2) + " cycles/min.",
      threshold: rT == null ? "Not set" : fmt(rT, 0) + " ± " + fmt(rTol, 0) + " cycles/min",
      source: threshSrc("rate_target"),
      where: "CH" + (chIndex("SPT") + 1) + " (SPT)",
      text: tolBand(P.rate, rT, rTol) === "ok" ? "Pulsation rate is on target."
        : "Pulsation rate is off target. Rate deviation changes liner open and rest time per cycle and should be corrected at the pulsator or controller before other pulsation findings are acted on.",
      actions: tolBand(P.rate, rT, rTol) === "ok" ? [] :
        ["Check pulsator controller setting and, on electronic pulsators, the firmware setting per pulsator.",
         "Test the remaining pulsators — a single deviating unit points to that pulsator, a uniform deviation points to the controller."]
    }));

    const ratioT = T("ratio_target"), ratioTol = T("ratio_tol");
    f.push(F({
      id: "ratio", group: "puls", title: "Pulsator ratio", value: P.ratioMilk, unit: "% milk phase",
      status: tolBand(P.ratioMilk, ratioT, ratioTol), basis: BASIS.C, confidence: "High",
      measured: P.n + " cycles",
      calc: "(a + b) ÷ cycle length. Measured ratio " + fmt(P.ratioMilk, 0) + ":" + fmt(P.ratioRest, 0) + ".",
      threshold: ratioT == null ? "Not set" : fmt(ratioT, 0) + ":" + fmt(100 - ratioT, 0) + " ± " + fmt(ratioTol, 0) + " %",
      source: threshSrc("ratio_target"),
      where: "CH" + (chIndex("SPT") + 1) + " (SPT)",
      text: tolBand(P.ratioMilk, ratioT, ratioTol) === "ok" ? "Pulsator ratio is on target."
        : "Pulsator ratio is off target. A long milk phase shortens the massage phase available to relieve teat congestion; a short milk phase slows milk removal.",
      actions: tolBand(P.ratioMilk, ratioT, ratioTol) === "ok" ? [] :
        ["Check the pulsator ratio setting.", "Check for air leakage in the pulsation line and at the T-piece used for this test."]
    }));

    const phases = [["a", P.a, "a_target", "a_tol", "liner opening"],
                    ["b", P.b, "b_target", "b_tol", "milk flow"],
                    ["c", P.c, "c_target", "c_tol", "liner closing"],
                    ["d", P.d, "d_target", "d_tol", "massage / rest"]];
    const phaseStatus = phases.map(([k, v, tid, tolid]) => tolBand(v, T(tid), T(tolid)));
    const worst = phaseStatus.includes("crit") ? "crit" : phaseStatus.includes("warn") ? "warn" : phaseStatus.includes("na") ? "na" : "ok";
    f.push(F({
      id: "phases", group: "puls", title: "Pulsation phase durations (a / b / c / d)",
      value: null, unit: "", status: worst, basis: BASIS.C, confidence: "High",
      table: phases.map(([k, v, tid, tolid, what], i) => ({
        phase: k, what, ms: v, pct: [P.aPct, P.bPct, P.cPct, P.dPct][i],
        target: T(tid), tol: T(tolid), status: phaseStatus[i]
      })),
      measured: P.n + " cycles on the SPT channel; cycle minimum " + fmt(P.vmax - (P.hi - P.lo) - P.ref, 1) + " kPa to maximum " + fmt(P.vmax) + " kPa",
      calc: "Phase boundaries taken at the reference levels " + fmt(P.lo) + " kPa and " + fmt(P.hi) +
            " kPa — that is, " + fmt(P.ref) + " kPa above the cycle minimum and " + fmt(P.ref) +
            " kPa below the cycle maximum. a = rise between the levels, b = above the upper level, c = fall between them, d = below the lower level.",
      threshold: "a " + fmt(T("a_target"), 0) + " ± " + fmt(T("a_tol"), 0) + " ms · b " + fmt(T("b_target"), 0) + " ± " + fmt(T("b_tol"), 0) +
                 " ms · c " + fmt(T("c_target"), 0) + " ± " + fmt(T("c_tol"), 0) + " ms · d " + fmt(T("d_target"), 0) + " ± " + fmt(T("d_tol"), 0) + " ms",
      source: threshSrc("a_target"),
      where: "CH" + (chIndex("SPT") + 1) + " (SPT)",
      text: worst === "ok" ? "All four phases are inside tolerance for the selected threshold preset."
        : "One or more phases fall outside tolerance. Phase timing governs how the liner opens, milks and massages; deviation may indicate a pulsator fault, a leaking pulsation line, or simply a different setting than the preset assumes. Confirm the intended setting for this installation before changing anything.",
      actions: worst === "ok" ? [] :
        ["Confirm the pulsation setting the installation was commissioned with — the preset may not be the specification for this parlor.",
         "Check the pulsation line, T-piece and connectors for leaks.",
         "Test the same pulsator twice, then test neighbouring units, before replacing parts."]
    }));

    const dMin = T("d_min");
    if (dMin != null) f.push(F({
      id: "dmin", group: "puls", title: "d-phase against its absolute minimum",
      value: P.d, unit: "ms", status: P.d >= dMin ? "ok" : "crit", basis: BASIS.C, confidence: "High",
      measured: "Mean d-phase over " + P.n + " cycles",
      calc: "Time per cycle below the lower reference level (" + fmt(P.lo) + " kPa).",
      threshold: "≥ " + fmt(dMin, 0) + " ms", source: threshSrc("d_min"),
      where: "CH" + (chIndex("SPT") + 1) + " (SPT)",
      text: P.d >= dMin ? "The massage phase meets the minimum duration."
        : "The massage phase is shorter than the accepted minimum. A short d-phase leaves less time per cycle for the liner to relieve congestion at the teat end and should be corrected.",
      actions: P.d >= dMin ? [] : ["Recheck pulsation rate and ratio together — d-phase is the product of both.",
                                   "Check for a slow-closing pulsator valve or a restricted pulsation line."]
    }));

    const dipMax = T("dip_max");
    f.push(F({
      id: "dip", group: "puls", title: "b-phase dip", value: P.dip, unit: "kPa",
      status: band(P.dip, null, dipMax, null, null),
      basis: BASIS.C, confidence: "Medium",
      measured: P.n + " cycles",
      calc: "Maximum minus minimum inside the b-phase with the outer 10 % of the phase trimmed off, averaged across " + P.n +
            " cycles. The lowest point falls on average " + fmt(P.dipAt, 0) + " % of the way through the milk phase. Worst single cycle " + fmt(P.dipMax) + " kPa.",
      threshold: dipMax == null ? "Not set" : "≤ " + fmt(dipMax) + " kPa", source: threshSrc("dip_max"),
      where: "CH" + (chIndex("SPT") + 1) + " (SPT)",
      text: (P.dip > (dipMax || Infinity)
        ? "Vacuum in the pulsation chamber is not holding flat through the milk phase. This may indicate restricted pulsation airflow, an undersized pulsation line, a leaking connection, or the paired chamber of an alternating pulsator loading the line as it switches — it should be checked before the liner is blamed."
        : "Pulsation chamber vacuum holds through the milk phase.") +
        " VaDia Suite reports its own Dip column for the same recording; BioControl does not publish how that figure is bounded, so the two numbers need not agree. The definition used here is stated above — compare like with like before acting on either.",
      actions: P.dip > (dipMax || Infinity) ? ["Check pulsation line internal diameter and length against the manufacturer's specification.",
                                               "Check for partial blockage in the pulsation line, T-piece or filter.",
                                               "Check pulsator air consumption against available vacuum reserve."] : []
    }));

    const lmax = T("limp_max");
    f.push(F({
      id: "limp", group: "puls", title: "Alternate-cycle asymmetry (limping proxy)",
      value: P.limp, unit: "%", status: band(P.limp, null, lmax, null, null),
      basis: BASIS.I, confidence: "Low — one pulsation chamber was measured",
      measured: P.n + " cycles on a single SPT tap",
      calc: "Difference between the mean b-phase of odd-numbered and even-numbered cycles, expressed as a percentage of cycle length.",
      threshold: lmax == null ? "Not set" : "≤ " + fmt(lmax) + " %", source: threshSrc("limp_max"),
      where: "CH" + (chIndex("SPT") + 1) + " (SPT)",
      text: "Limping as defined in ISO 6690 compares the two pulsation chambers of an alternating pulsator measured simultaneously. Only one chamber was recorded here, so this figure is a proxy: it detects asymmetry between successive cycles, not between sides. " +
            (P.limp > (lmax || Infinity) ? "The measured asymmetry is above the set limit and requires verification with both chambers tapped."
                                          : "No asymmetry above the set limit was seen in this proxy measurement."),
      actions: P.limp > (lmax || Infinity) ? ["Repeat the pulsator test with both pulsation chambers tapped on separate channels to measure limping properly.",
                                              "If confirmed, inspect the pulsator valve and both pulsation lines for leaks or restriction."] : []
    }));

    const vT = T("vmax_target"), vTol = T("vmax_tol");
    f.push(F({
      id: "vmax", group: "puls", title: "Pulsation chamber maximum vacuum",
      value: P.vmax, unit: "kPa", status: tolBand(P.vmax, vT, vTol), basis: BASIS.M, confidence: "High",
      measured: "Mean of the per-cycle maximum over " + P.n + " cycles",
      calc: "Highest vacuum reached in the pulsation chamber each cycle, averaged.",
      threshold: vT == null ? "Not set" : fmt(vT) + " ± " + fmt(vTol) + " kPa", source: threshSrc("vmax_target"),
      where: "CH" + (chIndex("SPT") + 1) + " (SPT)",
      text: tolBand(P.vmax, vT, vTol) === "ok" ? "The pulsation chamber reaches the expected working vacuum."
        : "The pulsation chamber does not reach the expected working vacuum, which may indicate a leak in the pulsation line, a restricted air path, or a system vacuum level different from the one assumed by the preset.",
      actions: tolBand(P.vmax, vT, vTol) === "ok" ? [] :
        ["Measure system vacuum at the receiver and compare with the pulsation chamber figure.",
         "Check the pulsation line, T-piece and pulsator ports for leaks."]
    }));

    const oMin = T("open_min"), oMax = T("open_max");
    f.push(F({
      id: "open", group: "puls", title: "Liner open time", value: P.openMs, unit: "ms",
      status: band(P.openMs, oMin, oMax, null, null), basis: BASIS.C, confidence: "Medium",
      measured: P.n + " cycles",
      calc: "a-phase + b-phase = " + fmt(P.a, 0) + " + " + fmt(P.b, 0) + " ms.",
      threshold: oMin == null ? "Not set" : fmt(oMin, 0) + "–" + fmt(oMax, 0) + " ms", source: threshSrc("open_min"),
      where: "CH" + (chIndex("SPT") + 1) + " (SPT)",
      text: "Liner open time is derived from the pulsation chamber trace. Actual liner movement depends on liner tension and condition and is not measured by this test; a liner compression test would be needed to confirm it.",
      actions: band(P.openMs, oMin, oMax) === "ok" ? [] :
        ["Review pulsation rate and ratio together — open time is set by both.",
         "Record liner age in milkings; fatigued liners change their own open behaviour at a given pulsation setting."]
    }));
  } else {
    f.push(F({
      id: "puls_na", group: "puls", title: "Pulsation analysis", value: null, status: "na",
      basis: BASIS.C, confidence: "—", measured: "—", calc: "—",
      text: "Not enough documented information to interpret automatically. Expert review required. " + (R.puls.reason || "")
    }));
  }

  /* ---- 10. mouthpiece chamber ---- */
  [["MPC", R.mpc], ["MPC2", R.mpc2]].forEach(([role, res]) => {
    if (!res) return;
    const tgt = T("mpcFav_pct"), crit = T("mpcFav_pct_crit");
    f.push(F({
      id: "mpcfav_" + role, group: "vacuum", title: "Time inside the favourable band — " + role,
      value: res.pct, unit: "%", status: band(res.pct, tgt, null, crit, null), basis: BASIS.C, confidence: "High",
      measured: res.n.toLocaleString() + " samples on the " + role + " channel over the peak-flow period, " +
                clockAt(pfFrom) + " to " + clockAt(pfTo) + (pfManual ? "" : " (peak-flow boundaries not marked — the whole attachment period was used instead)"),
      calc: "Proportion of samples with mouthpiece chamber vacuum between " + fmt(res.lo) + " and " + fmt(res.hi) +
            " kPa. Below band " + fmt(res.belowPct) + " %, above band " + fmt(res.abovePct) + " %.",
      threshold: tgt == null ? "Not set" : "≥ " + fmt(tgt, 0) + " % (action level " + fmt(crit, 0) + " %)",
      source: threshSrc("mpcFav_pct") + (role === "MPC"
        ? ". Window (start of peak flow to this channel's overmilking marker) and band verified against VaDia Suite's own MPCVaccumFavorable column for nine cows: 0.17 percentage points with VaDia's markers. With automatic markers 6 of 9 within 5 points — the misses are milkings where the overmilking marker differs."
        : ". Measured up to this channel's own overmilking marker, as VaDia Suite does: 0.10 percentage points from VaDia Suite's MPC2VaccumFavorable with VaDia's markers; with automatic markers 5 of 9 within 3 points."),
      where: "CH" + (chIndex(role) + 1) + " (" + role + ")",
      text: res.pct >= (tgt || 0) ? "Mouthpiece chamber vacuum spends most of the milking inside the favourable band."
        : res.abovePct > res.belowPct
          ? "Mouthpiece chamber vacuum is above the favourable band for a substantial share of the milking, which is consistent with the liner riding up the teat or with a mouthpiece that is sealing too tightly. Associated with teat congestion; requires verification by observing liner position during milking."
          : "Mouthpiece chamber vacuum is below the favourable band for a substantial share of the milking, which may indicate air leakage at the mouthpiece or a poor liner-to-teat fit.",
      actions: res.pct >= (tgt || 0) ? [] :
        ["Observe cluster alignment and liner position on the teat during milking on this stall.",
         "Check liner mouthpiece size against the teat sizes in this group.",
         "Record liner age in milkings and compare with the change interval.",
         "Repeat the measurement on cows of a different teat size before concluding the liner is wrong."]
    }));
  });

  /* ---- 11. negative pressure gradient ---- */
  if (R.npg) f.push(F({
    id: "npg", group: "vacuum", title: "Negative pressure gradient (SMT below MPC)",
    value: R.npg.pct, unit: "% of peak-flow time", status: "na", basis: BASIS.C,
    confidence: pfManual ? "Medium" : "Low — peak-flow boundaries were not marked",
    measured: R.npg.n.toLocaleString() + " paired samples of SMT and MPC",
    calc: "Share of samples where teat-end vacuum is lower than mouthpiece chamber vacuum. Mean gap while present " +
          fmt(R.npg.meanGap) + " kPa, largest " + fmt(R.npg.worst) + " kPa at " + clockAt(R.npg.worstAt) + ".",
    threshold: "No documented limit is available", source: "—",
    where: "CH" + (chIndex("SMT") + 1) + " / CH" + (chIndex("MPC") + 1),
    text: "A negative pressure gradient means vacuum at the teat end is lower than at the mouthpiece, which is associated in the literature with restricted milk flow out of the teat. No documented threshold is available for this figure, so it is reported without a verdict and should be read alongside the teat-end vacuum and fluctuation findings.",
    actions: []
  }));

  /* ---- 12. irregular vacuum fluctuations — VaDia's type 1 / type 2, as in the audit ---- */
  if (E) {
    const i1W = T("ivf1_max"), i1C = T("ivf1_crit"), i2W = T("ivf2_max");
    const st = i1W == null ? "na" : (i1C != null && E.ivf1M > i1C) ? "crit" : (E.ivf1M > i1W || (i2W != null && E.ivf2M > i2W)) ? "warn" : "ok";
    const n = E.slips.length;
    f.push(F({
      id: "ivf", group: "vacuum", title: "Irregular vacuum fluctuations (VaDia type 1 / type 2)",
      value: E.ivf1M, unit: "type 1 during milking", status: st, basis: BASIS.C, confidence: "Medium — a drop of this shape is not always a slip",
      measured: "SMT channel, attachment " + clockAt(E.att) + " to end " + clockAt(E.end),
      calc: "Type 1: a drop of ≥ 21 kPa at ≥ 100 kPa/s; type 2: ≥ 14 kPa at ≥ 56 kPa/s (VaDia Suite manual v3.7 ch. 22). Whole milking, comparable with VaDia Suite: " +
            E.ivf1 + " type 1, " + E.ivf2 + " type 2. Split by phase: drops in the first " + VD.ATTACH_WINDOW_S + " s are teatcups going on (" + E.ivfAttach + " type 2), drops after start of take-off are removal; only those in between are judged — " +
            E.ivf1M + " type 1, " + E.ivf2M + " type 2 during milking. Slip-shaped drops during milking (Baxter et al. via Mein et al. 2004): " + n + ".",
      threshold: i1W == null ? "Not set" : "type 1 ≤ " + fmt(i1W, 0) + (i1C != null ? " (major liner slip above " + fmt(i1C, 0) + ")" : "") + ", type 2 ≤ " + fmt(i2W, 0) + " per milking",
      source: threshSrc("ivf1_max"),
      where: "CH" + (chIndex("SMT") + 1) + " (SMT)",
      eventList: E.slips.slice(0, 12).map(e => ({ at: clockAt(e.idx), depth: e.depth, ms: Math.round((e.minIdx - e.idx) / fs * 1000) })),
      text: st === "ok" || st === "na"
        ? (n ? n + " slip-shaped drop" + (n > 1 ? "s" : "") + " during milking, within the limits set." : "No slip-shaped drops during milking.")
        : "More irregular fluctuations during milking than the limit. Drops of this shape are consistent with air admission at the teat end — liner slip is the common cause — but the recording alone cannot distinguish a slip from a cluster knocked by the cow. Check against your own observation notes for the same times.",
      actions: st === "warn" || st === "crit" ? ["Cross-check the listed times against what was observed in the parlor.",
                               "Check liner condition, age and mouthpiece fit on the tested units.",
                               "Check cluster alignment and weight distribution on this stall.",
                               "Review pre-milking stimulation — under-stimulated cows slip more."] : []
    }));
  }

  /* ---- 13. overmilking ---- */
  if (overmilkS != null) {
    const w = T("overmilk_warn"), c = T("overmilk_crit");
    f.push(F({
      id: "overmilk", group: "routine", title: "Overmilking duration", value: overmilkS, unit: "s",
      status: band(overmilkS, null, w, null, c),
      basis: ov.overmilkStart != null ? BASIS.U : BASIS.I,
      confidence: ov.overmilkStart != null ? "High — overmilking marker placed by hand"
        : "Medium — placed by rule from mouthpiece vacuum, not from milk flow" + (E.omInfo[0] && E.omInfo[0].candidates > 1 ? "; " + E.omInfo[0].candidates + " candidate changes found, the " + E.omInfo[0].rule + " one used (Thresholds)" : ""),
      measured: "Interval between start of overmilking at " + clockAt(E.om1 != null ? E.om1 : E.om2) + " and start of take-off at " + clockAt(E.to),
      calc: "Elapsed clock time = " + hms(overmilkS) + "." + (E.overmilkSMT != null ? " Independent check: teat-end vacuum returned to its no-flow plateau " + hms(E.overmilkSMT) + " before take-off (" + (E.omAgree ? "agrees within 30 s" : "differs — check the trace") + ")." : ""),
      threshold: w == null ? "Not set" : "target < " + fmt(w, 0) + " s, action level " + fmt(c, 0) + " s",
      source: threshSrc("overmilk_warn"),
      where: "MPC channel " + (E.om1 != null ? "CH" + (chIndex("MPC") + 1) : "CH" + (chIndex("MPC2") + 1)) + ", take-off on SMT",
      text: overmilkS > (c || Infinity)
        ? "Overmilking runs past the action level. Time on a near-empty udder at full vacuum is associated with teat-end hyperkeratosis and slower recovery between milkings."
        : overmilkS > (w || Infinity) ? "Overmilking is longer than the target. Worth checking the take-off setting."
        : "Overmilking duration is within target.",
      actions: overmilkS > (w || Infinity)
        ? ["Check the automatic take-off flow threshold and its delay setting.",
           "Check take-off sensor calibration on this unit.",
           "If take-off is manual, review operator routine and the cow-to-unit ratio.",
           "Re-run this test after adjustment and compare."] : []
    }));
  } else {
    f.push(F({ id: "overmilk", group: "routine", title: "Overmilking duration", value: null, status: "na",
      basis: BASIS.U, confidence: "—", threshold: "—", source: "—",
      text: "Not measured — no mouthpiece channel gave a usable overmilking marker. Mark the overmilking boundary on the Markers step, from the milk-flow record or from observation, to have this reported." }));
  }

  /* ---- 14. bimodal letdown ---- */
  if (R.bimodal.ok) {
    const thr = R.bimodal.threshold;
    f.push(F({
      id: "bimodal", group: "routine", title: "Delayed letdown / bimodal milking indication",
      value: R.bimodal.rise, unit: "kPa", status: thr == null ? "na" : (R.bimodal.rise >= thr ? "warn" : "ok"),
      basis: BASIS.I, confidence: "Low — vacuum is an indirect indicator of milk flow",
      measured: "SMT channel, from " + fmt(R.bimodal.settledSec, 0) + " s to " + fmt(R.bimodal.windowS, 0) +
                " s after attachment (the attachment ramp is skipped), averaged to one value per second",
      calc: "Teat-end vacuum falls as milk flow starts and recovers as it stops. The figure is the recovery from the lowest second (" +
            fmt(R.bimodal.minSec, 0) + " s after attachment) to the highest following second (" + fmt(R.bimodal.atSec, 0) + " s): " + fmt(R.bimodal.rise) + " kPa.",
      threshold: thr == null ? "Not set — no documented vacuum-only threshold exists" : "≥ " + fmt(thr) + " kPa",
      source: thr == null ? "—" : "User-defined threshold — not universal",
      where: "CH" + (chIndex("SMT") + 1) + " (SMT), " + clockAt(R.bimodal.startIdx) + " onwards",
      text: "Bimodal milking is defined on the milk flow curve, not on vacuum. A rise in teat-end vacuum shortly after attachment is consistent with flow starting, stopping and restarting — but it is also consistent with a slipping liner or a cow shifting weight. " +
            (thr == null ? "No threshold is set, so no verdict is given; read this value alongside the recorded preparation time."
             : R.bimodal.rise >= thr ? "The measured recovery exceeds the threshold you set and may indicate delayed letdown. Verify with a milk-flow record before changing the preparation routine."
             : "The measured recovery is below the threshold you set."),
      actions: (thr != null && R.bimodal.rise >= thr)
        ? ["Record actual stimulation time and lag time to attachment for the group tested.",
           "Compare against the lag-time guidance of 60–120 s from start of preparation to attachment (Penn State Extension).",
           "Confirm with a milk-flow meter or an MTT record before changing the routine."] : []
    }));
  }

  /* ---- 15. recording quality ---- */
  const gaps = s.gaps || [];
  f.push(F({
    id: "quality", group: "quality", title: "Recording quality", value: null, status: gaps.length ? "warn" : "ok",
    basis: BASIS.M, confidence: "High",
    measured: s.n.toLocaleString() + " samples per channel at " + s.fs + " Hz over " + hms(totalSeconds()),
    calc: gaps.length ? gaps.length + " logging gap(s): " + gaps.slice(0, 4).map(g => fmt(g.seconds, 0) + " s").join(", ") +
          (gaps.length > 4 ? " …" : "") : "Continuous recording, no logging gaps.",
    threshold: "—", source: "—", where: "All channels",
    text: gaps.length ? "The device stopped logging during the recording — normal when vacuum falls below the auto-start level between cows. Statistics skip the gaps and charts show them as breaks."
                      : "The recording is continuous across the whole session.",
    actions: []
  }));

  /* ---- corrective action plan ---- */
  const seen = new Set();
  f.filter(x => x.status === "crit" || x.status === "warn").forEach(x => {
    x.actions.forEach(a => {
      const key = a.toLowerCase();
      if (seen.has(key)) { const ex = R.actions.find(y => y.text.toLowerCase() === key); if (ex && !ex.from.includes(x.title)) ex.from.push(x.title); return; }
      seen.add(key);
      R.actions.push({ text: a, from: [x.title], priority: x.status === "crit" ? 1 : 2 });
    });
  });
  R.actions.sort((a, b) => a.priority - b.priority);
  if (R.actions.length) R.actions.push({ text: "Repeat this test under the same conditions after the corrections above and compare the two recordings side by side.",
                                          from: ["Verification"], priority: 3 });

  const crit = f.filter(x => x.status === "crit").length, warn = f.filter(x => x.status === "warn").length;
  R.verdict = crit ? "crit" : warn ? "warn" : "ok";
  R.counts = { crit, warn, ok: f.filter(x => x.status === "ok").length, na: f.filter(x => x.status === "na").length };
  S.results = R;
  logAudit("Analysis run", f.length + " findings · " + crit + " at action level, " + warn + " outside tolerance");
  return R;
}

/* ==========================================================================
   CHARTS — canvas, drawn to the kPa scale, theme-token coloured.
   Traces are min/max enveloped per pixel column so a 500 000-sample
   recording draws without dropping a single spike.
   ========================================================================== */

function cssVar(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }

const MARKER_DEFS = [
  ["prepStart",     "Prep start"],
  ["attach",        "Attach"],
  ["peakStart",     "Peak flow"],
  ["overmilkStart", "Overmilk"],
  ["overmilkStart2","Overmilk 2nd"],
  ["flowEnd",       "Flow end"],
  ["takeoff",       "Take-off"],
  ["end",           "End"],
  ["cvfPoint",      "CVF spot"]
];

/* The milking phases the markers bound, drawn as a labelled ribbon above the
   plot and as a pale tint behind the traces. */
function milkingPhases(m) {
  if (!m || m.attach == null || m.end == null) return [];
  const om = m.overmilkStart != null ? m.overmilkStart : null;
  const P = [];
  if (m.peakStart != null) P.push(["Let-down", m.attach, m.peakStart, "--info-soft", "--ink-3"]);
  if (m.peakStart != null) P.push(["Peak flow", m.peakStart, om != null ? om : (m.takeoff != null ? m.takeoff : m.end), "--accent-soft", "--accent"]);
  if (om != null && m.takeoff != null) P.push(["Overmilking", om, m.takeoff, "--warn-soft", "--warn"]);
  if (m.takeoff != null) P.push(["Take-off", m.takeoff, m.end, "--crit-soft", "--crit"]);
  return P.filter(p => p[2] > p[1]);
}

function makeTrace(host, opts) {
  opts = opts || {};
  const box = el("div", { class: "chartbox" });
  const cv = el("canvas");
  const tip = el("div", { class: "tooltip", style: "display:none" });
  box.append(cv, tip);
  const legendEl = el("div", { class: "legend" });
  host.append(box, legendEl);

  const pad = { l: 48, r: 14, b: 28 };
  const LANE_H = 150, LANE_GAP = 12;
  let view = null, hover = null, drag = null, placing = null, geo = null;

  function sig() { return S.signal; }
  function dom() {
    const s = sig(); if (!s) return [0, 1];
    if (!view) view = [0, s.n];
    view[0] = clamp(view[0], 0, s.n - 2); view[1] = clamp(view[1], view[0] + 10, s.n);
    return view;
  }
  const visibleCh = () => sig() ? sig().ch.map((_, c) => c).filter(c => S.visible[c] && S.mapping[c] !== "OFF") : [];
  function yDomain(chs, i0, i1) {
    const s = sig(); let lo = Infinity, hi = -Infinity;
    const step = Math.max(1, Math.floor((i1 - i0) / 6000));
    chs.forEach(c => { const arr = s.ch[c];
      for (let i = i0; i < i1; i += step) { const v = arr[i]; if (!isFinite(v)) continue; if (v < lo) lo = v; if (v > hi) hi = v; } });
    if (!isFinite(lo)) { lo = 0; hi = 50; }
    const padv = Math.max(1, (hi - lo) * 0.08);
    return [Math.min(0, lo - padv), hi + padv];
  }
  const showMarkers = () => opts.markers !== false;

  function draw() {
    const s = sig(); if (!s) return;
    const [i0, i1] = dom();
    const V = visibleCh();
    const split = S.chartLayout === "split" && V.length > 1;
    const lanes = split ? V.map(c => [c]) : [V];
    const phases = showMarkers() ? milkingPhases(S.markers) : [];
    const markerKeys = showMarkers() ? MARKER_DEFS.filter(([k]) => S.markers[k] != null && S.markers[k] >= i0 && S.markers[k] <= i1) : [];
    const top = 8 + (phases.length ? 22 : 0) + (markerKeys.length ? 34 : 0) + (phases.length || markerKeys.length ? 4 : 4);
    const laneH = split ? LANE_H : (opts.height || 300) - top - pad.b;
    const H = top + lanes.length * laneH + (lanes.length - 1) * LANE_GAP + pad.b;
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    const W = box.clientWidth || 700;
    cv.width = W * dpr; cv.height = H * dpr; cv.style.height = H + "px";
    const x = cv.getContext("2d");
    x.setTransform(dpr, 0, 0, dpr, 0, 0);
    x.clearRect(0, 0, W, H);
    const pw = W - pad.l - pad.r;
    const X = i => pad.l + (i - i0) / (i1 - i0) * pw;
    const plotTop = top, plotBot = H - pad.b;
    const ink3 = cssVar("--ink-3"), line = cssVar("--line-soft"), surf = cssVar("--surface");
    const monoF = cssVar("--mono").split(",")[0].replace(/"/g, "") + ", monospace";
    const dispF = cssVar("--display").split(",")[0].replace(/"/g, "") + ", sans-serif";
    x.fillStyle = surf; x.fillRect(0, 0, W, H);

    if (!V.length) {
      x.fillStyle = ink3; x.font = "13px " + dispF; x.textAlign = "center"; x.textBaseline = "middle";
      x.fillText("No channel selected — switch one on below", W / 2, H / 2);
      geo = null; return;
    }

    // --- phase ribbon (top strip) and tint behind the plot
    const cx = i => clamp(X(i), pad.l, W - pad.r);
    if (phases.length) {
      const ry = 8, rh = 18;
      phases.forEach(([name, a, b, soft, strong]) => {
        if (b < i0 || a > i1) return;
        const xa = cx(a), xb = cx(b); if (xb - xa < 1) return;
        x.fillStyle = cssVar(soft); x.fillRect(xa, ry, xb - xa, rh);
        x.fillStyle = cssVar(strong); x.fillRect(xa, ry + rh - 3, xb - xa, 3);
        x.globalAlpha = .5; x.fillStyle = cssVar(soft); x.fillRect(xa, plotTop, xb - xa, plotBot - plotTop); x.globalAlpha = 1;
        const lab = name + "  " + hms(tAt(b) - tAt(a));
        x.font = "600 11px " + dispF; x.textBaseline = "middle"; x.textAlign = "center";
        const txt = x.measureText(lab).width + 8 < xb - xa ? lab : (x.measureText(name).width + 8 < xb - xa ? name : "");
        if (txt) { x.fillStyle = cssVar("--ink"); x.fillText(txt, (xa + xb) / 2, ry + (rh - 3) / 2 + 1); }
      });
    }

    // --- x grid and clock-time labels (shared by every lane)
    x.font = "11px " + monoF; x.textAlign = "center"; x.textBaseline = "top";
    const ticks = Math.max(2, Math.min(8, Math.floor(pw / 90)));
    for (let k = 0; k <= ticks; k++) {
      const i = Math.round(i0 + (i1 - i0) * k / ticks);
      const xx = Math.round(X(i)) + .5;
      x.strokeStyle = line; x.lineWidth = 1; x.beginPath(); x.moveTo(xx, plotTop); x.lineTo(xx, plotBot); x.stroke();
      x.fillStyle = ink3; x.fillText(opts.elapsed ? hms(tAt(i)) : clockAt(i), clamp(xx, 26, W - 26), plotBot + 5);
    }

    // --- lanes
    const cols = Math.max(1, Math.floor(pw)), per = (i1 - i0) / cols, dense = per > 1.2;
    const laneGeo = [];
    lanes.forEach((chs, li) => {
      const ly0 = plotTop + li * (laneH + LANE_GAP), ly1 = ly0 + laneH;
      const [y0, y1] = (!split && opts.yFixed) || yDomain(chs, i0, i1);
      const Y = v => ly0 + (1 - (v - y0) / (y1 - y0)) * laneH;
      laneGeo.push({ chs, ly0, ly1, Y });
      if (split) { x.strokeStyle = cssVar("--line"); x.lineWidth = 1; x.strokeRect(pad.l + .5, ly0 + .5, pw - 1, laneH - 1); }
      // y grid in kPa
      const span = y1 - y0;
      const stepY = span > 60 ? 20 : span > 30 ? 10 : span > 12 ? 5 : span > 5 ? 2 : 1;
      x.strokeStyle = line; x.lineWidth = 1; x.fillStyle = ink3; x.font = "11px " + monoF; x.textAlign = "right"; x.textBaseline = "middle";
      for (let v = Math.ceil(y0 / stepY) * stepY; v <= y1; v += stepY) {
        const yy = Math.round(Y(v)) + .5;
        x.beginPath(); x.moveTo(pad.l, yy); x.lineTo(W - pad.r, yy); x.stroke();
        x.fillText(v.toFixed(0), pad.l - 7, yy);
      }
      if (li === 0) { x.textBaseline = "bottom"; x.fillText("kPa", pad.l - 7, ly0 - 2); }
      // MPC favourable band, only where a mouthpiece channel is drawn
      if (opts.showBand && T("mpcFav_lo") != null && chs.some(c => /^MPC/.test(S.mapping[c]))) {
        x.fillStyle = cssVar("--good"); x.globalAlpha = .08;
        const a = Y(T("mpcFav_hi")), b = Y(T("mpcFav_lo"));
        x.fillRect(pad.l, Math.max(ly0, Math.min(a, b)), pw, Math.min(ly1, Math.max(a, b)) - Math.max(ly0, Math.min(a, b)));
        x.globalAlpha = 1;
      }
      // teaching mode: the published band for each line, over the stretch where it applies
      const pwin = S.teach ? peakWindow(S.markers) : null;
      if (pwin) {
        const groups = {};
        chs.forEach(c => { const band = bandFor(S.mapping[c]); if (!band) return;
          const k = band.lo + "-" + band.hi; (groups[k] = groups[k] || { band, roles: [], col: cssVar(chColVar(c)) }).roles.push(S.mapping[c]); });
        Object.values(groups).forEach(({ band, roles, col }) => {
          const xa = Math.max(pad.l, X(pwin[0])), xb = Math.min(W - pad.r, X(pwin[1])); if (xb - xa < 2) return;
          const ya = Math.max(ly0, Y(band.hi)), yb = Math.min(ly1, Y(band.lo)); if (yb <= ya) return;
          x.fillStyle = col; x.globalAlpha = .09; x.fillRect(xa, ya, xb - xa, yb - ya); x.globalAlpha = .6;
          x.strokeStyle = col; x.lineWidth = 1; x.setLineDash([4, 3]);
          [ya, yb].forEach(yy => { x.beginPath(); x.moveTo(xa, Math.round(yy) + .5); x.lineTo(xb, Math.round(yy) + .5); x.stroke(); });
          x.setLineDash([]); x.globalAlpha = 1;
          const lab = roles.join(" / ") + " band " + fmt(band.lo, 0) + "–" + fmt(band.hi, 0) + " kPa";
          x.font = "600 10px " + dispF; const tw = x.measureText(lab).width + 8;
          const lx = Math.min(xb - tw - 2, xa + 4), lyy = yb - 15;
          x.fillStyle = surf; x.globalAlpha = .88; x.fillRect(lx, lyy, tw, 13); x.globalAlpha = 1;
          x.fillStyle = col; x.textAlign = "left"; x.textBaseline = "middle"; x.fillText(lab, lx + 4, lyy + 7);
        });
      }
      x.save(); x.beginPath(); x.rect(pad.l, ly0, pw, laneH); x.clip();
      // At full zoom every sample is drawn. Once a pixel column covers more than one
      // sample each channel is drawn twice: a translucent min–max envelope so no spike
      // is lost, and a running mean over at least one second (a shorter window zig-zags
      // across a pulsation trace and paints the plot solid).
      chs.forEach(c => {
        const arr = s.ch[c], col = cssVar(chColVar(c));
        if (dense) {
          const mean = new Float64Array(cols).fill(NaN), lo = new Float64Array(cols).fill(NaN), hi = new Float64Array(cols).fill(NaN);
          const half = Math.max(per / 2, s.fs / 2), stride = Math.max(1, Math.floor(half * 2 / 400));
          for (let k = 0; k < cols; k++) {
            const a = i0 + Math.floor(k * per), b = Math.min(i1, i0 + Math.floor((k + 1) * per));
            let mn = Infinity, mx = -Infinity;
            for (let i = a; i < b; i++) { const v = arr[i]; if (!isFinite(v)) continue; if (v < mn) mn = v; if (v > mx) mx = v; }
            if (!isFinite(mn)) continue;
            lo[k] = mn; hi[k] = mx;
            const mid = (a + b) / 2, wa = Math.max(i0, Math.round(mid - half)), wb = Math.min(i1, Math.round(mid + half));
            let sum = 0, cnt = 0;
            for (let i = wa; i < wb; i += stride) { const v = arr[i]; if (!isFinite(v)) continue; sum += v; cnt++; }
            if (cnt) mean[k] = sum / cnt;
          }
          // the pulsation envelope spans the whole working range; keep it faint in overlay
          x.fillStyle = col; x.globalAlpha = (!split && S.mapping[c] === "SPT") ? .09 : .16;
          let k = 0;
          while (k < cols) {
            while (k < cols && !isFinite(hi[k])) k++;
            const st = k; while (k < cols && isFinite(hi[k])) k++;
            if (k - st < 2) continue;
            x.beginPath();
            for (let j = st; j < k; j++) x.lineTo(pad.l + j + .5, Y(hi[j]));
            for (let j = k - 1; j >= st; j--) x.lineTo(pad.l + j + .5, Y(lo[j]));
            x.closePath(); x.fill();
          }
          x.globalAlpha = 1;
          x.lineJoin = "round"; x.lineCap = "round";
          const band = pwin ? bandFor(S.mapping[c]) : null;
          const pts = [];
          for (let q = 0; q < cols; q++) { const v = mean[q]; if (!isFinite(v)) { pts.push(null); continue; }
            const idx = i0 + (q + .5) * per;
            const z = band && idx >= pwin[0] && idx < pwin[1] ? (v > band.hi ? 1 : v < band.lo ? -1 : 0) : 0;
            pts.push([pad.l + q + .5, Y(v), z]); }
          strokeZoned(x, pts, col, 2);
        } else {
          x.lineJoin = "round";
          const band = pwin ? bandFor(S.mapping[c]) : null, rm = band ? runningMean(arr, i0, i1, s.fs) : null;
          const pts = [];
          for (let i = i0; i < i1; i++) { const v = arr[i]; if (!isFinite(v)) continue;
            let z = 0; if (band && i >= pwin[0] && i < pwin[1]) { const m = rm(i); z = m > band.hi ? 1 : m < band.lo ? -1 : 0; }
            pts.push([X(i), Y(v), z]); }
          strokeZoned(x, pts, col, 2);
        }
      });
      x.restore();
      // lane name
      if (split) {
        const c = chs[0], name = (S.mapping[c] || "CH" + (c + 1)) + " · CH" + (c + 1);
        x.font = "600 11px " + dispF; x.textAlign = "left"; x.textBaseline = "top";
        const tw = x.measureText(name).width + 10;
        x.fillStyle = surf; x.globalAlpha = .85; x.fillRect(pad.l + 4, ly0 + 4, tw, 16); x.globalAlpha = 1;
        x.fillStyle = cssVar(chColVar(c)); x.fillText(name, pad.l + 9, ly0 + 7);
      }
    });

    // --- pauses in the logger timeline longer than 3 s are marked
    let lastGapLabel = -1e9;
    (s.gaps || []).forEach(g => {
      if (!(g.seconds > 3)) return;
      const i = (g.after + 1) * s.fs; if (i < i0 || i > i1) return;
      const xx = Math.round(X(i)) + .5;
      x.save(); x.setLineDash([2, 3]); x.strokeStyle = ink3; x.lineWidth = 1.5;
      x.beginPath(); x.moveTo(xx, plotTop); x.lineTo(xx, plotBot); x.stroke(); x.restore();
      x.font = "10px " + dispF; x.fillStyle = ink3; x.textAlign = "left"; x.textBaseline = "bottom";
      const lx = Math.min(xx + 3, W - pad.r - 70);
      const stacked = lx - lastGapLabel <= 78;
      x.fillText("no data " + hms(g.seconds - 1), lx, plotBot - (stacked ? 16 : 3)); if (!stacked) lastGapLabel = lx;
    });

    // --- teaching mode: where take-off should have happened at the latest
    const ghost = S.teach && showMarkers() ? ghostTakeoff(S.markers) : null;
    if (ghost && ghost.i <= i1 && S.markers.takeoff >= i0) {
      const xa = Math.max(pad.l, X(ghost.i)), xb = Math.min(W - pad.r, X(S.markers.takeoff));
      x.fillStyle = cssVar("--crit"); x.globalAlpha = .13; x.fillRect(xa, plotTop, Math.max(0, xb - xa), plotBot - plotTop); x.globalAlpha = 1;
      if (ghost.i >= i0) {
        const xx = Math.round(X(ghost.i)) + .5;
        x.save(); x.setLineDash([6, 4]); x.strokeStyle = cssVar("--crit"); x.lineWidth = 1.8;
        x.beginPath(); x.moveTo(xx, plotTop); x.lineTo(xx, plotBot); x.stroke(); x.restore();
        x.font = "600 10px " + dispF; x.fillStyle = cssVar("--crit"); x.textAlign = "right"; x.textBaseline = "top";
        x.fillText("take-off by here (" + fmt(ghost.lim, 0) + " s)", xx - 4, plotTop + 4);
      }
    }

    // --- markers: thin ink lines, labels in their own row above the plot
    if (markerKeys.length) {
      x.font = "600 10px " + dispF; x.textBaseline = "middle"; x.textAlign = "left";
      const rowY = [top - 34 - 2 + 8, top - 17 - 2 + 8].map(v => v);   // two label rows under the ribbon
      const placed = [[], []];
      markerKeys.slice().sort((a, b) => S.markers[a[0]] - S.markers[b[0]]).forEach(([k, label]) => {
        const xx = Math.round(X(S.markers[k])) + .5;
        const tw = x.measureText(label).width + 10;
        let lx = xx - tw / 2; lx = clamp(lx, 2, W - pad.r - tw);
        let row = placed[0].some(([a, b]) => lx < b + 3 && lx + tw > a - 3) ? 1 : 0;
        if (row === 1 && placed[1].some(([a, b]) => lx < b + 3 && lx + tw > a - 3)) row = 0;
        placed[row].push([lx, lx + tw]);
        const ly = rowY[row];
        x.strokeStyle = cssVar("--ink-2"); x.lineWidth = 1.25; x.setLineDash([]);
        x.beginPath(); x.moveTo(xx, ly + 7); x.lineTo(xx, plotBot); x.stroke();
        x.fillStyle = surf; x.strokeStyle = cssVar("--ink-2"); x.lineWidth = 1;
        x.beginPath(); x.rect(lx + .5, ly - 7 + .5, tw, 14); x.fill(); x.stroke();
        x.fillStyle = cssVar("--ink"); x.fillText(label, lx + 5, ly + .5);
      });
    }

    // --- selection while dragging
    if (drag && drag.moved) {
      x.fillStyle = cssVar("--accent"); x.globalAlpha = .16;
      x.fillRect(Math.min(drag.x0, drag.x1), plotTop, Math.abs(drag.x1 - drag.x0), plotBot - plotTop);
      x.globalAlpha = 1;
    }

    // --- crosshair
    if (hover != null) {
      const xx = Math.round(X(hover)) + .5;
      x.strokeStyle = ink3; x.lineWidth = 1; x.save(); x.setLineDash([2, 3]);
      x.beginPath(); x.moveTo(xx, plotTop); x.lineTo(xx, plotBot); x.stroke(); x.restore();
      laneGeo.forEach(L => L.chs.forEach(c => {
        const v = s.ch[c][hover]; if (!isFinite(v)) return;
        x.fillStyle = cssVar(chColVar(c)); x.strokeStyle = surf; x.lineWidth = 2;
        x.beginPath(); x.arc(xx, L.Y(v), 4, 0, 6.2832); x.fill(); x.stroke();
      }));
    }
    geo = { H, plotTop, plotBot };
    box._px = { X, i0, i1, pad, pw, W, H };
  }

  function idxFromEvent(e) {
    const r = cv.getBoundingClientRect(), s = sig(); if (!s) return null;
    const px = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
    const [i0, i1] = dom();
    const pw = (box.clientWidth || 700) - pad.l - pad.r;
    return clamp(Math.round(i0 + (px - pad.l) / pw * (i1 - i0)), 0, s.n - 1);
  }
  function showTip(e) {
    const s = sig(); if (!s || hover == null) { tip.style.display = "none"; return; }
    const rows = visibleCh().map(c =>
      '<div class="tt-r"><span><span class="swatch" style="display:inline-block;background:' + cssVar(chColVar(c)) +
      '"></span> ' + (S.mapping[c] || "CH" + (c + 1)) + '</span><b>' + fmt(s.ch[c][hover], 2) + " kPa</b></div>").join("");
    const ph = milkingPhases(S.markers).find(p => hover >= p[1] && hover < p[2]);
    tip.innerHTML = '<div class="tt-t">' + clockAt(hover) + "  ·  " + hms(tAt(hover)) + " elapsed" + (ph ? "  ·  " + ph[0] : "") + "</div>" + rows + (S.teach ? traceExplain(hover) : "");
    tip.style.display = "block";
    const r = cv.getBoundingClientRect();
    const px = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
    const py = (e.touches ? e.touches[0].clientY : e.clientY) - r.top;
    tip.style.left = clamp(px + 14, 4, box.clientWidth - tip.offsetWidth - 4) + "px";
    tip.style.top = clamp(py - 10, 4, ((geo && geo.H) || 300) - tip.offsetHeight - 4) + "px";
  }

  cv.addEventListener("pointermove", e => {
    hover = idxFromEvent(e);
    if (drag) { drag.x1 = e.clientX - cv.getBoundingClientRect().left; drag.moved = Math.abs(drag.x1 - drag.x0) > 4; }
    draw(); showTip(e);
  });
  cv.addEventListener("pointerleave", () => { hover = null; tip.style.display = "none"; draw(); });
  cv.addEventListener("pointerdown", e => {
    if (placing) {
      S.markers[placing] = idxFromEvent(e);
      logAudit("Marker set", placing + " placed manually at " + clockAt(S.markers[placing]));
      const p = placing; placing = null; box.style.cursor = "";
      if (opts.onMarker) opts.onMarker(p);
      draw(); return;
    }
    cv.setPointerCapture(e.pointerId);
    const r = cv.getBoundingClientRect();
    drag = { x0: e.clientX - r.left, x1: e.clientX - r.left, moved: false };
  });
  cv.addEventListener("pointerup", () => {
    if (!drag) return;
    if (drag.moved) {
      const s = sig(), [i0, i1] = dom(), pw = (box.clientWidth || 700) - pad.l - pad.r;
      const a = clamp(Math.round(i0 + (Math.min(drag.x0, drag.x1) - pad.l) / pw * (i1 - i0)), 0, s.n - 1);
      const b = clamp(Math.round(i0 + (Math.max(drag.x0, drag.x1) - pad.l) / pw * (i1 - i0)), 0, s.n);
      if (b - a > 20) { view = [a, b]; if (opts.onZoom) opts.onZoom(view); }
    }
    drag = null; draw();
  });
  cv.addEventListener("dblclick", () => { view = null; draw(); if (opts.onZoom) opts.onZoom(null); });
  cv.addEventListener("wheel", e => {
    const s = sig(); if (!s) return; e.preventDefault();
    const [i0, i1] = dom(), at = idxFromEvent(e), k = e.deltaY > 0 ? 1.25 : 0.8;
    const w = Math.max(40, Math.min(s.n, (i1 - i0) * k));
    const frac = (at - i0) / (i1 - i0);
    view = [clamp(Math.round(at - w * frac), 0, s.n - 40), 0];
    view[1] = clamp(Math.round(view[0] + w), view[0] + 40, s.n);
    draw();
  }, { passive: false });

  /* legend: switch channels on and off, show one channel alone, overlay or separate lanes */
  function renderLegend() {
    legendEl.innerHTML = "";
    const s = sig(); if (!s) return;
    const live = s.ch.map((_, c) => c).filter(c => S.mapping[c] !== "OFF");
    const redraw = () => { renderLegend(); draw(); };
    live.forEach(c => {
      const wrap = el("span", { class: "chan" });
      const b = el("button", { type: "button", "aria-pressed": String(!!S.visible[c]), title: "Show or hide this channel",
        onclick: () => { S.visible[c] = !S.visible[c]; redraw(); } });
      b.append(el("span", { class: "swatch", style: "height:4px;background:" + cssVar(chColVar(c)) }),
               document.createTextNode((S.mapping[c] || "CH" + (c + 1)) + " · CH" + (c + 1)));
      wrap.append(b, el("button", { type: "button", class: "only", title: "Show this channel alone",
        onclick: () => { live.forEach(k => { S.visible[k] = k === c; }); redraw(); }, text: "only" }));
      legendEl.append(wrap);
    });
    if (live.some(c => !S.visible[c])) legendEl.append(el("button", { type: "button", class: "only", text: "show all",
      onclick: () => { live.forEach(k => { S.visible[k] = true; }); redraw(); } }));
    const seg = el("span", { class: "seg", role: "group", "aria-label": "Chart layout" });
    [["overlay", "One plot"], ["split", "Separate lanes"]].forEach(([v, t]) => seg.append(el("button", { type: "button",
      "aria-pressed": String(S.chartLayout === v), text: t, onclick: () => { S.chartLayout = v; redraw(); } })));
    legendEl.append(seg);
    legendEl.append(helpBtn("trace"));
    if (S.teach) legendEl.append(el("span", { class: "small zkey" }, [
      el("span", { class: "zk zk-up" }), document.createTextNode("above its band"),
      el("span", { class: "zk zk-dn" }), document.createTextNode("below its band (peak flow only)")]));
    legendEl.append(el("span", { class: "muted small", style: "margin-left:auto",
      text: "Pale band = full range · line = 1-second mean · drag to zoom, double-click to reset" }));
  }

  const api = {
    draw, renderLegend, box,
    reset() { view = null; draw(); },
    setView(v) { view = v ? v.slice() : null; draw(); },
    getView() { return view ? view.slice() : (sig() ? [0, sig().n] : null); },
    place(key) { placing = key; box.style.cursor = "crosshair"; }
  };
  renderLegend();
  requestAnimationFrame(draw);
  window.addEventListener("resize", () => draw());
  return api;
}

/* -------------------------- pulsation cycle detail with a/b/c/d shading ---
   Drawn on white "paper" whatever the screen theme, so the phase colours and the
   reference lines stay readable. The standard cycle is the preset's a/b/c/d targets
   laid out as an ideal wave at this pulsator's own vacuum levels, started at the
   same moment as each measured cycle — so the two can be compared phase by phase. */
const PZ = { bg: "#ffffff", ink: "#0e1c2a", ink2: "#3d5163", ink3: "#6b7f91", grid: "#e2eaf1", frame: "#ccd8e2",
  spt: "#1d8c39", smt: "#1a5fd4", std: "#0e1c2a",
  ph: { a: "#d6e6f8", b: "#d5eedd", c: "#d6e6f8", d: "#f7e2b8" }, phS: { a: "#4f86c6", b: "#2f9a55", c: "#4f86c6", d: "#c2861c" },
  font: '"Source Sans 3", system-ui, sans-serif', mono: '"IBM Plex Mono", monospace' };

function pulsStandard() {
  const t = { a: T("a_target"), b: T("b_target"), c: T("c_target"), d: T("d_target") };
  if (["a", "b", "c", "d"].some(k => t[k] == null || !(t[k] > 0))) return null;
  const user = ["a", "b", "c", "d"].some(k => /User-defined/.test(threshSrc(k + "_target")));
  const name = user ? "user-defined threshold — not universal" : S.preset === "guide" ? "VaDia 2 guide" : "VaDia Suite default";
  return Object.assign(t, { name, label: "Standard cycle — " + name });
}

/* the ideal wave for one cycle starting at sample i0 (where the measured wave crosses the lower reference) */
function stdWave(i0, det, std, fs) {
  const k = fs / 1000, A = std.a * k, B = std.b * k, C = std.c * k, D = std.d * k, L = A + B + C + D;
  const lo = det.lo, hi = det.hi, vmin = det.vmin, vmax = det.vmax;
  const up = (hi - lo) / A, dn = (hi - lo) / C;
  const topIn = Math.min((vmax - hi) / up, B / 2), topOut = Math.min((vmax - hi) / dn, B / 2);
  const botIn = Math.min((lo - vmin) / dn, D / 2), botOut = Math.min((lo - vmin) / up, D / 2);
  return { L, pts: [[i0, lo], [i0 + A, hi], [i0 + A + topIn, hi + topIn * up], [i0 + A + B - topOut, hi + topOut * dn], [i0 + A + B, hi],
    [i0 + A + B + C, lo], [i0 + A + B + C + botIn, lo - botIn * dn], [i0 + L - botOut, lo - botOut * up], [i0 + L, lo]],
    bounds: [["a", i0, i0 + A], ["b", i0 + A, i0 + A + B], ["c", i0 + A + B, i0 + A + B + C], ["d", i0 + A + B + C, i0 + L]] };
}

/* paint measured cycles (and optionally the standard) onto a 2-D context */
function paintPulsation(x, W, H, det, show, fs, o) {
  o = o || {};
  const spt = det.arr || chArray("SPT"), smt = o.smt ? chArray("SMT") : null, std = o.standard ? pulsStandard() : null;
  x.fillStyle = PZ.bg; x.fillRect(0, 0, W, H);
  const stripH = 18, strips = std ? 2 : 1;
  const pad = { l: 92, r: 12, t: 8 + strips * (stripH + 3) + 6, b: 30 };
  const pw = W - pad.l - pad.r, ph = H - pad.t - pad.b;
  const i0 = show[0].i0;
  const waves = std ? show.map(cy => stdWave(cy.i0, det, std, fs)) : [];
  const i1 = Math.max(show[show.length - 1].i1, ...waves.map(w => w.pts[w.pts.length - 1][0]));
  const y1 = Math.ceil((det.vmax + 4) / 10) * 10;
  const X = i => pad.l + (i - i0) / (i1 - i0) * pw, Y = v => pad.t + (1 - v / y1) * ph;
  const ms = n => Math.round(n / fs * 1000);
  const segOf = cy => [["a", cy.i0, cy.i0 + cy.a], ["b", cy.i0 + cy.a, cy.i0 + cy.a + cy.b],
    ["c", cy.i0 + cy.a + cy.b, cy.i0 + cy.a + cy.b + cy.c], ["d", cy.i0 + cy.a + cy.b + cy.c, cy.i1]];
  // phase strips: measured, then standard
  const strip = (row, label, segs) => {
    const y = 8 + row * (stripH + 3);
    x.fillStyle = PZ.ink2; x.font = "600 11px " + PZ.font; x.textAlign = "right"; x.textBaseline = "middle";
    x.fillText(label, pad.l - 8, y + stripH / 2);
    segs.forEach(([k, a, b]) => {
      const xa = X(a), xb = X(b); if (xb - xa < 1) return;
      x.fillStyle = PZ.ph[k]; x.fillRect(xa, y, xb - xa, stripH);
      x.fillStyle = PZ.phS[k]; x.fillRect(xa, y + stripH - 3, xb - xa, 3);
      x.fillStyle = PZ.ink; x.font = "700 11px " + PZ.font; x.textAlign = "center";
      const t = k + " " + ms(b - a);
      x.fillText(xb - xa > x.measureText(t).width + 6 ? t : k, (xa + xb) / 2, y + (stripH - 3) / 2 + 1);
      x.strokeStyle = "#ffffff"; x.lineWidth = 1; x.beginPath(); x.moveTo(Math.round(xa) + .5, y); x.lineTo(Math.round(xa) + .5, y + stripH); x.stroke();
    });
  };
  strip(0, "Measured", [].concat(...show.map(segOf)));
  if (std) strip(1, "Standard", [].concat(...waves.map(w => w.bounds)));
  // measured phase tint behind the plot
  show.forEach(cy => segOf(cy).forEach(([k, a, b]) => { x.globalAlpha = .55; x.fillStyle = PZ.ph[k]; x.fillRect(X(a), pad.t, Math.max(1, X(b) - X(a)), ph); x.globalAlpha = 1; }));
  // grid
  x.strokeStyle = PZ.grid; x.lineWidth = 1; x.fillStyle = PZ.ink3; x.font = "10.5px " + PZ.mono; x.textAlign = "right"; x.textBaseline = "middle";
  for (let v = 0; v <= y1; v += 10) { const yy = Math.round(Y(v)) + .5; x.beginPath(); x.moveTo(pad.l, yy); x.lineTo(W - pad.r, yy); x.stroke(); x.fillText(String(v), pad.l - 6, yy); }
  x.textAlign = "left"; x.textBaseline = "top"; x.fillText("kPa", 4, pad.t + ph + 6);
  // reference levels
  [[det.lo, "lower ref " + fmt(det.lo) + " kPa"], [det.hi, "upper ref " + fmt(det.hi) + " kPa"]].forEach(([v, lab]) => {
    const yy = Math.round(Y(v)) + .5; x.save(); x.setLineDash([4, 3]); x.strokeStyle = PZ.ink3; x.beginPath(); x.moveTo(pad.l, yy); x.lineTo(W - pad.r, yy); x.stroke(); x.restore();
    x.fillStyle = PZ.ink3; x.font = "10px " + PZ.font; x.textAlign = "right"; x.textBaseline = "bottom"; x.fillText(lab, W - pad.r - 4, yy - 2);
  });
  // standard wave
  if (std) waves.forEach(w => {
    x.save(); x.setLineDash([7, 4]); x.strokeStyle = PZ.std; x.lineWidth = 1.8; x.globalAlpha = .85; x.beginPath();
    w.pts.forEach(([i, v], j) => { const xx = X(i), yy = Y(v); j ? x.lineTo(xx, yy) : x.moveTo(xx, yy); }); x.stroke(); x.restore();
  });
  // teaching mode: teat-end vacuum swing band — the average of these cycles ± half the peak-to-peak tolerance
  const iEnd = Math.min(i1, show[show.length - 1].i1);
  const teach = o.teach != null ? o.teach : S.teach;
  let swing = null;
  if (teach && smt && T("cvf_warn") != null) {
    const avg = _mean(smt, i0, iEnd), h = T("cvf_warn") / 2;
    swing = { lo: avg - h, hi: avg + h, avg, h };
    x.fillStyle = PZ.smt; x.globalAlpha = .10; x.fillRect(pad.l, Y(swing.hi), pw, Y(swing.lo) - Y(swing.hi)); x.globalAlpha = .7;
    x.strokeStyle = PZ.smt; x.lineWidth = 1; x.setLineDash([4, 3]);
    [swing.hi, swing.lo].forEach(v => { x.beginPath(); x.moveTo(pad.l, Math.round(Y(v)) + .5); x.lineTo(W - pad.r, Math.round(Y(v)) + .5); x.stroke(); });
    x.setLineDash([]); x.globalAlpha = 1;
    x.fillStyle = PZ.smt; x.font = "600 10px " + PZ.font; x.textAlign = "left"; x.textBaseline = "bottom";
    x.fillText("SMT average " + fmt(avg) + " ± " + fmt(h, 1) + " kPa", pad.l + 4, Y(swing.hi) - 2);
  }
  // standard wave value at a sample, for the green line's comparison
  const stdAt = i => { for (const w of waves) { const P = w.pts; if (i < P[0][0] || i > P[P.length - 1][0]) continue;
    for (let j = 1; j < P.length; j++) if (i <= P[j][0]) { const [xa, ya] = P[j - 1], [xb, yb] = P[j]; return xb > xa ? ya + (yb - ya) * (i - xa) / (xb - xa) : yb; } } return null; };
  // measured traces — in teaching mode, darker above the reference and lighter, dashed below
  [[smt, PZ.smt, 1.8, "smt"], [spt, PZ.spt, 2.4, "spt"]].forEach(([a, col, lw, kind]) => {
    if (!a) return; x.lineJoin = "round";
    const pts = [];
    for (let i = i0; i <= iEnd; i++) {
      let z = 0;
      if (teach && kind === "smt" && swing) z = a[i] > swing.hi ? 1 : a[i] < swing.lo ? -1 : 0;
      if (teach && kind === "spt" && std) { const sv = stdAt(i); if (sv != null) z = a[i] > sv + 4 ? 1 : a[i] < sv - 4 ? -1 : 0; }
      pts.push([X(i), Y(a[i]), z]);
    }
    strokeZoned(x, pts, col, lw);
  });
  x.strokeStyle = PZ.frame; x.lineWidth = 1; x.strokeRect(pad.l + .5, pad.t + .5, pw - 1, ph - 1);
  x.fillStyle = PZ.ink3; x.font = "10.5px " + PZ.font; x.textAlign = "center"; x.textBaseline = "top";
  x.fillText((o.caption || show.length + " consecutive cycles") + " · " + fmt(show[0].len / fs * 1000, 0) + " ms per cycle", pad.l + pw / 2, pad.t + ph + 8);
  return { std, swing, pad, pw, ph, i0, i1, waves, show, segOf, stdAt };
}

/* measured minus standard, phase by phase */
function pulsDiff(P) {
  const std = pulsStandard(); if (!std) return null;
  const row = el("div", { class: "pdiff" });
  ["a", "b", "c", "d"].forEach(k => {
    const d = P[k] - std[k], tol = T(k + "_tol");
    const st = tol == null ? "na" : Math.abs(d) <= tol ? "ok" : Math.abs(d) <= 2 * tol ? "warn" : "crit";
    row.append(el("div", { class: "pdiff-c ph-" + k }, [
      el("div", { class: "pdiff-k", text: k + "-phase" }),
      el("div", { class: "pdiff-v", text: (d >= 0 ? "+" : "−") + fmt(Math.abs(d), 0) + " ms" }),
      el("div", { class: "pdiff-u", text: fmt(P[k], 0) + " measured · " + fmt(std[k], 0) + " standard" + (tol != null ? " ± " + fmt(tol, 0) : "") }),
      el("span", { class: "pill " + st, text: st === "ok" ? "within tolerance" : st === "na" ? "no tolerance set" : (d > 0 ? "longer" : "shorter") + " than standard" })
    ]));
  });
  return row;
}

function drawPulsDetail(host, det, sum, fs) {
  host.innerHTML = "";
  const box = el("div", { class: "chartbox", style: "background:#fff" });
  const cv = el("canvas");
  if (!det || !det.ok) { box.append(el("div", { class: "note warn", style: "margin:12px", text: det && det.reason ? det.reason : "No pulsation waveform" })); host.append(box); return; }
  const std = pulsStandard();
  const bar = el("div", { class: "row noprint", style: "gap:8px;margin-bottom:8px;flex-wrap:wrap;align-items:center" });
  const tog = (key, label, def) => {
    if (S[key] == null) S[key] = def;
    const b = el("button", { type: "button", class: "btn sm" + (S[key] ? " primary" : ""), "aria-pressed": String(!!S[key]), text: label,
      onclick: () => { S[key] = !S[key]; b.classList.toggle("primary", S[key]); b.setAttribute("aria-pressed", String(S[key])); draw(); diff.hidden = !S.pulsStd; } });
    return b;
  };
  if (std) bar.append(tog("pulsStd", "Standard cycle", true));
  bar.append(tog("pulsSmt", "Teat-end vacuum (SMT)", !!S.teach));
  bar.append(helpBtn("pulsation"));
  bar.append(el("span", { class: "small muted", text: std ? "Dashed line and lower strip: the standard cycle (" + std.name + ": a " + std.a + " · b " + std.b + " · c " + std.c + " · d " + std.d + " ms), drawn at this pulsator's own vacuum levels and started with each measured cycle."
    : "No standard is set — enter the a/b/c/d targets under Thresholds to compare against one." }));
  const tip = el("div", { class: "tooltip", style: "display:none" });
  box.append(cv, tip);
  const diff = pulsDiff(sum) || el("div");
  diff.hidden = !S.pulsStd;
  host.append(bar, box, diff);
  const mid = det.cycles[Math.floor(det.cycles.length / 2)];
  const show = det.cycles.filter(c => c.i0 >= mid.i0 - mid.len && c.i0 <= mid.i0 + mid.len * 2).slice(0, 3);
  let G = null, hov = null;
  function draw() {
    const W = box.clientWidth || 700, H = 300, dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.width = W * dpr; cv.height = H * dpr; cv.style.height = H + "px";
    const x = cv.getContext("2d"); x.setTransform(dpr, 0, 0, dpr, 0, 0);
    G = paintPulsation(x, W, H, det, show, fs, { standard: !!S.pulsStd, smt: !!S.pulsSmt, caption: show.length + " consecutive cycles" });
    if (hov != null) {
      const xx = Math.round(G.pad.l + (hov - G.i0) / (G.i1 - G.i0) * G.pw) + .5;
      x.save(); x.setLineDash([2, 3]); x.strokeStyle = PZ.ink3; x.beginPath(); x.moveTo(xx, G.pad.t); x.lineTo(xx, G.pad.t + G.ph); x.stroke(); x.restore();
    }
  }
  // hover: what phase this is, measured against standard, and what the liner is doing
  cv.addEventListener("pointermove", e => {
    if (!G) return;
    const r = cv.getBoundingClientRect(), px = e.clientX - r.left;
    const i = Math.round(G.i0 + (px - G.pad.l) / G.pw * (G.i1 - G.i0));
    if (px < G.pad.l || i > G.i1) { hov = null; tip.style.display = "none"; draw(); return; }
    hov = i; draw();
    const spt = det.arr || chArray("SPT"), smt = chArray("SMT");
    const seg = [].concat(...G.show.map(G.segOf)).find(([k, a, b]) => i >= a && i < b);
    const sseg = G.std ? [].concat(...G.waves.map(w => w.bounds)).find(([k, a, b]) => i >= a && i < b) : null;
    const sv = G.std ? G.stdAt(i) : null;
    const rows = [];
    if (i <= G.show[G.show.length - 1].i1) rows.push('<div class="tt-r"><span><span class="swatch" style="display:inline-block;background:' + PZ.spt + '"></span> SPT</span><b>' + fmt(spt[i], 1) + " kPa</b></div>");
    if (sv != null) rows.push('<div class="tt-r"><span>standard</span><b>' + fmt(sv, 1) + " kPa</b></div>");
    if (S.pulsSmt && smt) rows.push('<div class="tt-r"><span><span class="swatch" style="display:inline-block;background:' + PZ.smt + '"></span> SMT</span><b>' + fmt(smt[i], 1) + " kPa</b></div>");
    let help = "";
    if (S.teach) {
      const L = [];
      if (seg) L.push("<b>Measured: " + esc(PULS_TEXT[seg[0]]) + "</b>");
      if (sseg && seg && sseg[0] !== seg[0]) L.push("The standard cycle would already be in phase <b>" + sseg[0] + "</b> here.");
      if (G.swing && S.pulsSmt && smt) { const v = smt[i]; L.push("Teat-end vacuum " + (v > G.swing.hi ? "above" : v < G.swing.lo ? "below" : "inside") + " its swing band (" + fmt(G.swing.lo, 1) + "–" + fmt(G.swing.hi, 1) + " kPa)."); }
      help = '<div class="tt-help">' + L.join("<br>") + "</div>";
    }
    tip.innerHTML = '<div class="tt-t">' + fmt((i - G.show[0].i0) / fs * 1000, 0) + " ms" + (seg ? " · phase " + seg[0] : "") + (sseg ? " · standard " + sseg[0] : "") + "</div>" + rows.join("") + help;
    tip.style.display = "block";
    tip.style.left = clamp(px + 14, 4, box.clientWidth - tip.offsetWidth - 4) + "px";
    tip.style.top = clamp(e.clientY - r.top - 10, 4, 300 - tip.offsetHeight - 4) + "px";
  });
  cv.addEventListener("pointerleave", () => { hov = null; tip.style.display = "none"; draw(); });
  draw(); window.addEventListener("resize", draw);
}

function stepDone(id) {
  switch (id) {
    case "conclusion": return !!S.auto && !S.auto.error;
    case "guide": return false;
    case "import": return !!(S.signal || S.tables);
    case "farm": return !!(S.meta.farmName && S.meta.testDate);
    case "channels": return !!S.signal && Object.values(S.mapping).some(r => r === "SMT" || r === "SPT");
    case "markers": return S.markers.attach != null && S.markers.takeoff != null;
    case "thresholds": return true;
    case "analysis": return !!S.results;
    case "report": return !!S.results;
  }
  return false;
}

function viewChannels(host) {
  pageHead(host, "Channel mapping",
    "Nothing is interpreted until each channel is told what it was connected to. The suggestions below come from the shape of each signal, not from the file — check them against your own notes from the parlor.");
  if (!S.signal) {
    host.append(el("div", { class: "note warn", text: "This step needs a waveform recording. Summary CSV exports carry no channel traces." }));
    nextBar(host, "analysis", "Go to analysis");
    return;
  }
  const s = S.signal;
  host.append(el("div", { class: "note" + (S.mappingSource === "user" ? "" : " warn"), text:
    S.mappingSource === "user" ? "Placement confirmed by you. The automatic audit keeps it, and only reports where the waveform shapes disagree."
    : S.mappingSource === "auto" ? "Placement inferred from the waveforms by the automatic audit — not confirmed yet. Check each channel against where the taps were connected; changing any channel, or pressing a button below, marks the placement as confirmed."
    : "Default VaDia MTT layout, not confirmed. The automatic audit will replace it with a waveform-based guess unless you confirm or change it here." }));
  const suggestions = s.ch.map((arr, c) => {
    const st = stats(arr, 0, s.n), amp = pct(arr, 0.98, 0, s.n) - pct(arr, 0.02, 0, s.n);
    const det = detectPulsationCycles(arr, 0, Math.min(s.n, s.fs * 60), s.fs);
    return { c, st, amp, pulsating: det.ok, rate: det.ok ? pulsationSummary(det, s.fs).rate : null };
  });

  const p = el("div", { class: "panel" });
  p.append(el("header", null, [el("h3", { text: "Assign each channel" }),
    el("span", { class: "hint", text: "CH1–CH4 are the four VaDia inputs, in device order" })]));
  const g = el("div", { class: "grid g2" });

    const card = el("div", { class: "tile", style: "border-left:3px solid " + cssVar(chColVar(c)) });
    const sel = el("select", { id: "map_" + c });
    ROLES.forEach(([v, lab]) => sel.append(el("option", { value: v, text: v + " — " + lab })));
    sel.value = S.mapping[c] || "OFF";
    sel.addEventListener("change", () => { S.mapping[c] = sel.value; S.mappingSource = "user"; S.auto = null;
      logAudit("Channel mapping", "CH" + (c + 1) + " set to " + sel.value + " by the user — this placement now takes priority over automatic suggestions"); runAnalysis(); render(); saveIfConsented(); });
    const su = suggestions[c];
    card.append(
      el("div", { class: "k", text: "CH" + (c + 1) }),
      el("div", { class: "row", style: "gap:6px;margin:2px 0 6px" }, [
        el("span", { class: "pill flat na", text: fmt(su.st.min) + " – " + fmt(su.st.max) + " kPa" }),
        su.pulsating ? el("span", { class: "pill ok", text: "pulsating, " + fmt(su.rate, 0) + " cyc/min" })
                     : el("span", { class: "pill flat na", text: "steady trace" })
      ]),
      sel,
      el("div", { class: "u", style: "margin-top:6px",
        text: su.pulsating ? "Signal swings the full working range once per second — consistent with a pulsation tube."
             : su.st.max < 3 ? "Almost no vacuum on this input — it was probably not connected."
             : "Slow-varying vacuum — consistent with a milk tube or mouthpiece tap." })
    );
    g.append(card);
  });
  p.append(g);
  p.append(el("div", { class: "row", style: "margin-top:12px" }, [
    S.mappingSource !== "user" ? el("button", { class: "btn primary", type: "button", text: "Confirm this placement", onclick: () => {
      S.mappingSource = "user"; S.auto = null;
      logAudit("Channel mapping", "User confirmed the placement: " + Object.keys(S.mapping).map(k => "CH" + (+k + 1) + "=" + S.mapping[k]).join(", "));
      render(); saveIfConsented();
    } }) : null,
    el("button", { class: "btn", type: "button", text: "Apply VaDia standard MTT layout", onclick: () => {
      S.mapping = { 0: "SPT", 1: "SMT", 2: "MPC", 3: "MPC2" }; S.mappingSource = "user"; S.auto = null;
      logAudit("Channel mapping", "Standard MTT layout applied by the user: CH1 SPT, CH2 SMT, CH3 MPC, CH4 MPC2");
      runAnalysis(); render(); saveIfConsented();
    } }),
    el("button", { class: "btn", type: "button", text: "Use the suggestions", onclick: () => {
      const puls = suggestions.filter(x => x.pulsating).map(x => x.c);
      const rest = suggestions.filter(x => !x.pulsating && x.st.max > 3).sort((a, b) => b.st.mean - a.st.mean).map(x => x.c);
      const m = {}; s.ch.forEach((_, c) => m[c] = "OFF");
      if (puls.length) m[puls[0]] = "SPT";
      if (rest[0] != null) m[rest[0]] = "SMT";
      if (rest[1] != null) m[rest[1]] = "MPC";
      if (rest[2] != null) m[rest[2]] = "MPC2";
      S.mapping = m; S.mappingSource = "user"; S.auto = null;
      logAudit("Channel mapping", "Signal-shape suggestions accepted by the user: " + Object.keys(m).map(k => "CH" + (+k + 1) + "=" + m[k]).join(", "));
      runAnalysis(); render(); saveIfConsented();
    } })
  ]));
  host.append(p);

  const cp = el("div", { class: "panel" });
  cp.append(el("header", null, [el("h3", { text: "Full recording" }),
    el("span", { class: "hint", text: "Dashed vertical lines mark gaps where the device stopped logging" })]));
  const ch = el("div"); cp.append(ch);
  host.append(cp);
  makeTrace(ch, { height: 300 });

  const sp = el("div", { class: "panel" });

  t.append(el("thead", null, el("tr", null, ["Channel", "Role", "Min", "Mean", "Max", "SD", "5th pct", "95th pct"]
    .map((h, i) => el("th", { class: i > 1 ? "n" : "", text: h })))));

    ...[r.min, r.mean, r.max, r.sd, r.p5, r.p95].map(v => el("td", { class: "n", text: fmt(v, 2) }))
  ])));
  t.append(tb);
  sp.append(el("div", { class: "tablewrap" }, t),
    el("p", { class: "src", style: "margin-top:8px", text: "All figures in kPa, computed over " + s.n.toLocaleString() + " samples per channel." }));
  host.append(sp);

  nextBar(host, "markers", "Continue to markers");

function viewMarkers(host) {

  }

  if (S.sessions.length) {
    const sp = el("div", { class: "panel" });

    const tb = el("tbody");
    S.sessions.forEach((g, k) => {

        el("td", null, el("input", { type: "radio", name: "sess", id: "sess_" + k, style: "width:auto",

          onchange: () => {
