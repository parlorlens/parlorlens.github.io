  p.append(el("header", null, [el("h3", { text: "Place markers on the trace" }),
    el("span", { class: "hint", text: "Click a marker button, then click the chart" })]));
  const chartHost = el("div");
  p.append(chartHost);
  const chart = makeTrace(chartHost, { height: 330, onMarker: () => { runAnalysis(); renderMarkerTable(); renderRail(); saveIfConsented(); } });
  if (S.markers.attach != null && S.markers.takeoff != null) {
    const padS = Math.round(s.fs * 8);
    chart.setView([clamp(S.markers.attach - padS, 0, s.n - 2), clamp(S.markers.takeoff + padS, 10, s.n)]);
  }
  p.append(el("div", { class: "row", style: "margin-top:8px" }, [
    el("button", { class: "btn sm ghost", type: "button", text: "Zoom to the selected milking", onclick: () => {
      if (S.markers.attach == null) return;
      const padS = Math.round(s.fs * 8);
      chart.setView([clamp(S.markers.attach - padS, 0, s.n - 2), clamp(S.markers.takeoff + padS, 10, s.n)]);
    } }),
    el("button", { class: "btn sm ghost", type: "button", text: "Show whole recording", onclick: () => chart.setView(null) })
  ]));

  const btns = el("div", { class: "row", style: "margin-top:12px" });
  MARKER_DEFS.forEach(([k, label]) => {
    btns.append(el("button", { class: "btn sm", type: "button", text: "Set " + label, onclick: () => chart.place(k) }));
  });
  btns.append(el("button", { class: "btn sm ghost", type: "button", text: "Re-place all markers automatically", onclick: () => {
    if (S.handMarkers && S.markerKey != null && S.handMarkers[S.markerKey]) { delete S.handMarkers[S.markerKey]; S.auto = null; logAudit("Markers reset", "Milking at " + clockAt(S.markerKey) + ": hand corrections removed, rules used again"); }
    const m = suggestMarkers();
    S.markers = Object.assign({}, S.markers, m);
    runAnalysis(); render();
  } }));
  btns.append(el("button", { class: "btn sm ghost", type: "button", text: "Clear all markers", onclick: () => {
    S.markers = {}; logAudit("Markers cleared", "All phase markers removed"); runAnalysis(); render();
  } }));
  p.append(btns);

  const tblHost = el("div", { style: "margin-top:14px" });
  p.append(tblHost);
  host.append(p);

  function renderMarkerTable() {
    tblHost.innerHTML = "";
    const t = el("table");
    t.append(el("thead", null, el("tr", null, ["Marker", "Clock", "Elapsed", "Basis", ""].map(h => el("th", { text: h })))));
    const tb = el("tbody");
    MARKER_DEFS.forEach(([k, label]) => {
      const i = S.markers[k];
      const auto = S.markerAuto && S.markerAuto[k] === i;
      tb.append(el("tr", null, [
        el("td", { text: label }),
        el("td", { class: "n", text: i == null ? "—" : clockAt(i) }),
        el("td", { class: "n", text: i == null ? "—" : hms(tAt(i)) }),
        el("td", null, i == null ? el("span", { class: "pill na", text: "not set" })
          : el("span", { class: "pill " + (auto ? "ok" : "warn"), text: auto ? "automatic — VaDia rule" : "placed by hand" })),
        el("td", null, i == null ? null : el("button", { class: "btn sm ghost", type: "button", text: "clear",
          onclick: () => { delete S.markers[k]; runAnalysis(); render(); } }))
      ]));
    });
    t.append(tb);
    tblHost.append(el("div", { class: "tablewrap" }, t));
    const m = S.markers;
    const facts = [];
    if (m.attach != null && m.end != null) facts.push("Machine-on time " + hms(tAt(m.end) - tAt(m.attach)) + " (attachment to end of milking)");
    if (m.overmilkStart != null && m.takeoff != null) facts.push("Overmilking " + hms(tAt(m.takeoff) - tAt(m.overmilkStart)));
    if (m.prepStart != null && m.attach != null) facts.push("Preparation to attachment " + hms(tAt(m.attach) - tAt(m.prepStart)));
    if (facts.length) tblHost.append(el("p", { class: "small muted", style: "margin-top:8px", text: facts.join("  ·  ") }));
  }
  renderMarkerTable();

  host.append(el("div", { class: "note", html:
    "<strong>Check the markers before relying on the figures.</strong> Every marker is placed by the VaDia Suite manual's rules, but the start of overmilking is the least certain: the manual's test usually finds several candidate changes and the one VaDia uses could not be reproduced on every milking, and take-off cannot be found on systems where teat-end vacuum shows no shut-off. A marker you move here is used everywhere — this page, the audit table and the farm report — and is recorded in the audit trail. Use “Re-place all markers automatically” to go back to the rules." }));
  nextBar(host, "thresholds", "Continue to thresholds");
}

/* ----------------------------------------------------------- 5. thresholds */
function viewThresholds(host) {
  pageHead(host, "Thresholds and their sources",
    "Every number the report judges against is listed here, with where it came from. Change any of them — a changed value is relabelled as user-defined throughout the report.");

  const p = el("div", { class: "panel" });
  p.append(el("header", null, [el("h3", { text: "Preset" }), el("span", { class: "hint", text: "The two documented sources available here disagree on pulsation phase targets" })]));
  const seg = el("div", { class: "seg" });
  [["suite", "VaDia Suite defaults"], ["guide", "VaDia 2 guide, Appendix A/B"]].forEach(([k, lab]) => {
    seg.append(el("button", { type: "button", "aria-pressed": String(S.preset === k), text: lab,
      onclick: () => { applyPreset(k); S.auto = null; runAnalysis(); render(); saveIfConsented(); } }));
  });
  p.append(seg);
  p.append(el("div", { class: "note", style: "margin-top:12px", html:
    "<strong>The two presets are not interchangeable.</strong> VaDia Suite as installed on this machine targets a 100 ms a-phase and a 100 ms c-phase; the VaDia 2 wet-testing guide gives 150–200 ms for both. Pick the one your installation was commissioned against — or set your own values and the report will say they are yours." }));
  host.append(p);

  const groups = [["mtt", "Milking-time test"], ["puls", "Pulsation"], ["other", "Fall-off, slug and resistance"]];
  groups.forEach(([g, label]) => {
    const gp = el("div", { class: "panel" });
    gp.append(el("header", null, el("h3", { text: label })));
    const t = el("table");
    t.append(el("thead", null, el("tr", null, ["Threshold", "Value", "Unit", "Source"].map((h, i) =>
      el("th", { class: i === 1 ? "n" : "", text: h })))));
    const tb = el("tbody");
    THRESH_DEFS.filter(d => d.g === g).forEach(d => {
      const preset = S.preset === "guide" ? d.guide : d.suite;
      const cur = S.thresh[d.id];
      const isUser = cur !== null && cur !== undefined && cur !== "" && Number(cur) !== Number(preset);
      const inp = el("input", { type: "number", step: "any", id: "th_" + d.id, style: "max-width:120px",
        placeholder: preset == null ? "not set" : "" });
      inp.value = (cur === null || cur === undefined) ? "" : cur;
      inp.addEventListener("input", () => {
        S.thresh[d.id] = inp.value === "" ? null : Number(inp.value);
        logAudit("Threshold changed", d.label + " set to " + (inp.value === "" ? "unset" : inp.value + " " + d.u));
        S.auto = null; runAnalysis(); saveIfConsented();
        srcCell.innerHTML = ""; srcCell.append(srcNode(d));
      });
      const srcCell = el("td", { style: "white-space:normal;max-width:420px" });
      function srcNode(dd) {
        const c = S.thresh[dd.id];
        const pv = S.preset === "guide" ? dd.guide : dd.suite;
        const user = c !== null && c !== undefined && c !== "" && Number(c) !== Number(pv);
        const box = el("div");
        if (user) box.append(el("div", { class: "userdef", text: "User-defined threshold — not universal" }));
        else if (dd.src) box.append(el("div", { class: "src", text: dd.src }));
        else if (pv != null) box.append(el("div", { class: "userdef", text: "ParlorLens working rule — not a published value. Change it if it does not suit your parlor." }));
        else box.append(el("div", { class: "userdef", text: "No documented value — leave blank or enter your own" }));
        if (dd.note) box.append(el("div", { class: "small muted", text: dd.note }));
        return box;
      }
      srcCell.append(srcNode(d));
      tb.append(el("tr", null, [
        el("td", { text: d.label, style: "white-space:normal" }),
        el("td", { class: "n" }, inp),
        el("td", { text: d.u }),
        srcCell
      ]));
    });
    t.append(tb);
    gp.append(el("div", { class: "tablewrap" }, t));
    host.append(gp);
  });
  host.append(omRulePanel());
  
  nextBar(host, "analysis", "Run the analysis");
}

/* ------------------------------------------------------------- 6. analysis */
function viewAnalysis(host) {
  if (S.tables) return viewTables(host);
  pageHead(host, "Analysis", "Findings are grouped by what they measure. Open any finding to see the data, the calculation and the threshold behind it.");
  if (!S.signal) { host.append(el("div", { class: "note warn", text: "Load a recording first." })); return; }
  runAnalysis();
  const R = S.results;

  // --- headline tiles
  const tp = el("div", { class: "panel" });
  tp.append(el("header", null, [el("h3", { text: "Headline figures" }),
    el("span", { class: "hint", text: (S.sessions && S.sessions.length > 1
      ? "Milking " + (S.sessionIdx + 1) + " of " + S.sessions.length + " · " : "") +
      "same engine as the full audit · " + R.window.how })]));
  const tiles = el("div", { class: "grid g4" });
  const smtF = R.findings.find(f => f.id === "smt_pf");
  const mk = (k, v, u, st) => el("div", { class: "tile " + (st || "na") }, [
    el("div", { class: "k", text: k }), el("div", { class: "v", text: v }), el("div", { class: "u", text: u })]);
  tiles.append(
    mk("Teat-end vacuum", smtF ? fmt(smtF.value) : "—", "kPa, peak flow", smtF ? smtF.status : "na"),
    mk("Cyclic fluctuation", R.cvf ? "+" + fmt(R.cvf.above, 1) + " / −" + fmt(R.cvf.below, 1) : "—", "kPa about the mean, 10 cycles", (R.findings.find(f => f.id === "cvf") || {}).status),
    mk("Pulsation rate", R.puls.ok ? fmt(R.puls.rate, 1) : "—", "cycles/min", (R.findings.find(f => f.id === "rate") || {}).status),
    mk("Pulsator ratio", R.puls.ok ? fmt(R.puls.ratioMilk, 0) + ":" + fmt(R.puls.ratioRest, 0) : "—", "milk : rest", (R.findings.find(f => f.id === "ratio") || {}).status),
    mk("MPC favourable", R.mpc ? fmt(R.mpc.pct, 0) : "—", "% of milking", (R.findings.find(f => f.id === "mpcfav_MPC") || {}).status),
    mk("Machine-on", hms(R.timing.machineOnS), "attachment to end of milking", "na"),
    mk("Overmilking", R.timing.overmilkS == null ? "—" : hms(R.timing.overmilkS), "start of overmilking to take-off", (R.findings.find(f => f.id === "overmilk") || {}).status),
    mk("Findings at action level", String(R.counts.crit), "of " + R.findings.length + " checks", R.counts.crit ? "crit" : "ok")
  );
  tp.append(tiles);
  host.append(tp);

  // --- traces
  const cp = el("div", { class: "panel" });
  cp.append(el("header", null, [el("h3", { text: "Vacuum trace" }),
    el("span", { class: "hint", text: "Shaded band = mouthpiece favourable range" })]));
  const ch = el("div"); cp.append(ch);
  host.append(cp);
  const tr = makeTrace(ch, { height: 320, showBand: true });
  const padS = Math.round(S.signal.fs * 8);
  if (S.markers.attach != null && S.markers.takeoff != null)
    tr.setView([clamp(S.markers.attach - padS, 0, S.signal.n - 2), clamp(S.markers.takeoff + padS, 10, S.signal.n)]);

  // --- pulsation detail
  if (R.puls.ok) {
    const pp = el("div", { class: "panel" });
    pp.append(el("header", null, [el("h3", { text: "Pulsation cycle" }),
      el("span", { class: "hint", text: "ISO 6690 phase boundaries at ±" + fmt(R.puls.ref) + " kPa reference levels" })]));
    const d = el("div"); pp.append(d);
    host.append(pp);
    const det = detectPulsationCycles(chArray("SPT"), R.window.pulsFrom, R.window.pulsTo, S.signal.fs);
    drawPulsDetail(d, det, R.puls, S.signal.fs);
    const t = el("table");
    t.append(el("thead", null, el("tr", null, ["Phase", "Action", "Duration", "% of cycle", "Target", ""].map((h, i) =>
      el("th", { class: i === 2 || i === 3 ? "n" : "", text: h })))));
    const tb = el("tbody");
    (R.findings.find(f => f.id === "phases").table || []).forEach(r => tb.append(el("tr", null, [
      el("td", { text: r.phase }), el("td", { text: r.what }),
      el("td", { class: "n", text: fmt(r.ms, 0) + " ms" }), el("td", { class: "n", text: fmt(r.pct, 1) + " %" }),
      el("td", { class: "n", text: r.target == null ? "—" : fmt(r.target, 0) + " ± " + fmt(r.tol, 0) + " ms" }),
      el("td", null, el("span", { class: "pill " + r.status, text: r.status === "ok" ? "in tolerance" : r.status === "warn" ? "outside tolerance" : r.status === "crit" ? "well outside" : "no target" }))
    ])));
    t.append(tb);
    pp.append(el("div", { class: "tablewrap", style: "margin-top:12px" }, t));
  }

  // --- findings
  const fp = el("div", { class: "panel" });
  fp.append(el("header", null, [el("h3", { text: "Findings" }),
    el("span", { class: "hint", text: R.counts.crit + " at action level · " + R.counts.warn + " outside tolerance · " + R.counts.na + " not assessed" })]));
  R.findings.forEach(f => fp.append(findingCard(f)));
  host.append(fp);

  if (R.actions.length) {
    const ap = el("div", { class: "panel" });
    ap.append(el("header", null, el("h3", { text: "Corrective action plan" })));
    const ol = el("ol", { class: "actions-list" });
    R.actions.forEach(a => ol.append(el("li", null, el("div", null, [
      el("div", { text: a.text }),
      el("div", { class: "src", style: "margin-top:3px", text: "From: " + a.from.join("; ") })
    ]))));
    ap.append(ol);
    ap.append(el("p", { class: "small muted", style: "margin-top:12px",
      text: "No setting should be changed on the strength of a single recording. Check, correct, then repeat the test under the same conditions." }));
    host.append(ap);
  }
  nextBar(host, "report", "Build the report");
}

function findingCard(f) {
  const c = el("div", { class: "finding" });
  const lab = { ok: "in range", warn: "outside tolerance", crit: "action level", na: "not assessed" }[f.status];
  c.append(el("div", { class: "fh" }, [
    el("div", { class: "ft" }, [
      el("h4", { text: f.title }),
      f.value != null && isFinite(f.value) ? el("div", { class: "fv", text: fmt(f.value, f.unit === "events" ? 0 : 1) + " " + (f.unit || "") }) : null
    ]),
    el("span", { class: "pill " + f.status, text: lab })
  ]));
  const body = el("div", { class: "fb" });
  if (f.text) body.append(el("p", { text: f.text }));
  if (f.eventList && f.eventList.length) {
    const t = el("table");
    t.append(el("thead", null, el("tr", null, ["Time", "Depth", "Duration"].map(h => el("th", { class: "n", text: h })))));
    const tb = el("tbody");
    f.eventList.forEach(e => tb.append(el("tr", null, [
      el("td", { class: "n", text: e.at }), el("td", { class: "n", text: fmt(e.depth) + " kPa" }), el("td", { class: "n", text: fmt(e.ms, 0) + " ms" })])));
    t.append(tb);
    body.append(el("div", { class: "tablewrap", style: "margin-top:8px" }, t));
  }
  if (f.actions && f.actions.length) {
    const ul = el("ul", { style: "margin:8px 0 0 18px;padding:0" });
    f.actions.forEach(a => ul.append(el("li", { text: a })));
    body.append(el("div", { class: "eyebrow", style: "margin-top:10px", text: "Possible checks" }), ul);
  }
  c.append(body);
  const dl = el("dl", { class: "audit" });
  [["Data used", f.measured], ["Calculation", f.calc], ["Threshold", f.threshold],
   ["Threshold source", f.source], ["Result type", f.basis], ["Confidence", f.confidence],
   ["Channel & time", f.where]].forEach(([k, v]) => {
    if (!v || v === "—") return;
    dl.append(el("dt", { text: k }), el("dd", { text: v }));
  });
  c.append(dl);
  return c;
}

      el("td", { class: "n", text: v.over || "—" }),

  p.append(el("div", { class: "note warn", style: "margin-top:12px", html:
    "Rows where the rate reads 0 and phase times run into tens of thousands of milliseconds are channels that were not connected to a pulsation tube during that test — VaDia Suite exports them anyway. Read only the rows whose channel carried the SPT tap." }));
  return p;
}

/* Which of the overmilking candidates is reported. VaDia Suite's manual describes
   the candidate test but not which candidate becomes the marker; none of the three
   choices reproduced VaDia's automatic markers on the reference recording, so the
   choice is the user's and is printed with every overmilking figure. */
const OM_RULES = [
  ["rise", "Strongest change with a rise in mouthpiece vacuum (default)", "The strongest candidate behind which mouthpiece vacuum rises at least 2 kPa (mean of the 20 s after against the 20 s before) — the shift in level the manual says usually comes with an empty teat. Where no candidate has that rise, no automatic marker is placed and the milking is flagged for checking. Against VaDia's stored markers on three farms (50 mouthpiece channels): 29 within 6 s against 26 for the strongest change, and the 5 channels it leaves unmarked were all wrong under the strongest change. On the held-out farm it is no better (4 of 14). A ParlorLens rule, not validated."],
  ["strongest", "Strongest change", "The candidate where the 2-s variation stands furthest above its running average. On the reference recording: the three markers an expert placed by hand matched within 1 s; VaDia's own automatic markers within 6 s on 6 of 9 milkings."],
  ["first", "First candidate", "The literal reading of the manual: the first 2-s period that meets the 1.3 × test. On the reference recording it was within 6 s of VaDia's marker on 3 of 9 milkings and up to 4.5 min early on the rest — it reports the most overmilking."],
  ["last", "Last candidate", "The last period that meets the test before take-off. Reports the least overmilking. On the reference recording: within 6 s of VaDia's marker on 6 of 9 milkings, but 5–6 s off the hand-placed markers."]
];
function omRulePanel() {
  const p = el("div", { class: "panel" });
  p.append(el("header", null, [el("h3", { text: "Start of overmilking — which candidate is reported" }),
    el("span", { class: "hint", text: "A ParlorLens choice, not a VaDia or published rule" })]));
  p.append(el("p", { class: "muted", style: "margin-top:0", text:
    "The VaDia Suite manual (ch. 22) gives the test that marks a 2-s period as a candidate for the start of overmilking, but a milking usually has several candidates (median 5 on the reference recording) and the manual does not say which one becomes the marker. Every candidate is kept and counted in the report; this setting decides which one is used. Check the trace of any milking where the choice matters." }));
  OM_RULES.forEach(([k, lab, txt]) => {
    const id = "omr_" + k;
    const r = el("input", { type: "radio", name: "omRule", id, value: k });
    r.checked = (S.omRule || "rise") === k;
    r.addEventListener("change", () => { S.omRule = k; S.omRuleChosen = true; logAudit("Overmilking rule", "Start of overmilking now taken from the " + lab.toLowerCase().replace(" (default)", "")); S.auto = null; saveIfConsented(); });
    p.append(el("label", { for: id, style: "display:flex;gap:10px;align-items:flex-start;margin:8px 0;cursor:pointer" },
      [r, el("span", null, [el("strong", { text: lab }), el("div", { class: "small muted", text: txt })])]));
  });
  return p;
}

    seg.append(el("button", { type: "button", "aria-pressed": String(reportMode === k), text: lab,
      onclick: () => { reportMode = k; render(); } })));

    reportMode === "summary" ? el("div", { class: "seg" }, [

    ]) : null,

let _secN = 0;
function rsec(n, title, kids) {
  return el("section", { class: "rsec" }, [
    el("span", { class: "eyebrow", text: "Section " + (++_secN) }),

  ]);
}

function buildTechnicalReport() {
  const R = S.results, s = S.signal, M = S.meta;
  const wrap = el("div", { class: "report" });
  const demo = S.source && S.source.kind === "demo";
  _secN = 1;   // the cover is section 1; sections with nothing measured are left out and the rest renumber

  /* 1 cover */
  wrap.append(el("section", { class: "cover" }, [
    el("div", { class: "ctag", text: APP.name + " v" + APP.version + " by " + APP.by + " · one milking in detail" }),
    el("h2", { text: M.farmName || "Milking unit audit — one milking" }),
    (M.parlorType || M.parlorSize || M.brand) ? el("div", { class: "ctag", text: [M.parlorType, M.parlorSize ? M.parlorSize + " units" : null, M.brand].filter(Boolean).join(" · ") }) : null,
    recordingIdLine(),
    demo ? el("div", { style: "margin-top:16px;padding:10px 12px;background:rgba(0,0,0,.28);border-radius:4px;font-weight:700",
      text: "DEMO DATA — synthetic recording. This document must not be delivered to a farm." }) : null,
    el("dl", null, [
      ["Test date", M.testDate || dateOf(s ? s.t0 : null)],

      M.consultant ? ["Consultant", M.consultant] : null,
      M.nCows ? ["Cows tested", M.nCows] : null,
      M.nUnits ? ["Units tested", M.nUnits] : null,

  ]));

  if (farmRows.length) wrap.append(rsec(2, "Farm information", el("div", { class: "kvlist" }, farmRows.map(([id, label]) => kv(label, M[id])))));

  /* 3 test setup */
  const setupRows = given(FARM_FIELDS[2][1].concat(FARM_FIELDS[3][1]).filter(([id]) => id !== "observations"));
  if (setupRows.length || M.observations) wrap.append(rsec(3, "Test setup", [
    setupRows.length ? el("div", { class: "kvlist" }, setupRows.map(([id, label]) => kv(label, M[id]))) : null,
    M.observations ? el("div", { style: "margin-top:14px" }, [
      el("div", { class: "eyebrow", text: "Observations recorded during the test" }),
      el("p", { text: M.observations, style: "margin-top:4px" })]) : null
  ]));

  /* 4 uploaded file summary */
  const src = S.source;
  wrap.append(rsec(4, "Source file", [
    el("div", { class: "kvlist" }, [
      kv("Recording", String(src.name || "").split(/[\\/]/).pop()), kv("Reader", src.parser),
      kv("Structural checks", checksLabel(src)),
      s ? kv("Recording start", stamp(s.t0)) : null,
      s ? kv("Duration", hms(totalSeconds())) : null,
      s ? kv("Sampling rate", s.fs + " Hz") : null,
      s ? kv("Samples per channel", s.n.toLocaleString()) : null
    ].filter(Boolean))
  ]));

  /* 5 data quality */
  wrap.append(rsec(5, "Data quality check", [
    tableOf(["Check", "Result", "Verdict", "What was checked"],
      src.checks.map(c => [c.name, c.value, el("span", { class: "pill " + (c.pass ? "ok" : "crit"), text: c.pass ? "pass" : "fail" }), c.detail])),
    ...src.notes.map(n => el("div", { class: "note warn", style: "margin-top:10px", text: n }))
  ]));

  /* 6 channel mapping */
  wrap.append(rsec(6, "Channel mapping", [
    el("p", { text: "Channel roles were assigned by the operator. No role is inferred from the file — the device records four unlabelled vacuum inputs." }),
    tableOf(["Channel", "Assigned role", "Min", "Mean", "Max", "SD"],

  ]));

  /* 7 executive summary */

  wrap.append(rsec(7, "Executive summary", [
    el("div", { class: "verdict " + R.verdict }, [el("div", { class: "lamp" }),
      el("div", null, [el("div", { class: "vt", text: verdictText }),
        el("div", { class: "small muted", text: R.counts.crit + " at action level · " + R.counts.warn + " outside tolerance · " +
          R.counts.ok + " in range · " + R.counts.na + " not assessed" })])]),
    tableOf(["Finding", "Value", "Threshold", "Verdict"],
      R.findings.filter(f => f.status !== "na").map(f => [f.title,
        f.value != null && isFinite(f.value) ? fmt(f.value, 1) + " " + (f.unit || "") : "—",
        f.threshold, el("span", { class: "pill " + f.status, text: f.status === "ok" ? "in range" : f.status === "warn" ? "outside tolerance" : "action level" })]))
  ]));

  /* 8 vacuum charts */
  const chartSec = rsec(8, "Vacuum trace", [
    el("p", { text: "The milking under analysis, all mapped channels. Where a pixel covers more than one sample the pale band is the full min–max range and the solid line is the mean, so no spike is hidden and no channel is buried. Vertical lines are the phase markers; dashed lines are points where the device stopped logging." })
  ]);
  const chost = el("div"); chartSec.append(chost);
  wrap.append(chartSec);
  setTimeout(() => {
    const tr = makeTrace(chost, { height: 300, showBand: true });
    const padS = Math.round(s.fs * 8);
    if (S.markers.attach != null && S.markers.takeoff != null)
      tr.setView([clamp(S.markers.attach - padS, 0, s.n - 2), clamp(S.markers.takeoff + padS, 10, s.n)]);
  }, 0);

  /* 9 pulsation */
  const pulsKids = [];
  if (R.puls.ok) {
    pulsKids.push(tableOf(["Phase", "Action", "Duration (ms)", "% of cycle", "Target", "Verdict"],
      R.findings.find(f => f.id === "phases").table.map(r => [r.phase, r.what, fmt(r.ms, 0), fmt(r.pct, 1),

  /* 10 stability */

    R.findings.find(f => f.id === "cvf") ? findingCard(R.findings.find(f => f.id === "cvf")) : null,
    R.findings.find(f => f.id === "npg") ? findingCard(R.findings.find(f => f.id === "npg")) : null
  ]));

  /* 11 slip / events */
  if (R.findings.find(f => f.id === "ivf")) wrap.append(rsec(11, "Liner slip and fall-off event detection", [
    findingCard(R.findings.find(f => f.id === "ivf")),
    el("p", { class: "src", text: "A vacuum drop of the right shape is consistent with air admission at the teat end. The recording cannot distinguish a liner slip from a kicked cluster or an intentional air admission; treat every listed event as something to check against the parlor notes, not as a confirmed slip." })
  ]));

  /* 12 phases */
  wrap.append(rsec(12, "Milking phase analysis", [
    tableOf(["Marker", "Clock time", "Elapsed", "How it was set"],
      MARKER_DEFS.filter(([k]) => S.markers[k] != null).map(([k, label]) => {
        const i = S.markers[k];
        return [label, i == null ? "not set" : clockAt(i), i == null ? "—" : hms(tAt(i)),
          i == null ? "—" : (S.markerAuto && S.markerAuto[k] === i) ? "Automatic — VaDia Suite manual ch. 22 rule" : "Placed by hand"];
      })),
    el("div", { class: "kvlist", style: "margin-top:14px" }, [
      kv("Milking analysed", S.sessions && S.sessions.length > 1
        ? "Milking " + (S.sessionIdx + 1) + " of " + S.sessions.length + " in this recording (" +
          S.sessions[S.sessionIdx].startClock + "–" + S.sessions[S.sessionIdx].endClock + ")"
        : "Single attachment period"),

  /* 14 bimodal */

  /* 15 equipment and routine diagnosis */
  const eq = [];

  const equipIssues = byGroup("puls").concat(byGroup("vacuum"));
  const routineIssues = byGroup("routine");
  eq.push(el("h3", { text: "Equipment", style: "margin-bottom:6px" }));

  eq.push(el("h3", { text: "Routine", style: "margin-bottom:6px" }));
  eq.push(routineIssues.length
    ? el("ul", { style: "margin:0 0 14px 18px" }, routineIssues.map(f => el("li", { html:
        "<strong>" + esc(f.title) + "</strong> — " + esc(f.text.split(".")[0]) + "." })))
    : el("p", { text: "No routine finding outside tolerance, within what this recording can show." }));
  eq.push(el("p", { class: "src", text: "Separating an equipment cause from a routine cause usually needs a second test after one of the two is changed. This section groups the findings; it does not assign cause." }));
  wrap.append(rsec(15, "Equipment and routine diagnosis", eq));

  wrap.append(rsec(16, "Corrective action plan", R.actions.length ? [
    el("ol", { class: "actions-list" }, R.actions.map(a => el("li", null, el("div", null, [

    S.mappingSource === "user" ? "Channel roles were confirmed by the operator. A wrong assignment invalidates every finding that uses that channel."
      : "Channel roles were not confirmed by the operator — they come from the default layout or from waveform shape. A wrong assignment invalidates every finding that uses that channel.",
    "This app reads one recording at a time. Where two VaDia devices were used on the same cows, analyse each file separately.",
    R.puls.ok ? "Limping is reported as a proxy from one pulsation chamber. ISO 6690 limping requires both chambers measured simultaneously." : null,
    "No statement of ISO compliance is made anywhere in this report. Compliance requires the full test conditions of the relevant standard to be documented and met; that is outside what a single logger recording can establish.",
    S.source.kind === "vd6" ? "The .vd6 reader is not a BioControl product. The format is not published; the reader was reverse-engineered from this installation's recordings and refuses any file that fails its structural checks. Passing them shows the file has the expected structure, not that the conversion is right — figures derived from it reproduce VaDia Suite's stored results (see the validation table), but no sample-by-sample comparison with a VaDia Suite raw export has been made. VaDia Suite remains the reference implementation." : null,
    S.source.kind === "demo" ? "THIS REPORT WAS BUILT FROM SYNTHETIC DEMO DATA." : null
  ].filter(Boolean);
  wrap.append(rsec(17, "Limitations", el("ul", { style: "margin:0 0 0 18px" }, lim.map(x => el("li", { text: x })))));

  /* 18 audit trail */
  wrap.append(rsec(18, "Audit trail", [
    el("p", { text: "Every step taken in this session, in order." }),
    tableOf(["Time", "Step", "Detail"], AUDIT.map(a => [clockOf(a.t), a.step, cleanReportText(a.detail)]))
  ]));

  /* 19 references */
  wrap.append(rsec(19, "References and threshold provenance", [
    tableOf(["Threshold", "Value used", "Source"],
      THRESH_DEFS.filter(d => T(d.id) !== null).map(d => [d.label, fmt(T(d.id), 2) + " " + d.u, threshSrc(d.id)])),
    el("h3", { text: "Verification against VaDia Suite", style: "margin:18px 0 6px" }),
    el("p", { text: "The reader and the analysis engine were checked cow by cow against VaDia Suite's own stored results for the same recording — nine cows, using VaDia Suite's own phase markers so both were given the identical window. Mean absolute difference across the nine:" }),
    tableOf(["Quantity", "Mean difference", "Worst case", "Correlation"], [
      ["Teat-end vacuum, whole attachment", "0.06 kPa", "0.11 kPa", "0.997"],
      ["Teat-end vacuum, peak flow", "0.01 kPa", "0.04 kPa", "1.000"],
      ["Teat-end vacuum, overmilking", "0.61 kPa", "5.32 kPa", "0.998"],
      ["Mouthpiece vacuum, whole attachment", "0.04 kPa", "0.12 kPa", "1.000"],
      ["Mouthpiece vacuum, main milking", "0.03 kPa", "0.12 kPa", "1.000"],
      ["Second mouthpiece, whole attachment", "0.05 kPa", "0.12 kPa", "1.000"],
      ["Time inside the mouthpiece favourable band (MPC)", "0.17 percentage points", "0.85 points", "—"],
      ["Same figure for the MPC2 channel (own overmilking marker)", "0.10 percentage points", "0.35 points", "—"],
      ["Pulsation rate, ratio and a/b/c phases", "within 2–10 ms of the pulsator-test export", "—", "—"]
    ]),
    el("p", { class: "src", style: "margin-top:8px", text: "The worst overmilking case is a cow whose overmilking window was 2.5 s long, where a marker rounded to the nearest second moves the mean. Two quantities are not reproduced here: VaDia Suite's Dip column, whose bounding is not published, and its CVF columns, which come from ten cycles at a marker that can be dragged — use the CVF spot marker for the comparable figure. Re-checked 5 Oct 2026 after the .vd6 reader fix. With the software's own automatic markers instead of VaDia's, agreement is lower wherever the overmilking marker differs — see the Method tab of the audit report. This verification covers one device generation and one installation; it is evidence, not a guarantee." }),
    el("h3", { text: "Documents referenced", style: "margin:16px 0 6px" }),
    el("ul", { style: "margin:0 0 0 18px" }, [
      "ISO 6690 — Milking machine installations: mechanical tests (pulsation phase reference levels).",
      "ISO 5707 — Milking machine installations: construction and performance (vacuum recovery; minimum massage-phase duration).",
      "BioControl VaDia Suite — default customer settings and channel recommendation values as configured in this installation.",

    ].map(x => el("li", { text: x }))),
    el("p", { class: "src", style: "margin-top:10px", text: "Where a threshold is marked user-defined it came from neither preset and carries no external authority." })
  ]));

  wrap.append(printFooter());
  return wrap;
}

function tableOf(headers, rows) {
  const t = el("table");
  t.append(el("thead", null, el("tr", null, headers.map(h => el("th", { text: h })))));
  const tb = el("tbody");
  rows.forEach(r => tb.append(el("tr", null, r.map(c =>
    el("td", (typeof c === "string" || typeof c === "number") ? { text: String(c), style: "white-space:normal" } : { style: "white-space:normal" },
      (typeof c === "string" || typeof c === "number") ? null : c)))));
  t.append(tb);
  return el("div", { class: "tablewrap" }, t);
}

function buildSummary() {
  const R = S.results, M = S.meta, ar = summaryLang === "ar";
  const sheet = el("div", { class: "summary-sheet", dir: ar ? "rtl" : "ltr", lang: ar ? "ar" : "en" });
  const demo = S.source && S.source.kind === "demo";

  sheet.append(el("div", { class: "eyebrow", text: ar ? AR.sub : "Farm manager summary" }));
  sheet.append(el("h2", { text: ar ? AR.title : "How the parlor milked today" }));
  sheet.append(el("div", { class: "kvlist", style: "margin-top:12px" }, [
    kv(ar ? AR.farm : "Farm", M.farmName || "—"),
    kv(ar ? AR.date : "Test date", M.testDate || dateOf(S.signal ? S.signal.t0 : null)),
    kv(ar ? AR.cons : "Consultant", M.consultant || "—"),
    kv(ar ? AR.cows : "Cows tested", M.nCows || "—")
  ]));
  if (demo) sheet.append(el("div", { class: "note crit", style: "margin-top:12px",
    text: "DEMO DATA — synthetic recording. Not a measurement of any farm." }));

  sheet.append(el("div", { class: "verdict " + R.verdict, style: "margin-top:18px" }, [
    el("div", { class: "lamp" }),
    el("div", { class: "vt", text: ar ? AR.verdict[R.verdict] : {
      ok: "Nothing reached an action level in this test.",
      warn: "Some readings are outside tolerance. Nothing needs stopping today.",
      crit: "Something needs attention before the next milking."
    }[R.verdict] })
  ]));

  sheet.append(el("h3", { text: ar ? AR.what : "What was measured", style: "margin-top:20px" }));
  const rows = SUM_ROWS.map(r => {
    const f = R.findings.find(x => x.id === r.id);
    if (!f || f.status === "na") return null;
    const lab = { ok: ar ? "منيح" : "Good", warn: ar ? "لازم ينتبهلو" : "Watch", crit: ar ? "لازم يتصلّح" : "Fix" }[f.status];
    return [ar ? r.ar : r.en,
      f.value != null && isFinite(f.value) ? fmt(f.value, f.unit === "events" ? 0 : 1) + " " + (f.unit || "") : "—",
      el("span", { class: "pill " + f.status, text: lab }),
      ar ? r.meanAr : r.meanEn];
  }).filter(Boolean);
  sheet.append(tableOf([ar ? "القياس" : "Measurement", ar ? "القراءة" : "Reading",
    ar ? "الوضع" : "Status", ar ? AR.meaning : "What it means for the cow"], rows));

  sheet.append(el("h3", { text: ar ? AR.actions : "What to do", style: "margin-top:22px" }));
  if (R.actions.length) {
    const ol = el("ol", { class: "actions-list" });
    R.actions.slice(0, 6).forEach(a => ol.append(el("li", null, el("div", { text: a.text }))));
    sheet.append(ol);
    if (ar) sheet.append(el("p", { class: "small muted", style: "margin-top:10px",
      text: "المصطلحات التقنية والأرقام والوحدات (kPa، ISO 6690، b phase، liner slip) منتركها بالإنكليزي متل ما هي بالتقرير التقني." }));
  } else sheet.append(el("p", { text: ar ? AR.none : "Nothing to change — every reading is inside its range." }));

  sheet.append(el("h3", { text: ar ? AR.limits : "What this page does not say", style: "margin-top:22px" }));
  sheet.append(el("p", { class: "small muted", text: ar
    ? "هالصفحة مبنية على تسجيل واحد من عدد محدود من الوحدات. ما منقول إنو النظام مطابق لأي مواصفة، وما منربط أي قراءة بالـ mastitis أو بأي مرض. التفاصيل الكاملة بالتقرير التقني."
    : "This page comes from one recording on a limited number of units. It does not state compliance with any standard, and it does not link any reading to mastitis or to any disease. The technical report carries the full working, the thresholds used and where each one came from." }));
  sheet.append(el("p", { class: "src", style: "margin-top:14px",
    text: (ar ? AR.gen + ": " : "Generated ") + stamp(new Date()) + (M.consultant ? " · " + M.consultant : "") }));
  return sheet;
}

/* ------------------------------------------------------------- CSV export */
function exportCSV() {
  const R = S.results; if (!R) return;
  const q = v => '"' + String(v == null ? "" : v).replace(/"/g, '""') + '"';
  const lines = [];
  lines.push(["Parlor vacuum audit — findings export"].map(q).join(","));
  lines.push([["Farm", S.meta.farmName || ""], ["Test date", S.meta.testDate || ""], ["Consultant", S.meta.consultant || ""],
              ["Recording", String(S.source.name || "").split(/[\\/]/).pop()]].concat(recordingIdOf() ? [["Recording ID", recordingIdOf()]] : [],
              [["Structural checks", checksLabel(S.source)], ["Generated", stamp(new Date())]]).map(p => q(p[0]) + "," + q(p[1])).join("\n"));
  lines.push("");
  lines.push(["Finding", "Value", "Unit", "Verdict", "Threshold", "Threshold source", "Result type", "Confidence", "Data used", "Calculation", "Channel and time"].map(q).join(","));
  R.findings.forEach(f => lines.push([f.title, f.value != null && isFinite(f.value) ? f.value.toFixed(3) : "", f.unit || "",
    f.status, f.threshold, f.source, f.basis, f.confidence, f.measured, f.calc, f.where].map(q).join(",")));
  lines.push("");
  lines.push(["Channel", "Role", "Min kPa", "Mean kPa", "Max kPa", "SD kPa"].map(q).join(","));
  R.chStats.forEach(r => lines.push(["CH" + (r.i + 1), r.role, r.min.toFixed(3), r.mean.toFixed(3), r.max.toFixed(3), r.sd.toFixed(3)].map(q).join(",")));
  lines.push("");
  lines.push(["Audit trail"].map(q).join(","));
  AUDIT.forEach(a => lines.push([clockOf(a.t), a.step, cleanReportText(a.detail)].map(q).join(",")));

  const blob = new Blob(["﻿" + lines.join("\n")], { type: "text/csv;charset=utf-8" });
  const name = ((S.meta.farmName || "parlor-audit").replace(/[^\w-]+/g, "_")) + "_" + dateOf(new Date()) + "_v" + APP.version + ".csv";
  const a = el("a", { href: URL.createObjectURL(blob), download: name });
  document.body.append(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  logAudit("CSV exported", name);
}

const LSKEY = "parlor-vacuum-audit-v1";
function saveIfConsented() {
  if (!S.consent) return;
  try {
    localStorage.setItem(LSKEY, JSON.stringify({
      meta: S.meta, thresh: S.thresh, preset: S.preset, mapping: S.mapping, mappingSource: S.mappingSource, omRule: S.omRule, omRuleChosen: !!S.omRuleChosen, testType: S.testType, handMarkers: S.handMarkers, reviewed: S.reviewed,
      owner: S.owner, partsMap: S.partsMap, linerLife: S.linerLife, history: S.history,
      savedBy: APP.version            // settings stored by v23 or later are never migrated again
    }));
  } catch (e) { /* private window, blocked storage — carry on */ }
}
function loadSaved() {
  try {
    const raw = localStorage.getItem(LSKEY);
    if (!raw) return null;
    return JSON.parse(raw);
  } catch (e) { return null; }
}
function clearSessionData() {
  try { localStorage.removeItem(LSKEY); } catch (e) {}
  S.signal = null; S.tables = null; S.source = null; S.results = null; S.auto = null; S.sessions = []; S.cowInfo = { unit: "L", rows: {} }; S.baselineId = null;
  S.meta = {}; S.markers = {}; S.mapping = { 0: "SPT", 1: "SMT", 2: "MPC", 3: "MPC2" }; S.mappingSource = "default"; S.omRule = "rise"; S.omRuleChosen = false; S.handMarkers = {}; S.reviewed = {};
  S.testType = "MTT"; S.testWins = {}; S.testSel = {}; S.ptLabels = {}; S.fotCh = null; S.stCh = null; S._availFor = null; S._ptSuggested = false; S._swingFor = null;
  applyPreset("suite");
  AUDIT.length = 0;
  logAudit("Session cleared", "All loaded data, farm details and saved settings removed");
  go("conclusion");
}

/* ==========================================================================
   VADIA MARKER ENGINE
   --------------------------------------------------------------------------
   Every marker is placed with the rule BioControl documents in the VaDia
   Suite User Manual v3.7, chapter 22 ("Milking Time Test"), then checked
   against the nine milkings in this installation's own database for which
   VaDia Suite stored the marker times it used:

     Milking split     9 of 9 milkings found
     Attachment        8 of 9 exact (the ninth had been moved by hand, 4.6 s)
     Start peak flow   8 of 8 not moved by hand: exact
     Start take-off    8 of 9 within 0.2 s, worst 2.1 s
     End of milking    9 of 9 within 1 s
     Overmilking       hand-placed: 3 of 3 within 1 s (first MPC), 2 of 3 within 1.5 s (second);
                       VaDia's automatic markers: 3 of 6 within 6 s — no candidate rule
                       reproduces them (see vdOvermilk)
     IVF type 1 count  8 of 9 within one event
     IVF type 2 count  7 of 9 within one event
     CVF               exact on 2 of 9 (the rest: marker probably moved in VaDia Suite)
     (Re-run 5 Oct 2026 after the .vd6 reader fix in 02-parsers.js.)

   Arrays in, sample indices out. Periods are laid out on the recording's
   clock (tAt / idxAtT), not by counting samples, so a pause in the logger
   can never shorten a duration. With the corrected reader the reference
   recording has no pause inside any milking — the logger only pauses
   between milkings — but other files may.
   ========================================================================== */

const VD = {
  ATTACH_KPA: 25,        // §22 "the moment when SMT vacuum rises above 25 kPa"
  QUIET_KPA: 5,          // cluster off: teat-end vacuum below 5 kPa …
  QUIET_S: 2,            // … for at least 2 s before a new attachment counts
  END_KPA: 5,            // §22 "first data point with SMT vacuum below 5 kPa denotes End milking"
  TAKEOFF_BELOW_MAX: 5,  // §22 "until the SMT vacuum is less than 5 kPa below maximum vacuum"
  PF_PERIOD_S: 10,       // §22 "average SMT vacuum in 10 seconds' periods"
  PF_SKIP_S: 20,         // §22 "the first 20 seconds' period is excluded"
  PF_DECLINE: 0.15,      // §22 "declines less than 0,15 kPa"
  PF_REPORT_S: -5,       // installed VaDia Suite 1.16 reports the boundary 10 s earlier than the
                         // manual's "midpoint of the first period" — reproduced on 7 of 7 unedited cows
  OM_WIN_S: 2,           // §22 "calculated every two seconds … difference between maximum and minimum"
  OM_RATIO: 1.3,         // §22 "equal to or above 1,3 times the preceding running average"
  OM_OLD: 0.7, OM_NEW: 0.3, // §22 "0,7 times the old running average plus 0,3 times the current"
  CVF_AFTER_PF_S: 60,    // §21/22 CVF "ten pulsation cycles 60 seconds after the start of the Peak-Flow period"
  CVF_CYCLES: 10,
  IVF1_RATE: 100, IVF1_MAG: 21, // §22 type 1: 100 kPa/s and 21 kPa
  IVF2_RATE: 56,  IVF2_MAG: 14, // §22 type 2: 56 kPa/s and 14 kPa
  SLIP_RATE: 40,  SLIP_MAG: 10, // Baxter et al. 1992 in Mein et al. 2004: ≥10 kPa within ≤0.25 s
  MPC_MIN_GAP: 3,        // mouthpiece within 3 kPa of teat-end vacuum and r ≥ 0.95: not a teat in a liner
  ATTACH_WINDOW_S: 10,   // drops in the first 10 s are cups going on, not slips (measured: all ≤ 5.5 s here)
  MIN_MILKING_S: 45,     // plausibility: shorter periods are not treated as a milking
  MIN_FLOW_DIP: 1.5,     // plausibility: a low-dip period needs operator review before inclusion
  FLOWEND_DELTA: 0.7     // cross-check: teat-end vacuum back within 0.7 kPa of its no-flow plateau
};

function _mean(a, i0, i1) { let s = 0, n = 0; for (let i = i0; i < i1; i++) { const v = a[i]; if (isFinite(v)) { s += v; n++; } } return n ? s / n : NaN; }
function _max(a, i0, i1) { let m = -Infinity; for (let i = i0; i < i1; i++) if (a[i] > m) m = a[i]; return m; }
function _min(a, i0, i1) { let m = Infinity; for (let i = i0; i < i1; i++) if (a[i] < m) m = a[i]; return m; }

/** Every attachment → end-of-milking period in the recording (VaDia's Split). */
function vdFindMilkings(smt, fs, n) {
  /* The VaDia logger can be set to start on vacuum, so a recording — and every
     segment after a logging pause — may begin just as the cluster goes on. The
     2-s quiet period before an attachment then was never recorded. The start of
     the recording and the end of every pause therefore count as "cluster off";
     an attachment found there is kept and flagged, never silently dropped. */
  const out = [], quiet = Math.round(VD.QUIET_S * fs);
  const sig = typeof S !== "undefined" ? S.signal : null;
  const segs = [0];
  if (sig && sig.blockT) for (let b = 1; b < sig.nBlocks; b++) if (sig.blockT[b] - sig.blockT[b - 1] > 1.5) segs.push(b * fs);
  let run = quiet, realRun = 0, seg = 0, i = 0, p = 0;
  while (i < n) {
    // entering a new recorded segment (also when the previous milking's end jumped past its start)
    while (p < segs.length && segs[p] <= i) {
      seg = segs[p++]; run = quiet; realRun = 0;
      for (let k = seg; k < i; k++) realRun = smt[k] < VD.QUIET_KPA ? realRun + 1 : 0;
    }
    const v = smt[i];
    if (v < VD.QUIET_KPA) { run++; realRun++; i++; continue; }
    if (v <= VD.ATTACH_KPA) { i++; continue; }        // rising edge: keep counting the quiet period
    if (run >= quiet) {
      const att = i;
      // how sure is the attachment time?
      //  - "rise seen": the climb through 25 kPa was recorded, only the quiet period before it was not;
      //  - "unseen": the segment already starts above 25 kPa — the cluster went on during the pause.
      const fromSegment = realRun < quiet;
      const attachUnseen = att === seg && v > VD.ATTACH_KPA;
      // Do not search for removal in a later recorded segment.
      const segmentEnd = p < segs.length ? segs[p] : n;
      let end = segmentEnd - 1, endSeen = false;
      for (let k = att + 20 * fs; k < segmentEnd; k++) if (smt[k] < VD.END_KPA) { end = k; endSeen = true; break; }
      const secs = Math.floor((end - att) / fs);
      let dip = 0;
      if (secs > 15) {
        const s2 = [];
        for (let k = 0; k < secs; k++) s2.push(_mean(smt, att + k * fs, att + (k + 1) * fs));
        const tail = s2.slice(Math.max(0, secs - 10), secs - 3).sort((x, y) => x - y);
        const plateau = tail.length ? tail[Math.floor(tail.length / 2)] : s2[s2.length - 1];
        let lo = Infinity; for (let k = 5; k < secs - 5; k++) if (s2[k] < lo) lo = s2[k];
        dip = plateau - lo;
      }
      const minS = T("milking_min_s") != null ? T("milking_min_s") : VD.MIN_MILKING_S;
      const minDip = T("milking_min_dip") != null ? T("milking_min_dip") : VD.MIN_FLOW_DIP;
      const secsClock = tAt(end) - tAt(att);
      const why = [];
      if (secsClock < minS) why.push("shorter than " + fmt(minS, 0) + " s (" + fmt(secsClock, 0) + " s)");
      if (dip < minDip) why.push("teat-end vacuum dipped only " + fmt(dip, 1) + " kPa (needs " + fmt(minDip, 1) + " kPa to count as milk flow)");
      // the logger started, vacuum stirred, but 25 kPa was only reached later: VaDia Suite placed
      // its attachment at the start of the recorded segment in such cases (Libanlait, 3 of 3),
      // so both times are kept and the milking's timings are not judged
      // (Libanlait 31 Oct 2025: in the 3 milkings with this pattern VaDia Suite placed the attachment at
      // the logger start, 8–13 s before the 25 kPa crossing; where the vacuum rose straight through
      // 25 kPa it used the crossing, as the manual says)
      let ambiguous = false;
      const lead = tAt(att) - tAt(seg);
      // the pattern: vacuum stirs (> 2 kPa) soon after the logger starts, falls back below 5 kPa for
      // 2 s or more, and only then rises through 25 kPa
      if (!attachUnseen && lead > 5 && lead <= 30) {
        let k = seg; while (k < att && smt[k] <= 2) k++;
        let q = 0, best = 0; for (; k < att; k++) { if (smt[k] < VD.QUIET_KPA) { q++; if (q > best) best = q; } else q = 0; }
        ambiguous = k > seg && best >= quiet && (function () { for (let j = seg; j < att; j++) if (smt[j] > 2) return true; return false; })();
      }
      out.push({ att, end, seconds: secsClock, dip, real: !why.length, why,
                 fromSegment, attachUnseen, ambiguous, segStart: seg, atRecordingStart: seg === 0 && fromSegment, endSeen });
      i = end + 1; run = 0; realRun = 0;
      // a pause may start right after the end: the loop top resets at the next segment
      continue;
    }
    run = 0; realRun = 0; i++;                          // above 25 kPa without a quiet period first
  }
  return out;
}

/** Start of peak flow — SMT stops declining (milk flow has established). */
function vdPeakFlow(smt, fs, att, end) {
  const t0 = tAt(att), tEnd = tAt(end), P = VD.PF_PERIOD_S;
  const enough = (i0, i1) => i1 - i0 >= 0.5 * P * fs;          // a period more than half lost to a logging gap is not judged
  for (let k = 0; k < 120; k++) {
    const ta = t0 + VD.PF_SKIP_S + k * P;
    if (ta + 2 * P > tEnd) break;
    const a = idxAtT(ta), b = idxAtT(ta + P), c = idxAtT(ta + 2 * P);
    if (!enough(a, b) || !enough(b, c)) continue;
    if (_mean(smt, a, b) - _mean(smt, b, c) < VD.PF_DECLINE)
      return Math.max(att, idxAtT(ta + VD.PF_REPORT_S));
  }
  return Math.min(end, idxAtT(t0 + 15));
}

/** Start of take-off — last point within 5 kPa of the post-peak-flow maximum. */
function vdTakeoff(smt, fs, pf, end) {
  const mx = _max(smt, pf, end);
  for (let i = end - 1; i > pf; i--) if (smt[i] >= mx - VD.TAKEOFF_BELOW_MAX) return i;
  return end;
}

/** Start of overmilking on one mouthpiece channel — the VaDia Suite manual's test:
    every 2 s, variation = max − min; running average = 0.7 · old + 0.3 · current;
    a candidate wherever the current variation is at least 1.3 × the running average.
    The manual does not say which candidate VaDia Suite uses when there are several,
    and on the test milkings VaDia's own automatic markers matched neither the first,
    the last nor the strongest consistently. So every candidate is kept and the
    choice is a stated setting (S.omRule):
      "rise" (default)      — the strongest candidate behind which mouthpiece vacuum
                              actually rises ≥ 2 kPa (mean of the 20 s after against
                              the 20 s before), the shift in level the manual says
                              usually comes with an empty teat. No such candidate →
                              no automatic marker, and the milking is flagged.
                              ParlorLens rule, tested on 3 farms / 50 channels against
                              VaDia's stored markers: 29 within 6 s against 26 for
                              "strongest"; the 5 channels it leaves unmarked were all
                              wrong under "strongest". Sun Dairy unchanged (4 of 14).
      "strongest"           — largest ratio; matched the three hand-placed expert
                              markers to within 1 s;
      "first"               — the manual's wording read literally;
      "last"                — the latest qualifying change. */
function vdOvermilk(mpc, fs, pf, to) {
  const W = VD.OM_WIN_S;
  if (!mpc || tAt(to) - tAt(pf) < W * 5) return null;
  let ra = null;
  const cand = [];
  const tEnd = tAt(to);
  for (let t = tAt(pf); t + W <= tEnd; t += W) {
    const j = idxAtT(t), j1 = idxAtT(t + W);
    // after a logging pause of more than 5 s, restart the running average rather than
    // compare levels recorded far apart in time
    if (gapInside(Math.max(pf, j - fs), j1, 5)) { ra = null; continue; }
    if (j1 - j < 0.5 * W * fs) continue;
    const cur = _max(mpc, j, j1) - _min(mpc, j, j1);
    if (ra === null) { ra = cur; continue; }
    const ratio = ra > 0 ? cur / ra : 1;
    if (ratio >= VD.OM_RATIO) cand.push({ idx: j, ratio });
    ra = VD.OM_OLD * ra + VD.OM_NEW * cur;
  }
  if (!cand.length) return null;
  const first = cand[0], last = cand[cand.length - 1];
  const strongest = cand.reduce((b, x) => x.ratio > b.ratio ? x : b, cand[0]);
  const rule = (typeof S !== "undefined" && S.omRule) || "rise";
  let pick;
  if (rule === "rise") {
    const sup = cand.filter(x => {
      const a = Math.max(pf, x.idx - 20 * fs), b = Math.min(to, x.idx + 20 * fs);
      if (x.idx - a < fs || b - x.idx < fs || gapInside(a, b, 1)) return false;
      x.rise = _mean(mpc, x.idx, b) - _mean(mpc, a, x.idx);
      return x.rise >= 2;
    });
    if (!sup.length) return null;
    pick = sup.reduce((b, x) => x.ratio > b.ratio ? x : b, sup[0]);
  } else pick = rule === "first" ? first : rule === "last" ? last : strongest;
  return { idx: pick.idx, ratio: pick.ratio, rule, candidates: cand.length, cand, first: first.idx, last: last.idx, strongest: strongest.idx };
}

/** Independent cross-check: teat-end vacuum climbs back to its no-flow plateau
    when milk stops flowing (the same mechanism §22 uses for peak flow, run backwards). */
function smtFlowEnd(smt, fs, pf, to) {
  const t0 = tAt(pf), secs = Math.floor(tAt(to) - t0);
  if (secs < 12) return null;
  const s = new Float64Array(secs);        // one mean per clock second; NaN where the logger recorded nothing
  for (let k = 0; k < secs; k++) { const a = idxAtT(t0 + k), b = idxAtT(t0 + k + 1); s[k] = b - a >= fs / 2 ? _mean(smt, a, b) : NaN; }
  const tail = Array.from(s.slice(secs - 8, secs - 2)).filter(isFinite).sort((a, b) => a - b);
  if (!tail.length) return null;
  const plateau = tail[Math.floor(tail.length / 2)];
  let kmin = -1; for (let k = 0; k < secs - 8; k++) if (isFinite(s[k]) && (kmin < 0 || s[k] < s[kmin])) kmin = k;
  if (kmin < 0) return null;
  for (let k = kmin; k < secs; k++) {
    if (!isFinite(s[k])) continue;
    let ok = true;
    for (let j = k; j < secs - 2; j++) if (s[j] < plateau - VD.FLOWEND_DELTA) { ok = false; break; }
    if (ok) return { idx: idxAtT(t0 + k), plateau, lowest: s[kmin], dip: plateau - s[kmin] };
  }
  return null;
}

/** CVF exactly as VaDia reports it: ten pulsation cycles from 60 s after start
    of peak flow; per-cycle min / mean / max of SMT, then averaged. */
function vdCVF(smt, cycles, fs, pf, stopAt, at) {
  if (!cycles || !cycles.length) return null;
  // VaDia's CVF marker sits 60 s after start of peak flow and can be dragged; a hand-placed marker wins
  const from = at != null ? at : idxAtT(tAt(pf) + VD.CVF_AFTER_PF_S);
  const use = cycles.filter(c => c.i0 >= from && c.i1 <= stopAt).slice(0, VD.CVF_CYCLES);
  if (use.length < 5) return null;
  let mn = 0, av = 0, mx = 0;
  use.forEach(c => { mn += _min(smt, c.i0, c.i1); av += _mean(smt, c.i0, c.i1); mx += _max(smt, c.i0, c.i1); });
  mn /= use.length; av /= use.length; mx /= use.length;
  return { at: use[0].i0, n: use.length, min: mn, avg: av, max: mx, above: mx - av, below: av - mn };
}

/** Rapid drops in teat-end vacuum: fall rate ≥ `rate` kPa/s sustained over 25 ms
    steps, and total fall ≥ `mag` kPa. Used with VaDia's type-1/type-2 limits and
    with the Baxter liner-slip definition. */
function vdEvents(smt, fs, a, b, rate, mag) {
  const step = Math.max(1, Math.round(fs * 0.025)), gapJoin = Math.round(fs * 0.1);
  const ev = [];
  let runStart = -1, runEnd = -1;
  const flush = () => {
    if (runStart < 0) return;
    const s0 = runStart, s1 = Math.min(b - 1, runEnd + step);
    const pre = _max(smt, Math.max(a, s0 - gapJoin), s0 + 1);
    const pe = Math.min(b, s1 + Math.round(fs * 0.25));
    let post = Infinity, minIdx = s1;
    for (let k = s1; k < pe; k++) if (smt[k] < post) { post = smt[k]; minIdx = k; }
    if (pre - post >= mag) ev.push({ idx: s0, minIdx, depth: pre - post, from: pre, to: post });
    runStart = -1;
  };
  for (let i = a; i + step < b; i++) {
    const slope = (smt[i + step] - smt[i]) / (step / fs);
    if (slope <= -rate) {
      if (runStart >= 0 && i - runEnd > gapJoin) flush();
      if (runStart < 0) runStart = i;
      runEnd = i;
    }
  }
  flush();
  return ev;
}

/** How long teat-end vacuum takes to come back after an event (regulator / reserve response). */
function recoveryAfter(smt, fs, ev, baseline, limit) {
  const from = ev.minIdx != null ? ev.minIdx : ev.idx;
  for (let i = from; i < Math.min(limit, from + 10 * fs); i++)
    if (smt[i] >= baseline - 2) return (i - from) / fs;
  return null;
}

/** Is this channel really a mouthpiece chamber on a teat? On every real milking
    tested the mouthpiece sat 5–25 kPa below teat-end vacuum. A tap that reads
    the same level and moves in lock-step with the short milk tube is on the milk
    path (a simulator, a flow test, or a needle through into the milk tube). */
function mouthpieceCheck(smt, mpc, fs, a, b) {
  const k = Math.floor((b - a) / fs); if (!mpc || k < 10) return null;
  const x = new Float64Array(k), y = new Float64Array(k);
  for (let j = 0; j < k; j++) { x[j] = _mean(smt, a + j * fs, a + (j + 1) * fs); y[j] = _mean(mpc, a + j * fs, a + (j + 1) * fs); }
  let mx = 0, my = 0; for (let j = 0; j < k; j++) { mx += x[j]; my += y[j]; } mx /= k; my /= k;
  let sxy = 0, sxx = 0, syy = 0; for (let j = 0; j < k; j++) { const dx = x[j] - mx, dy = y[j] - my; sxy += dx * dy; sxx += dx * dx; syy += dy * dy; }
  const r = sxx > 0 && syy > 0 ? sxy / Math.sqrt(sxx * syy) : 0;
  const gap = mx - my;
  return { gap, r, valid: !(Math.abs(gap) < VD.MPC_MIN_GAP && r >= 0.95) };
}

/** Seconds from the first teatcup going on until teat-end vacuum holds steady. */
function attachSettle(smt, fs, att, work) {
  for (let k = 0; k < 60 * fs; k += Math.round(fs / 10)) {
    if (att + k + fs >= smt.length) break;
    if (_min(smt, att + k, att + k + fs) >= work - 6) return k / fs;
  }
  return null;
}

/* ==========================================================================
   COMPREHENSIVE AUDIT — every milking analysed, then judged four ways:
   the milker, the vacuum, the liner and cluster, the pulsation. Plus what
   it means for the farm and what it feels like for the cow.

   Rule for every judgement in this file: a verdict appears only where a
   published or documented reference exists, and the reference is named.
   Everything else is reported as a measurement with its meaning explained.
   ========================================================================== */

const REFS = {

  ronning:  { short: "Rønningen & Postma", full: "Rønningen O (TINE), Postma E (BioControl). Classification of mouthpiece chamber vacuum records in milking-time tests. National Mastitis Council; IDF working group on milking-time tests.", url: "https://www.biocontrol.no/down/NMC_Florida_1_low_res.pdf" },
  mein:     { short: "Mein et al. 2004", full: "Mein GA et al. Milking machines and mastitis risk: a storm in a teatcup. Proceedings, National Mastitis Council Annual Meeting 2004: 176–188 (citing Baxter et al. 1992; Thiel et al. 1973; Woolford 1995, 1997).", url: "https://qualitycounts.umn.edu/sites/qualitycounts.umn.edu/files/2022-01/r-mm-1.pdf" },
  dairex:   { short: "DAIReXNET", full: "The role of milking equipment in mastitis. DAIReXNET / eXtension (citing Stewart et al. 1996 on teat-end vacuum; Mein & Reid 1996 on slips and fall-offs).", url: "https://dairy-cattle.extension.org/the-role-of-milking-equipment-in-mastitis/" },

  psuSec:   { short: "Penn State Extension", full: "Penn State Extension. Seconds do matter in your milking routine (citing Yost 2023): lag time 60–120 s, unit-on time 3.5–5 min, overmilking 1 min or less.", url: "https://extension.psu.edu/seconds-do-matter-in-your-milking-routine" },
  psuEval:  { short: "Becker 2026", full: "Becker C. What is a milking evaluation and how can it help improve milk quality? Penn State Extension, 2026.", url: "https://extension.psu.edu/what-is-a-milking-evaluation-and-how-can-it-help-improve-milk-quality" },

  iso:      { short: "ISO 5707 / ISO 6690", full: "ISO 5707 (construction and performance) and ISO 6690 (mechanical tests), as cited in the VaDia Suite manual (p. 49) and the wet-testing guide.", url: null }

/* ---------------------------------------------------------- one milking */
/* One milking through the one calculation engine. `ov` holds markers placed by
   hand (attach, peakStart, takeoff, end, overmilkStart, overmilkStart2, cvfPoint);
   any marker not given is placed by the VaDia Suite manual's rule. The single-
   milking report runs through here too, so both report modes give the same numbers. */
function analyseMilkingVD(m, k, arr, fs, prev, ov) {
  ov = ov || {};
  const { smt, spt } = arr;
  const att = ov.attach != null ? ov.attach : m.att, end = ov.end != null ? ov.end : m.end;
  // durations by the recording's clock, so pauses in logging are never counted as milking time
  const dur = (a, b) => a == null || b == null ? null : tAt(b) - tAt(a);
  const pf = ov.peakStart != null ? ov.peakStart : vdPeakFlow(smt, fs, att, end);
  const to = ov.takeoff != null ? ov.takeoff : vdTakeoff(smt, fs, pf, end);
  const chkA = mouthpieceCheck(smt, arr.mpc, fs, pf, to), chkB = mouthpieceCheck(smt, arr.mpc2, fs, pf, to);
  const mpc = chkA && !chkA.valid ? null : arr.mpc, mpc2 = chkB && !chkB.valid ? null : arr.mpc2;
  const om1a = mpc ? vdOvermilk(mpc, fs, pf, to) : null, om2a = mpc2 ? vdOvermilk(mpc2, fs, pf, to) : null;
  const handOM = (o, i) => i == null ? o : Object.assign({}, o || {}, { idx: i, rule: "placed by hand" });
  const om1 = ov.overmilkStart !== undefined ? handOM(om1a, ov.overmilkStart) : om1a;
  const om2 = ov.overmilkStart2 !== undefined ? handOM(om2a, ov.overmilkStart2) : om2a;
  const fe = smtFlowEnd(smt, fs, pf, to);
  const om = om1 ? om1.idx : (om2 ? om2.idx : null);
  const pfEnd = om != null ? om : to;

  const det = spt ? detectPulsationCycles(spt, pf, to, fs) : { ok: false };
  const puls = det.ok ? pulsationSummary(det, fs) : null;
  const cvf = det.ok ? vdCVF(smt, det.cycles, fs, pf, to, ov.cvfPoint) : null;

  // teat-end vacuum by phase of milking
  const smtPF = _mean(smt, pf, pfEnd), smtOM = om != null && to - om > fs ? _mean(smt, om, to) : null;
  let bSum = 0, bN = 0, dSum = 0, dN = 0;
  if (det.ok) det.cycles.forEach(c => {
    if (c.i0 < pf || c.i1 > pfEnd) return;
    const b0 = c.i0 + c.a, b1 = b0 + c.b, d0 = b1 + c.c;
    for (let i = b0; i < b1; i++) { bSum += smt[i]; bN++; }
    for (let i = d0; i < c.i1; i++) { dSum += smt[i]; dN++; }
  });

  // mouthpiece: level, VaDia favourable %, Rønningen & Postma class — band from the threshold settings
  const mpcStats = (x, a, b) => {
    if (!x || b - a < fs) return null;
    const r = mpcFavourable(x, a, b); if (!r) return null;
    const mean = _mean(x, a, b);
    return { mean, fav: r.pct, above: r.abovePct, below: r.belowPct, lo: r.lo, hi: r.hi, cls: mean < r.lo ? "low" : mean > r.hi ? "high" : "medium" };
  };
  const mA = mpcStats(mpc, pf, pfEnd), mB = mpcStats(mpc2, pf, om2 ? om2.idx : to);
  const mAalt = fe ? mpcStats(mpc, pf, fe.idx) : null;
  const mAom = mpc && om1 && to - om1.idx > fs ? _mean(mpc, om1.idx, to) : null;

  // events. VaDia's own type-1/type-2 definitions over the whole milking (so the
  // totals compare with VaDia Suite), then split by phase: drops in the first
  // 10 s are teatcups going on, drops after start of take-off are removal — only
  // those in between are slips.
  const work = pct(smt, 0.9, pf, to);
  const attWin = att + VD.ATTACH_WINDOW_S * fs;
  const phaseOf = e => e.idx < attWin ? "attach" : e.idx >= to ? "removal" : "milking";
  const ivf1 = vdEvents(smt, fs, att, end, VD.IVF1_RATE, VD.IVF1_MAG);
  const ivf2 = vdEvents(smt, fs, att, end, VD.IVF2_RATE, VD.IVF2_MAG);
  const cupDrops = vdEvents(smt, fs, att, Math.min(to, attWin), VD.SLIP_RATE, VD.SLIP_MAG);
  const lastCup = cupDrops.length ? cupDrops[cupDrops.length - 1].minIdx : att;
  const settleAfter = attachSettle(smt, fs, lastCup, work);
  const settle = settleAfter == null ? null : tAt(lastCup) - tAt(att) + settleAfter;
  const slips = vdEvents(smt, fs, Math.min(to, attWin), to, VD.SLIP_RATE, VD.SLIP_MAG);
  const mid = att + (to - att) / 2;
  slips.forEach(e => {
    e.late = e.idx >= mid;
    const base = _mean(smt, Math.max(att, e.idx - 3 * fs), e.idx);
    e.recover = recoveryAfter(smt, fs, e, base, to);
  });

  // cross-check overmilking against the teat-end plateau
  const omS = om1 ? dur(om1.idx, to) : null;
  const feS = fe ? dur(fe.idx, to) : null;
  const agree = (om1 && fe) ? Math.abs(omS - feS) <= 30 : null;

  const secAt = i => tAt(i);

  // Reasons this milking's automatic markers should be looked at before its figures are relied on.
  // None of these is a fault in the parlor — each says the marker could not be placed with confidence.
  const review = [];
  if (m.operatorIncluded) review.push("operator included this period despite detection rules: " + m.why.join("; "));
  // ParlorLens working rule (Thresholds): a review flag only — skipped when the gap is not set
  const reGap = T("reattach_gap_s");
  if (prev && reGap != null && tAt(att) - tAt(prev.end) < reGap) review.push("possible reattachment or split milking — check against cow notes");
  if (ov.attach == null && (m.attachUnseen || m.ambiguous)) review.push("attachment time uncertain");
  if (gapInside(att, to, 10)) review.push("recording pauses inside the milking");
  if (m.endSeen === false) review.push("recording ends before the cluster came off");
  if (ov.overmilkStart === undefined) {
    if (mpc && !om1) review.push("no overmilking change found on the first mouthpiece channel" + (S.omRule === "rise" ? " with a rise in mouthpiece vacuum behind it" : ""));
    if (om1 && om1.rule !== "placed by hand") {
      const rise = _mean(mpc, om1.idx, Math.min(to, om1.idx + 20 * fs)) - _mean(mpc, Math.max(pf, om1.idx - 20 * fs), om1.idx);
      if (!(rise >= 2)) review.push("mouthpiece vacuum does not rise after the overmilking marker (" + fmt(rise, 1) + " kPa)");
    }
  }
  if (om1 && (om1.idx < pf || om1.idx > to)) review.push("overmilking marker lies outside peak flow → take-off");
  if (ov.takeoff == null && dur(to, end) > 30) review.push("no clear take-off in teat-end vacuum (" + hms(dur(to, end)) + " from take-off marker to end)");

  const idleBefore = prev ? secAt(att) - secAt(prev.end) : null;

  return {
    n: k + 1, att, pf, to, end, mpcCheck: [chkA, chkB], omInfo: [om1, om2],
    pulsExcluded: det.ok ? det.rejected : null, pulsFound: det.ok ? det.found : null,
    noTeat: !!((chkA && !chkA.valid) || (chkB && !chkB.valid)), om1: om1 ? om1.idx : null, om2: om2 ? om2.idx : null, fe: fe ? fe.idx : null,
    start: clockAt(att), stop: clockAt(end),
    letdown: dur(att, pf), main: dur(pf, pfEnd), overmilk: omS, overmilk2: om2 ? dur(om2.idx, to) : null,
    overmilkSMT: feS, omAgree: agree, omRatio: om1 ? om1.ratio : null,
    detach: dur(to, end), machineOn: dur(att, end),
    gapS: dur(att, end) - (end - att) / fs,     // seconds of recording missing inside this milking
    // more than 10 s unrecorded between attachment and take-off: the markers that
    // depend on the flow curve (peak flow, overmilking) cannot be trusted here
    incomplete: gapInside(att, to, 10) || m.endSeen === false,
    // attachment time not certain: the cluster went on during a logging pause, or the logger
    // started on vacuum activity well before teat-end vacuum passed 25 kPa
    startUncertain: ov.attach == null && !!(m.attachUnseen || m.ambiguous),
    startNote: ov.attach != null ? null : m.attachUnseen ? "cluster went on during a logging pause — attachment time not recorded"
      : m.ambiguous ? "logger started at " + clockAt(m.segStart) + ", teat-end vacuum passed 25 kPa only at " + clockAt(att) + " (+" + fmt(tAt(att) - tAt(m.segStart), 0) + " s); VaDia Suite may use the earlier time"
      : m.fromSegment ? "attachment at the start of a recorded segment — the quiet period before it was not recorded" : null,
    endNote: m.endSeen === false ? "recording ends before the end of this milking" : null,
    settle, idleBefore, reattach: reGap != null && idleBefore != null && idleBefore < reGap,   // same Thresholds rule as the review flag above
    smtPF, smtOM, smtTot: _mean(smt, att, end), bPhase: bN ? bSum / bN : null, dPhase: dN ? dSum / dN : null,
    sysVac: puls ? puls.vmax : null, pathLoss: puls ? puls.vmax - smtPF : null,
    cvf, puls,
    mpc: mA, mpc2: mB, mpcAlt: mAalt, mpcClimb: mA && mAom != null ? mAom - mA.mean : null,
    ivf1: ivf1.length, ivf2: ivf2.length,
    ivf1M: ivf1.filter(e => phaseOf(e) === "milking").length, ivf2M: ivf2.filter(e => phaseOf(e) === "milking").length,
    ivfAttach: ivf2.filter(e => phaseOf(e) === "attach").length, cupDrops: cupDrops.length,
    slips, dip: fe ? fe.dip : null,
    operatorIncluded: !!m.operatorIncluded, review, hand: Object.keys(ov).filter(k => ov[k] != null),
    // where the rules alone would put each marker — so a view can tell moved markers from rule-placed ones
    rule: { attach: m.att, end: m.end, peakStart: ov.peakStart != null ? vdPeakFlow(smt, fs, att, end) : pf,
            takeoff: ov.takeoff != null ? vdTakeoff(smt, fs, pf, end) : to,
            overmilkStart: om1a ? om1a.idx : null, overmilkStart2: om2a ? om2a.idx : null,
            cvfPoint: ov.cvfPoint == null && cvf ? cvf.at : (() => { const i = idxAtT(tAt(pf) + 60); return i < to ? i : null; })() },
    timingOK: !m.operatorIncluded && !(gapInside(att, to, 10) || m.endSeen === false) && !(ov.attach == null && (m.attachUnseen || m.ambiguous))
  };
}

/* ------------------------------------------------------------- the herd */
function _med(a) { const b = a.filter(v => v != null && isFinite(v)).sort((x, y) => x - y); return b.length ? b[Math.floor(b.length / 2)] : null; }
function _range(a) { const b = a.filter(v => v != null && isFinite(v)).sort((x, y) => x - y); return b.length ? [b[0], b[b.length - 1]] : null; }

function runAutoAudit() {
  const s = S.signal; if (!s) { S.auto = null; return null; }
  // Channel roles: a placement the user confirmed always wins. The waveform-based
  // identification only proposes; where it disagrees, the report says so.
  const chan = autoIdentifyChannels();
  let mapCheck = null;
  if (chan) {
    const diff = Object.keys(chan.mapping).filter(c => (S.mapping[c] || "OFF") !== chan.mapping[c]);
    if (S.mappingSource === "user") {
      mapCheck = { source: "user", agrees: !diff.length, suggested: chan.mapping, diff, doubts: chan.doubts };
      if (diff.length) logAudit("Channel check", "Your mapping differs from the waveform suggestion on " + diff.map(c => "CH" + (+c + 1)).join(", ") + " — your mapping kept");
    } else {
      S.mapping = chan.mapping; S.mappingSource = "auto";
      mapCheck = { source: "auto", agrees: true, suggested: chan.mapping, diff: [], doubts: chan.doubts };
    }
  }
  const arr = { smt: chArray("SMT"), mpc: chArray("MPC"), mpc2: chArray("MPC2"), spt: chArray("SPT") };
  if (!arr.smt) { S.auto = { error: "No short-milk-tube channel could be identified, so no milking can be located. Map the channels by hand on the Channels step." }; return S.auto; }

  const found = vdFindMilkings(arr.smt, s.fs, s.n);
  for (const m of found) if (!m.real && S.confirmedMilkings?.[m.att]) { m.real=true; m.operatorIncluded=true; }

  const real = found.filter(m => m.real);
  const rejected = found.filter(m => !m.real).map(m => ({ att: m.att, end: m.end, start: clockAt(m.att), seconds: m.seconds, dip: m.dip, why: m.why }));
  // periods the operator included against the rules keep their original rejection details, so the report can list the decision
  const included = found.filter(m => m.operatorIncluded).map(m => ({ att: m.att, end: m.end, start: clockAt(m.att), seconds: m.seconds, dip: m.dip, why: m.why || [] }));
  if (rejected.length) logAudit("Attachment periods not counted", rejected.length + ": " + rejected.map(r => r.start + " (" + r.why.join("; ") + ")").join(" | "));
  S.sessions = real.map((m, k) => ({ n: k + 1, i0: m.att, i1: m.end, m, seconds: tAt(m.end) - tAt(m.att), startClock: clockAt(m.att), endClock: clockAt(m.end) }));
  S.sessionIdx = clamp(S.sessionIdx || 0, 0, Math.max(0, real.length - 1));   // keep the milking being reviewed
  if (!real.length) { S.auto = { error: "No milking was found" + (rejected.length ? " — " + rejected.length + " attachment period" + (rejected.length > 1 ? "s were" : " was") + " found but failed the plausibility rules: " + rejected.map(r => r.start + ": " + r.why.join("; ")).join(" · ") + ". The rules can be changed under Thresholds." : ". Teat-end vacuum never rose above 25 kPa after the cluster had been off.") }; return S.auto; }

  const milkings = [];
  // markers the user moved by hand on this milking (keyed by the rule's attachment) go into the same engine
  real.forEach((m, k) => milkings.push(analyseMilkingVD(m, k, arr, s.fs, k ? real[k - 1] : null, (S.handMarkers || {})[m.att])));
  logAudit("Markers placed automatically", milkings.length + " milkings; automatic marker estimates use the implemented chapter 22 rules; " + milkings.filter(c=>c.hand && c.hand.length).length + " milkings have hand-adjusted markers, which take precedence" +
    (included.length ? "; " + included.length + " included by the operator against the detection rules (flagged for review)" : ""));
  const A = summariseAudit(milkings, chan ? chan.evidence : []);
  A.rejected = rejected; A.included = included; A.mapCheck = mapCheck;
  return A;
}

/* Herd figures, scorecards and verdict from analysed milkings. Split out so that
   entering cow numbers and milk yields re-judges without re-analysing the trace. */
function cyclicRangeDetail(milkings){
 const ranges=milkings.filter(c=>c.cvf&&Number.isFinite(c.cvf.max)&&Number.isFinite(c.cvf.min)).map(c=>c.cvf.max-c.cvf.min);
 return ranges.length ? "Cyclic fluctuation range: median "+fmt(_med(ranges),1)+" kPa ("+fmt(Math.min(...ranges),1)+"–"+fmt(Math.max(...ranges),1)+" kPa across measured milkings)." : "Cyclic fluctuation range not measured.";
}
function observedIncidentRate(o=S.observedIncidents){
 if(!o || !['slips','falloffs','milkings'].every(k=>Number.isSafeInteger(o[k])&&o[k]>=0) || o.milkings===0)return null;
 return 100*(o.slips+o.falloffs)/o.milkings;
}
function observedIncidentsPanel(){
 const panel=el('section',{class:'panel noprint'},[el('h2',{text:'Observed slips and fall-offs'}),el('p',{text:'Enter events you actually saw needing correction, and the cow-milkings you watched on this recording. Count each event once, as either a slip or a fall-off. Leave blank if not observed; enter 0 only when you watched and saw none.'})]);
 const signal=S.signal;

function channelSwing(arr, from, to, fs) {
  const secs = Math.floor((to - from) / fs); if (secs < 3) return 0;
  const out = [];
  for (let j = 0; j < secs; j++) {
    const a = from + j * fs, b = a + fs;
    out.push(_max(arr, a, b) - _min(arr, a, b));
  }
  out.sort((x, y) => x - y); return out[Math.floor(out.length / 2)];
}
function autoIdentifyChannels() {
  const s = S.signal; if (!s) return null;
  // stretches where something is clearly attached: the channel with the highest 90th percentile above 25 kPa
  const hi = s.ch.map(a => pct(a, 0.9, 0, s.n));
  const ref = s.ch[hi.indexOf(Math.max.apply(null, hi))];
  const starts = [];
  for (let i = 0; i < s.n; i += s.fs) if (ref[i] > 25 && (!starts.length || i - starts[starts.length - 1] > 300 * s.fs)) starts.push(i);
  if (!starts.length) starts.push(0);
  // up to three 2-minute windows spread over the recording, so one odd stretch cannot decide
  const wins = [starts[0], starts[Math.floor(starts.length / 2)], starts[starts.length - 1]].filter((v, k, a) => a.indexOf(v) === k)
    .map(i0 => [i0, Math.min(s.n, i0 + 120 * s.fs)]);
  const ev = s.ch.map((arr, c) => {
    const liveWins = wins.filter(([a, b]) => stats(arr, a, b).max > 3);
    const sw = (liveWins.length ? liveWins : wins).map(([a, b]) => channelSwing(arr, a, b, s.fs)).sort((x, y) => x - y);
    const st = stats(arr, wins[0][0], wins[0][1]);
    return { c, swing: sw[Math.floor(sw.length / 2)], swingAll: sw, mean: st.mean, max: st.max, liveAll: pct(arr, 0.98, 0, s.n), role: "OFF" };
  });
  const live = ev.filter(e => e.max > 3);
  const puls = live.filter(e => e.swing > 20).sort((a, b) => b.swing - a.swing);
  if (puls.length) puls[0].role = "SPT";
  const rest = live.filter(e => e.role === "OFF").sort((a, b) => b.mean - a.mean);
  if (rest.length) rest[0].role = "SMT";
  if (rest.length > 1) { rest[0].margin = rest[0].mean - rest[1].mean; rest[0].close = rest[0].margin / Math.max(1, rest[0].mean) < 0.15; }
  const others = rest.slice(1).sort((a, b) => a.c - b.c);
  if (others[0]) others[0].role = "MPC";
  if (others[1]) others[1].role = "MPC2";
  const mapping = {}; ev.forEach(e => { mapping[e.c] = e.role; });
  // reasons the guess should not be trusted without a person confirming it
  const doubts = [];
  if (!puls.length) doubts.push("no channel pulsates like a pulsation tube");
  if (puls.length > 1) doubts.push("more than one channel pulsates (CH" + puls.map(e => e.c + 1).join(", CH") + ")");
  ev.filter(e => e.role === "OFF" && e.liveAll > 3).forEach(e => doubts.push("CH" + (e.c + 1) + " carries vacuum but was left unassigned"));
  if (rest[0] && rest[0].close) doubts.push("teat-end and mouthpiece levels are close (" + fmt(rest[0].margin) + " kPa apart)");
  logAudit("Channels identified automatically", ev.map(e => "CH" + (e.c + 1) + "=" + e.role + " (swing " + fmt(e.swing) + ", mean " + fmt(e.mean) + " kPa)").join("; ") +
    (doubts.length ? " — needs confirmation: " + doubts.join("; ") : ""));
  return { mapping, evidence: ev, doubts };
}
