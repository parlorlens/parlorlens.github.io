<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
.report-choice{display:flex!important;align-items:flex-start;gap:10px;margin:10px 0;line-height:1.45;cursor:pointer}
input[type=checkbox],input[type=radio]{width:auto!important;flex:0 0 auto}
.report-choice input{margin:3px 0 0!important;min-height:0!important}.report-choice span{flex:1}
.setup-channel{display:grid;grid-template-columns:60px minmax(160px,1fr);align-items:center;gap:12px;margin:12px 0}
.report-actions{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0}.report-actions details{flex-basis:100%}

#shared-print-report{display:none}
@media print{
 body.printing-report > :not(#shared-print-report){display:none!important}
 body.printing-report > #shared-print-report{display:block!important}
 #shared-print-report .page-head,#shared-print-report .atabs,#shared-print-report .noprint{display:none!important}
 #shared-print-report .report{margin:0;padding:0}
 #shared-print-report img{max-width:100%}
 .page-head{display:none!important}
}

.visit-excluded{display:none!important}
/* text that replaces an on-screen control in print (and Word): the operator's decision next to its button */
.printonly{display:none}
@media print{
 .printonly{display:inline!important}
 /* wide report tables fit the printed width instead of being clipped by their scroll box */
 #shared-print-report .tablewrap{overflow:visible!important}
 #shared-print-report table{max-width:100%}
 #shared-print-report thead th{position:static; white-space:normal}
 #shared-print-report table.tbl-wide{font-size:7pt}
 #shared-print-report table.tbl-wide th,#shared-print-report table.tbl-wide td{padding:2px 3px}
 #shared-print-report table.tbl-wide thead th{font-size:6.3pt; letter-spacing:0; vertical-align:bottom}
 #shared-print-report table.tbl-wide .pill{font-size:6.3pt; padding:0 4px; gap:3px}
 #shared-print-report table.tbl-wide .pill::before{width:4px; height:4px}
 /* the cover keeps its own page; the first tab title after it flows on with the notes before it */
 #shared-print-report .atab-first > .atab-title{page-break-before:auto; break-before:auto}
}
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}
/* v28: readable navigation and accessible, print-ready visual summaries. */
.nav-done{margin-left:auto;font-size:13px}.railbtn .step{flex-shrink:0}
.railbtn:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.workflow-progress{display:flex;gap:10px;flex-wrap:wrap;list-style:none;padding:0;margin:0 0 22px}
.workflow-progress li{display:flex;gap:7px;align-items:center;padding:9px 12px;border:1px solid var(--line);border-radius:8px;color:var(--ink-2)}
.workflow-progress li.current{border-color:var(--accent);background:var(--accent-soft);color:var(--ink);font-weight:700}
.gauge-dashboard{background:#fff;color:#172b40}.gauge-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin:16px 0}
.result-gauge{padding:18px;border:1px solid #c5d2df;border-radius:12px;background:#f8fbfe;color:#172b40;min-width:0;break-inside:avoid}
.result-gauge h3{font-size:17px;color:#172b40;margin:0 0 8px}.gauge-number{font-size:28px;line-height:1.3;font-weight:750;color:#172b40;font-variant-numeric:tabular-nums}
.result-gauge p{color:#33485e}.result-gauge .gauge-status{font-weight:700;margin:6px 0}.result-gauge svg{width:100%;height:auto;max-height:74px;display:block}
.gauge-evidence{border-top:1px solid #c5d2df;margin-top:12px;padding-top:12px}.gauge-evidence summary{cursor:pointer;font-weight:650;color:#155a9f;min-height:32px}
.gauge-evidence[open]{grid-column:1/-1}.result-gauge:has(.gauge-evidence[open]){grid-column:1/-1}
.gauge-evidence table{color:#172b40;background:#fff}.gauge-evidence th{background:#e5eef6;color:#172b40}.gauge-evidence td{color:#172b40}
.phase-strip{display:flex;height:34px;border-radius:6px;overflow:hidden}.phase-strip span{display:flex;align-items:center;justify-content:center;color:#172b40;font-weight:700;min-width:24px}
.fig img{image-rendering:auto}.figlegend{font-size:13px}.figtitle{font-size:16px}
@media(max-width:700px){.gauge-grid{grid-template-columns:1fr}.workflow-progress{gap:5px}.workflow-progress li{padding:7px;font-size:12px}.gauge-number{font-size:25px}}
@media print{.gauge-grid{display:grid;grid-template-columns:1fr 1fr}.result-gauge{border-radius:4px;padding:12px}.gauge-dashboard,.result-gauge,.phase-strip{-webkit-print-color-adjust:exact;print-color-adjust:exact}}

</style>
<title>ParlorLens</title>
<style>
/* ============================================================================
   Parlor Vacuum Audit — design tokens
   Palette: instrument blue on cool paper. Channel series validated for CVD.
   ========================================================================== */
:root{
  --ground:#eef2f6;
  --surface:#ffffff;
  --surface-2:#f6f9fc;
  --surface-3:#e7edf3;
  --line:#ccd8e2;
  --line-soft:#e2eaf1;
  --ink:#0e1c2a;
  --ink-2:#3d5163;
  --ink-3:#6b7f91;
  --accent:#0b5fa5;
  --accent-deep:#073c68;
  --accent-soft:#e4eef7;
  --good:#12704f;
  --good-soft:#e0f0e8;
  --warn:#8a5a04;
  --warn-soft:#fbf0d9;
  --crit:#a62119;
  --crit-soft:#fbe6e4;
  --info-soft:#e8eef4;
  --ch1:#2266b8;
  --ch2:#cc4a08;
  --ch3:#009e87;
  --ch4:#8a3ffc;
  /* trace colours by channel role — VaDia Suite's defaults */
  --r-smt:#1a5fd4; --r-spt:#1d8c39; --r-mpc:#d3261c; --r-mpc2:#111111;
  --shadow:0 1px 2px rgba(14,28,42,.06), 0 6px 18px -8px rgba(14,28,42,.18);
  --radius:6px;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --body:"Source Sans 3",system-ui,-apple-system,Segoe UI,sans-serif;
  --display:"Archivo","Source Sans 3",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0c141c;
    --surface:#121d27;
    --surface-2:#18242f;
    --surface-3:#1f2e3b;
    --line:#2b3d4d;
    --line-soft:#223341;
    --ink:#e8eff5;
    --ink-2:#a9bccb;
    --ink-3:#7b8e9e;
    --accent:#63a8e6;
    --accent-deep:#9cc9f2;
    --accent-soft:#16293b;
    --good:#4fc79a;
    --good-soft:#12291f;
    --warn:#e0ab4c;
    --warn-soft:#2b220f;
    --crit:#f08a80;
    --crit-soft:#2e1614;
    --info-soft:#1b2732;
    --ch1:#5fa3e8;
    --ch2:#f2833f;
    --ch3:#2fc4ac;
    --ch4:#b98cff;
    --r-smt:#5c9dff; --r-spt:#4cc466; --r-mpc:#ff5d52; --r-mpc2:#e4e4e4;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -10px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --ground:#0c141c; --surface:#121d27; --surface-2:#18242f; --surface-3:#1f2e3b;
  --line:#2b3d4d; --line-soft:#223341; --ink:#e8eff5; --ink-2:#a9bccb; --ink-3:#7b8e9e;
  --accent:#63a8e6; --accent-deep:#9cc9f2; --accent-soft:#16293b;
  --good:#4fc79a; --good-soft:#12291f; --warn:#e0ab4c; --warn-soft:#2b220f;
  --crit:#f08a80; --crit-soft:#2e1614; --info-soft:#1b2732;
  --ch1:#5fa3e8; --ch2:#f2833f; --ch3:#2fc4ac; --ch4:#b98cff;
  --r-smt:#5c9dff; --r-spt:#4cc466; --r-mpc:#ff5d52; --r-mpc2:#e4e4e4;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -10px rgba(0,0,0,.6);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:var(--body); font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:var(--display); font-weight:600; margin:0; text-wrap:balance; letter-spacing:-.01em}
h1{font-size:1.15rem}
h2{font-size:1.25rem}
h3{font-size:1.02rem}
h4{font-size:.9rem}
p{margin:0 0 .7em}
a{color:var(--accent)}
code,.mono,.num{font-family:var(--mono); font-variant-numeric:tabular-nums}
.eyebrow{
  font-family:var(--display); font-size:.68rem; font-weight:600; letter-spacing:.09em;
  text-transform:uppercase; color:var(--ink-3);
}
hr{border:0;border-top:1px solid var(--line-soft);margin:18px 0}

/* ---------- app shell ---------- */
.topbar{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:40;
  display:flex; align-items:center; gap:12px; flex-wrap:wrap;
  padding:10px 16px; background:var(--surface); border-bottom:1px solid var(--line);
}
.brand{display:flex; align-items:baseline; gap:9px; margin-right:auto; min-width:0}
.brand .mark{
  font-family:var(--display); font-weight:700; font-size:.72rem; letter-spacing:.1em;
  color:var(--surface); background:var(--accent); padding:3px 7px; border-radius:3px;
}
.brand .sub{color:var(--ink-3); font-size:.8rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}

.shell > *{min-width:0}
.shell{display:grid; grid-template-columns:216px minmax(0,1fr); gap:0; align-items:start;
  background:linear-gradient(to right, var(--surface) 0 216px, var(--ground) 216px);}
.rail{
  position:sticky; top:calc(env(safe-area-inset-top,0px) + 53px);
  padding:16px 10px 40px; border-right:1px solid var(--line); background:var(--surface);
  min-height:calc(100vh - 53px);
}
.rail ol{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:2px}
.railbtn{
  display:flex; align-items:center; gap:9px; width:100%; text-align:left;
  padding:8px 10px; border-radius:var(--radius); border:1px solid transparent;
  background:none; color:var(--ink-2); font:inherit; font-size:.88rem; cursor:pointer;
}
.railbtn:hover{background:var(--surface-2); color:var(--ink)}
.railbtn[aria-current="true"]{background:var(--accent-soft); color:var(--accent-deep); border-color:var(--line-soft); font-weight:600}
.railbtn .step{
  font-family:var(--mono); font-size:.7rem; width:18px; height:18px; flex:none;
  display:grid; place-items:center; border-radius:3px; background:var(--surface-3); color:var(--ink-3);
}
.railbtn[aria-current="true"] .step{background:var(--accent); color:#fff}
.railbtn.done .step{background:var(--good-soft); color:var(--good)}
.rail-note{margin-top:18px; padding:10px; font-size:.76rem; color:var(--ink-3); border-top:1px solid var(--line-soft)}

main{padding:20px 16px 80px; min-width:0}
.wrap{max-width:1180px; margin:0 auto}
.page-head{margin-bottom:18px}
.page-head p{color:var(--ink-2); max-width:70ch; margin-top:4px}

/* ---------- panels ---------- */
.panel{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  padding:16px; margin-bottom:16px;
}
.panel > header{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; margin-bottom:12px}
.panel > header .hint{color:var(--ink-3); font-size:.82rem; margin-left:auto}
.grid{display:grid; gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.row{display:flex; gap:8px; flex-wrap:wrap; align-items:center}

/* ---------- controls ---------- */
label{display:block; font-size:.78rem; color:var(--ink-2); margin-bottom:3px; font-weight:600}
input,select,textarea{
  width:100%; padding:7px 9px; font:inherit; font-size:.88rem; color:var(--ink);
  background:var(--surface-2); border:1px solid var(--line); border-radius:4px;
}
input[type=number]{font-family:var(--mono)}
textarea{min-height:80px; resize:vertical; font-family:var(--mono); font-size:.8rem}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,[tabindex]:focus-visible{
  outline:2px solid var(--accent); outline-offset:1px;
}
.btn{
  display:inline-flex; align-items:center; gap:6px; padding:7px 13px; border-radius:4px;
  border:1px solid var(--line); background:var(--surface-2); color:var(--ink);
  font:inherit; font-size:.86rem; font-weight:600; cursor:pointer; white-space:nowrap;
}
.btn:hover{background:var(--surface-3)}
.btn.primary{background:var(--accent); border-color:var(--accent); color:#fff}
.btn.primary:hover{background:var(--accent-deep); border-color:var(--accent-deep)}
.btn.ghost{background:none}
.btn:disabled{opacity:.45; cursor:not-allowed}
.btn.sm{padding:4px 9px; font-size:.78rem}
.seg{display:inline-flex; border:1px solid var(--line); border-radius:4px; overflow:hidden}
.seg button{
  padding:6px 11px; border:0; background:var(--surface-2); color:var(--ink-2);
  font:inherit; font-size:.82rem; font-weight:600; cursor:pointer;
}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent); color:#fff}

/* ---------- tables ---------- */
.tablewrap{overflow-x:auto; border:1px solid var(--line); border-radius:var(--radius)}
table{border-collapse:collapse; width:100%; font-size:.84rem}
th,td{padding:7px 10px; text-align:left; border-bottom:1px solid var(--line-soft); white-space:nowrap}
thead th{
  background:var(--surface-2); font-family:var(--display); font-size:.72rem; font-weight:600;
  letter-spacing:.04em; text-transform:uppercase; color:var(--ink-3); position:sticky; top:0;
}
tbody tr:last-child td{border-bottom:0}
tbody tr.avg{background:var(--surface-2); font-weight:600}
td.n,th.n{text-align:right; font-family:var(--mono); font-variant-numeric:tabular-nums}

/* ---------- status ---------- */
.pill{
  display:inline-flex; align-items:center; gap:5px; padding:2px 8px; border-radius:999px;
  font-size:.72rem; font-weight:600; font-family:var(--display); letter-spacing:.02em;
  border:1px solid transparent; white-space:nowrap;
}
.pill::before{content:""; width:6px; height:6px; border-radius:50%; background:currentColor; flex:none}
.pill.ok{background:var(--good-soft); color:var(--good)}
.pill.warn{background:var(--warn-soft); color:var(--warn)}
.pill.crit{background:var(--crit-soft); color:var(--crit)}
.pill.na{background:var(--info-soft); color:var(--ink-3)}
.pill.flat::before{display:none}

.tile{
  background:var(--surface-2); border:1px solid var(--line-soft); border-radius:var(--radius);
  padding:11px 13px; display:flex; flex-direction:column; gap:3px;
}
.tile .k{font-size:.72rem; color:var(--ink-3); font-weight:600; letter-spacing:.03em; text-transform:uppercase; font-family:var(--display)}
.tile .v{font-family:var(--mono); font-size:1.4rem; font-weight:600; line-height:1.1; font-variant-numeric:tabular-nums}
.tile .u{font-size:.78rem; color:var(--ink-3)}
.tile.ok{border-left:3px solid var(--good)}
.tile.warn{border-left:3px solid var(--warn)}
.tile.crit{border-left:3px solid var(--crit)}
.tile.na{border-left:3px solid var(--line)}

.note{
  border-left:3px solid var(--accent); background:var(--accent-soft); padding:10px 12px;
  border-radius:0 4px 4px 0; font-size:.85rem; color:var(--ink-2);
}
.note.warn{border-color:var(--warn); background:var(--warn-soft)}
.note.crit{border-color:var(--crit); background:var(--crit-soft)}
.note strong{color:var(--ink)}

/* ---------- drop zone ---------- */
.drop{
  border:2px dashed var(--line); border-radius:var(--radius); padding:30px 18px; text-align:center;
  background:var(--surface-2); cursor:pointer; transition:border-color .12s, background .12s;
}
.drop:hover,.drop.over{border-color:var(--accent); background:var(--accent-soft)}
.drop .big{font-family:var(--display); font-weight:600; font-size:1.02rem; margin-bottom:4px}
.drop .small{color:var(--ink-3); font-size:.82rem}

/* ---------- charts ---------- */
.chartbox{
  position:relative; border:1px solid var(--line); border-radius:var(--radius);
  background:var(--surface); overflow:hidden;
}
.chartbox canvas{display:block; width:100%; touch-action:none}
.legend{display:flex; gap:14px; flex-wrap:wrap; padding:8px 12px; border-top:1px solid var(--line-soft); font-size:.8rem}
.legend button{
  display:inline-flex; align-items:center; gap:6px; background:none; border:0; padding:0;
  font:inherit; font-size:.8rem; color:var(--ink-2); cursor:pointer;
}
.legend button[aria-pressed="false"]{opacity:.38; text-decoration:line-through}
.legend .chan{display:inline-flex; align-items:center; gap:2px}
.legend .only{font-size:.72rem; padding:1px 6px; border:1px solid var(--line); border-radius:10px; color:var(--ink-3); background:none; cursor:pointer; text-decoration:none!important; opacity:1!important}
.legend .only:hover{color:var(--accent); border-color:var(--accent)}
.legend .seg{display:inline-flex; border:1px solid var(--line); border-radius:5px; overflow:hidden}
.legend .seg button{border:0; border-radius:0; padding:3px 10px; background:none; color:var(--ink-2); text-decoration:none!important; opacity:1!important}
.legend .seg button[aria-pressed="true"]{background:var(--accent); color:#fff}
.swatch{width:11px; height:3px; border-radius:2px; flex:none}
.tooltip{
  position:absolute; pointer-events:none; z-index:5; background:var(--surface);
  border:1px solid var(--line); border-radius:4px; box-shadow:var(--shadow);
  padding:7px 9px; font-size:.78rem; font-family:var(--mono); white-space:nowrap;
}
.tooltip .tt-t{font-family:var(--display); font-size:.72rem; color:var(--ink-3); margin-bottom:4px}
.tooltip .tt-r{display:flex; gap:8px; align-items:center; justify-content:space-between}

/* ---------- finding cards ---------- */
.finding{border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; margin-bottom:10px; background:var(--surface)}
.finding > .fh{
  display:flex; gap:10px; align-items:flex-start; padding:11px 13px; background:var(--surface-2);
  border-bottom:1px solid var(--line-soft);
}
.finding > .fh .ft{flex:1; min-width:0}
.finding > .fh h4{margin-bottom:2px}
.finding > .fh .fv{font-family:var(--mono); font-size:1.02rem; font-weight:600}
.finding .fb{padding:11px 13px; font-size:.85rem; color:var(--ink-2)}
.finding .fb p:last-child{margin-bottom:0}
.audit{
  display:grid; grid-template-columns:auto 1fr; gap:3px 12px; font-size:.76rem;
  padding:10px 13px; border-top:1px dashed var(--line); background:var(--surface-2); color:var(--ink-2);
}
.audit dt{font-weight:600; color:var(--ink-3); font-family:var(--display); letter-spacing:.02em}
.audit dd{margin:0; font-family:var(--mono); font-size:.74rem; word-break:break-word; white-space:normal}

.src{font-size:.72rem; color:var(--ink-3); font-style:italic}
.userdef{color:var(--warn); font-weight:600; font-size:.72rem}

/* ---------- report ---------- */
.report{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:0}
.rsec{padding:22px 26px; border-bottom:1px solid var(--line-soft)}
.rsec:last-child{border-bottom:0}
.rsec > .eyebrow{display:block; margin-bottom:6px}
.rsec h2{margin-bottom:10px}
.cover{background:linear-gradient(160deg,var(--accent-deep),var(--accent)); color:#fff; padding:36px 26px}
.cover h2{color:#fff; font-size:1.9rem; margin-bottom:6px}
.cover .ctag{opacity:.85; font-size:.88rem}
.cover dl{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin:22px 0 0}
.cover dt{font-size:.68rem; text-transform:uppercase; letter-spacing:.09em; opacity:.8; font-family:var(--display)}
.cover dd{margin:2px 0 0; font-size:.95rem; font-weight:600}
.kvlist{display:grid; grid-template-columns:repeat(auto-fit,minmax(215px,1fr)); gap:9px 18px}
.kv{display:flex; justify-content:space-between; gap:10px; border-bottom:1px dotted var(--line); padding-bottom:3px; font-size:.84rem}
.kv .kk{color:var(--ink-3)}
.kv .vv{font-family:var(--mono); font-weight:600; text-align:right}

.summary-sheet{border:1px solid var(--line); border-radius:var(--radius); background:var(--surface); padding:26px}
.summary-sheet[dir="rtl"]{text-align:right}
.verdict{display:flex; gap:14px; align-items:center; padding:14px 16px; border-radius:var(--radius); margin:14px 0 18px}
.verdict.ok{background:var(--good-soft)} .verdict.warn{background:var(--warn-soft)} .verdict.crit{background:var(--crit-soft)}
.verdict .lamp{width:32px; height:32px; border-radius:50%; flex:none}
.verdict.ok .lamp{background:var(--good)} .verdict.warn .lamp{background:var(--warn)} .verdict.crit .lamp{background:var(--crit)}
.verdict .vt{font-family:var(--display); font-weight:700; font-size:1.1rem}
.actions-list{counter-reset:a; list-style:none; padding:0; margin:0; display:flex; flex-direction:column; gap:10px}
.actions-list li{
  counter-increment:a; display:grid; grid-template-columns:26px 1fr; gap:11px;
  padding:11px 13px; border:1px solid var(--line); border-radius:var(--radius); background:var(--surface-2);
}
.actions-list li::before{
  content:counter(a); font-family:var(--mono); font-weight:600; color:#fff; background:var(--accent);
  width:22px; height:22px; border-radius:50%; display:grid; place-items:center; font-size:.76rem;
}
.summary-sheet[dir="rtl"] .actions-list li{grid-template-columns:1fr 26px; direction:rtl}

.muted{color:var(--ink-3)}

}

<script>
/* ==========================================================================
   Parlor Vacuum Audit
   Offline analyser for BioControl VaDia / VaDia 2 milking-parlor vacuum data.
   Everything runs in the browser. No file ever leaves this machine.
   ========================================================================== */
"use strict";

/* ---------------------------------------------------------------- utilities */
const $  = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const el = (tag, attrs, kids) => {
  const n = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    if (k === "class") n.className = attrs[k];
    else if (k === "html") n.innerHTML = attrs[k];
    else if (k === "text") n.textContent = attrs[k];
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), attrs[k]);
    else if (["disabled","checked","selected","multiple","required","readonly","open","hidden"].includes(k)) { if(attrs[k])n.setAttribute(k, ""); }
    else if (attrs[k] !== null && attrs[k] !== undefined) n.setAttribute(k, attrs[k]);
  }
  if (kids) (Array.isArray(kids) ? kids : [kids]).forEach(c => c && n.append(c));
  return n;
};
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = (v, d) => (v === null || v === undefined || !isFinite(v)) ? "—" : Number(v).toFixed(d === undefined ? 1 : d);
const pad2 = n => String(n).padStart(2, "0");
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

/** seconds -> m:ss (or h:mm:ss beyond an hour) */
function hms(sec) {
  if (sec == null || !isFinite(sec)) return "—";
  const neg = sec < 0; sec = Math.abs(sec);
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = Math.floor(sec % 60);
  return (neg ? "-" : "") + (h ? h + ":" + pad2(m) : m) + ":" + pad2(s);
}
const clockOf = d => d ? pad2(d.getHours()) + ":" + pad2(d.getMinutes()) + ":" + pad2(d.getSeconds()) : "—";
const dateOf  = d => d ? d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()) : "—";
const stamp   = d => d ? dateOf(d) + " " + clockOf(d) : "—";

/** Percentile of a Float32Array-like, p in 0..1. Uses a sampled copy for big arrays. */
function pct(arr, p, from, to) {
  from = from || 0; to = (to === undefined ? arr.length : to);
  const n = to - from; if (n <= 0) return NaN;
  const step = Math.max(1, Math.floor(n / 40000));
  const out = [];
  for (let i = from; i < to; i += step) { const v = arr[i]; if (isFinite(v)) out.push(v); }
  if (!out.length) return NaN;
  out.sort((a, b) => a - b);
  return out[clamp(Math.round(p * (out.length - 1)), 0, out.length - 1)];
}
/** single-pass stats — never use spread on long arrays */
function stats(arr, from, to) {
  from = from || 0; to = (to === undefined ? arr.length : to);
  let mn = Infinity, mx = -Infinity, sum = 0, sum2 = 0, n = 0;
  for (let i = from; i < to; i++) {
    const v = arr[i]; if (!isFinite(v)) continue;
    if (v < mn) mn = v; if (v > mx) mx = v; sum += v; sum2 += v * v; n++;
  }
  if (!n) return { n: 0, min: NaN, max: NaN, mean: NaN, sd: NaN };
  const mean = sum / n;
  return { n, min: mn, max: mx, mean, sd: Math.sqrt(Math.max(0, sum2 / n - mean * mean)) };
}

/* ------------------------------------------------------------- audit trail */
const AUDIT = [];
function logAudit(step, detail) {
  AUDIT.push({ t: new Date(), step, detail });
  return detail;
}

/* --------------------------------------------------------- threshold model
   Every threshold carries its own provenance. Nothing is asserted as
   universal. Two presets ship because the two documented sources available
   on this installation disagree on pulsation phase targets — the app shows
   that disagreement instead of silently picking one.
   -------------------------------------------------------------------------- */
const SRC = {
  SUITE : "VaDia Suite default (BioControl) — CustomerSetting / Settings values as configured in this installation",
  GUIDE : "Mastering Wet Testing with VaDia 2 — Appendix A/B (Recommended Vacuum Ranges; Pulsation Phase Definitions)",
  ISO6690: "ISO 6690 / ISO 3918 — pulsation phase reference levels",
  ISO5707: "ISO 5707 — vacuum recovery after cluster fall-off; minimum d-phase duration",
  NONE  : null
};

/** definition: id, label, unit, group, presets{suite,guide}, source, notes */
const THRESH_DEFS = [
  // --- milking-time test ---------------------------------------------------
  { id:"smtPF_min", g:"mtt", label:"SMT vacuum during peak flow — lower limit", u:"kPa", suite:36, guide:36, src:SRC.GUIDE },
  { id:"smtPF_max", g:"mtt", label:"SMT vacuum during peak flow — upper limit", u:"kPa", suite:42, guide:42, src:SRC.GUIDE },
  { id:"overmilk_warn", g:"mtt", label:"Overmilking duration — target maximum", u:"s", suite:60, guide:60, src:SRC.GUIDE },
  { id:"overmilk_crit", g:"mtt", label:"Overmilking duration — action level", u:"s", suite:90, guide:90, src:SRC.GUIDE },
  { id:"cvf_warn", g:"mtt", label:"Cyclic vacuum fluctuation — peak-to-peak tolerance", u:"kPa", suite:4.0, guide:4.0, src:SRC.GUIDE,
    note:"The guide gives ±1.5–2.0 kPa. Read as a deviation either side of the mean, that is 3.0–4.0 kPa peak to peak, which is the figure this app measures. Checked against nine cows on a real VaDia recording, per-cycle peak-to-peak ran 2.6–5.6 kPa with a mean of 3.2 — consistent with the ± reading. If your reference means 2.0 kPa peak to peak, halve these two values." },
  { id:"cvf_crit", g:"mtt", label:"Cyclic vacuum fluctuation — peak-to-peak action level", u:"kPa", suite:5.0, guide:5.0, src:SRC.GUIDE },
  { id:"mpcFav_lo", g:"mtt", label:"MPC favourable band — lower bound", u:"kPa", suite:10, guide:10, src:SRC.SUITE },
  { id:"mpcFav_hi", g:"mtt", label:"MPC favourable band — upper bound", u:"kPa", suite:30, guide:30, src:SRC.SUITE },
  { id:"mpcFav_pct", g:"mtt", label:"Time inside MPC favourable band — target", u:"%", suite:80, guide:80, src:SRC.GUIDE },
  { id:"mpcFav_pct_crit", g:"mtt", label:"Time inside MPC favourable band — action level", u:"%", suite:70, guide:70, src:SRC.GUIDE },
  { id:"milking_min_s", g:"mtt", label:"A milking must last at least", u:"s", suite:45, guide:45, src:SRC.NONE,
    note:"ParlorLens plausibility rule, not a published value. Attachment periods that fail it are listed in the Every milking tab, not dropped silently." },
  { id:"milking_min_dip", g:"mtt", label:"A milking must show a teat-end vacuum dip of at least", u:"kPa", suite:1.5, guide:1.5, src:SRC.NONE,
    note:"ParlorLens plausibility rule, not a published value: a small dip is not proof that no milk flowed; confirm the period against cow notes. Failing periods are listed, not dropped silently." },
  { id:"reattach_gap_s", g:"mtt", label:"Gap after the previous milking that flags a possible re-attachment", u:"s", suite:30, guide:30, src:SRC.NONE,
    note:"ParlorLens working rule, not a published value. A milking that starts within this gap of the previous one is flagged for a check against cow notes and listed as suspected only, separately from vacuum-drop events; it never moves a marker or confirms a fall-off." },
  { id:"letdown_slow_gap", g:"mtt", label:"Slow let-down — list a milking this much longer than the unit's median let-down", u:"s", suite:30, guide:30, src:SRC.NONE,
    note:"ParlorLens working rule, not a published value (in use since v30). It only lists milkings for a closer look — in the let-down card, the preparation and bimodal sections and the cow-by-cow notes — and gives no verdict. Clear it to switch the listing off." },
  { id:"unitOn_min", g:"mtt", label:"Unit-on time — lower end of the typical range", u:"s", suite:210, guide:210, src:"Penn State Extension — Seconds do matter in your milking routine (3.5–5 min)" },
  { id:"unitOn_max", g:"mtt", label:"Unit-on time — upper end of the typical range", u:"s", suite:300, guide:300, src:"Penn State Extension — Seconds do matter in your milking routine (3.5–5 min)" },
  { id:"slips_per100", g:"mtt", label:"Slips and fall-offs per 100 cow-milkings — problem above", u:"per 100", suite:5, guide:5, src:"Mein & Reid 1996, via DAIReXNET (5–10 per 100)" },
  { id:"ivf1_max", g:"mtt", label:"Irregular fluctuations type 1 per milking — upper normal", u:"per milking", suite:1, guide:1, src:SRC.GUIDE },
  { id:"ivf1_crit", g:"mtt", label:"Irregular fluctuations type 1 per milking — major liner slip above", u:"per milking", suite:2, guide:2, src:SRC.GUIDE },
  { id:"ivf2_max", g:"mtt", label:"Irregular fluctuations type 2 per milking — upper normal", u:"per milking", suite:2, guide:2, src:SRC.GUIDE },
  { id:"ivf_drop", g:"mtt", label:"Irregular vacuum fluctuation — drop magnitude", u:"kPa", suite:null, guide:null, src:SRC.NONE,
    note:"No documented value available. Set from your own reference before event counts are reported." },
  { id:"ivf_ms", g:"mtt", label:"Irregular vacuum fluctuation — minimum duration", u:"ms", suite:null, guide:null, src:SRC.NONE,
    note:"No documented value available." },
  { id:"bimodal_drop", g:"mtt", label:"Bimodal letdown — early vacuum recovery magnitude", u:"kPa", suite:null, guide:null, src:SRC.NONE,
    note:"No documented vacuum-only threshold. Bimodality is defined on milk flow; vacuum is indicative only." },
  { id:"bimodal_win", g:"mtt", label:"Bimodal letdown — search window after attachment", u:"s", suite:120, guide:120, src:SRC.NONE,
    note:"Search window only — not a diagnostic threshold." },

  // --- pulsation -----------------------------------------------------------
  { id:"puls_ref", g:"puls", label:"Phase reference level (from minimum / below maximum)", u:"kPa", suite:4, guide:4, src:SRC.ISO6690 },
  { id:"a_target", g:"puls", label:"a-phase (liner opening) target", u:"ms", suite:100, guide:175, src:SRC.SUITE,
    note:"VaDia Suite default is 100 ms; the VaDia 2 guide, Appendix B gives 150–200 ms. Presets differ — choose deliberately." },
  { id:"a_tol", g:"puls", label:"a-phase tolerance", u:"ms", suite:10, guide:25, src:SRC.SUITE },
  { id:"b_target", g:"puls", label:"b-phase (milk flow) target", u:"ms", suite:500, guide:475, src:SRC.SUITE },
  { id:"b_tol", g:"puls", label:"b-phase tolerance", u:"ms", suite:50, guide:75, src:SRC.SUITE },
  { id:"c_target", g:"puls", label:"c-phase (liner closing) target", u:"ms", suite:100, guide:175, src:SRC.SUITE },
  { id:"c_tol", g:"puls", label:"c-phase tolerance", u:"ms", suite:10, guide:25, src:SRC.SUITE },
  { id:"d_target", g:"puls", label:"d-phase (massage / rest) target", u:"ms", suite:300, guide:250, src:SRC.SUITE },
  { id:"d_tol", g:"puls", label:"d-phase tolerance", u:"ms", suite:30, guide:100, src:SRC.SUITE },
  { id:"d_min", g:"puls", label:"d-phase absolute minimum", u:"ms", suite:150, guide:150, src:SRC.ISO5707 },
  { id:"rate_target", g:"puls", label:"Pulsation rate target", u:"cycles/min", suite:60, guide:60, src:SRC.SUITE },
  { id:"rate_tol", g:"puls", label:"Pulsation rate tolerance", u:"cycles/min", suite:3, guide:5, src:SRC.SUITE },
  { id:"ratio_target", g:"puls", label:"Pulsator ratio — milk phase share", u:"%", suite:60, guide:60, src:SRC.SUITE },
  { id:"ratio_tol", g:"puls", label:"Pulsator ratio tolerance", u:"%", suite:3, guide:5, src:SRC.SUITE },
  { id:"vmax_target", g:"puls", label:"Pulsation chamber maximum vacuum target", u:"kPa", suite:42, guide:42, src:SRC.SUITE },
  { id:"vmax_tol", g:"puls", label:"Pulsation chamber maximum vacuum tolerance", u:"kPa", suite:2.1, guide:2.1, src:SRC.SUITE },
  { id:"limp_max", g:"puls", label:"Alternate-cycle asymmetry (limping) limit", u:"%", suite:2, guide:5, src:SRC.SUITE,
    note:"VaDia Suite default 2 %; the VaDia 2 guide gives <5 %. True ISO limping compares both pulsation sides — see the pulsation section." },
  { id:"dip_max", g:"puls", label:"b-phase dip limit", u:"kPa", suite:4, guide:4, src:SRC.GUIDE },
  { id:"open_min", g:"puls", label:"Liner open time — lower limit", u:"ms", suite:450, guide:450, src:SRC.GUIDE },
  { id:"open_max", g:"puls", label:"Liner open time — upper limit", u:"ms", suite:600, guide:600, src:SRC.GUIDE },

  // --- fall-off / slug / resistance ---------------------------------------
  { id:"fot_band", g:"other", label:"Fall-off test — vacuum stability band", u:"kPa", suite:0.35, guide:0.35, src:SRC.SUITE },
  { id:"fot_recover", g:"other", label:"Fall-off test — recovery time limit", u:"s", suite:null, guide:null, src:SRC.NONE,
    note:"ISO 5707 sets the framework; enter the limit that applies to the installation and class of system being tested." },
  { id:"fot_drop_max", g:"other", label:"Fall-off test — permissible vacuum drop", u:"kPa", suite:null, guide:null, src:SRC.NONE },
  { id:"slug_distance", g:"other", label:"Slug test — distance between the two test ports (measured on site)", u:"m", suite:null, guide:null, src:SRC.NONE,
    note:"A site measurement, not a setting. VaDia Suite's field is pre-filled with 164.04 ft (50 m) — a placeholder. The manual asks for ports at least 30 ft (≈ 9 m) apart." },
  { id:"slug_diam", g:"other", label:"Slug test — milkline internal diameter", u:"mm", suite:null, guide:null, src:SRC.NONE,
    note:"Recorded with the test; no result in ParlorLens depends on it." },
  { id:"slug_vel_min", g:"other", label:"Slug test — slug velocity, lower end", u:"m/s", suite:7, guide:7, src:"VaDia Suite User Manual v3.7, ch. 19 (p. 56): the velocity of the slug should be 7–10 m/s (23–33 ft/s)" },
  { id:"slug_vel_max", g:"other", label:"Slug test — slug velocity, upper end", u:"m/s", suite:10, guide:10, src:"VaDia Suite User Manual v3.7, ch. 19 (p. 56): the velocity of the slug should be 7–10 m/s (23–33 ft/s)" },
  { id:"mfr_drop_max", g:"other", label:"Milk-flow resistance — permissible drop per section", u:"kPa", suite:null, guide:null, src:SRC.NONE }
];

/* --------------------------------------------------------------- app state */
const S = {
  view: "conclusion",
  preset: "suite",
  thresh: {},
  meta: {},
  signal: null,      // { fs, t0, ch:[Float32Array x4], n, blocks, gaps, unit }
  mapping: { 0:"SPT", 1:"SMT", 2:"MPC", 3:"MPC2" },
  source: null,      // { name, bytes, kind, checks[], notes[] }
  tables: null,      // { kind:'mtt'|'pt'|'mpe', cols, rows, avg }
  markers: {},       // { attach, peakStart, overmilkStart, takeoff, end } in sample index
  auto: null,        // automatic audit result
  sessions: [],      // detected milkings within the recording
  sessionIdx: 0,
  view_range: null,  // [i0,i1]
  results: null,
  consent: false,
  cowInfo: { unit: "L", rows: {} },   // per-milking cow number and milk yield, keyed by attachment clock time
  visible: [true, true, true, true],
  teach: false,
  owner: null, partsMap: null, linerLife: null,   // report owner, product map, liner service life
  history: [], baselineId: null,
  testType: "MTT",          // which VaDia test the Report page shows: MTT | PT | FOT | MPE | ST | MRT
  testWins: {}, testSel: {},
  omRule: "rise",            // which qualifying overmilking change to use: "rise" | "strongest" | "first" | "last"
  handMarkers: {},       // markers moved by hand, per milking (key: the rule's attachment index)
  reviewed: {},          // milkings whose trace the operator has checked (key: attachment clock)
  mappingSource: "default",  // "default" | "auto" (waveform guess) | "user" (confirmed placement)      // visit history, before/after baseline, parlor units             // teaching mode: references, colour zones, explanations
  chartLayout: "overlay"   // "overlay" | "split" — trace charts, one plot or one lane per channel
};
const CHCOL = ["--ch1", "--ch2", "--ch3", "--ch4"];
/* Trace colour follows the channel's role, as in VaDia Suite: SMT blue, SPT green,
   MPC red, MPC2 black (drawn light grey on the dark theme so it stays visible).
   Channels with any other role keep their input colour. */
const ROLE_COL = { SMT: "--r-smt", SPT: "--r-spt", MPC: "--r-mpc", MPC2: "--r-mpc2" };
function chColVar(c) { return ROLE_COL[S.mapping[c]] || CHCOL[c]; }
const ROLES = [
  ["SPT","Short pulsation tube (pulsator)"],
  ["SMT","Short milk tube (teat-end vacuum)"],
  ["MPC","Mouthpiece chamber"],
  ["MPC2","Mouthpiece chamber — second teat"],
  ["LMC","Long milk tube, claw end"],
  ["LMS","Long milk tube, system end"],
  ["ML","Milkline"],
  ["RCV","Receiver / system vacuum"],
  ["OFF","Not connected / ignore"]
];
const roleLabel = r => (ROLES.find(x => x[0] === r) || [r, r])[1];

function applyPreset(name) {
  S.preset = name;
  THRESH_DEFS.forEach(d => { S.thresh[d.id] = (name === "guide" ? d.guide : d.suite); });
  logAudit("Threshold preset applied", name === "guide"
    ? "VaDia 2 wet-testing guide (Appendix A/B)"
    : "VaDia Suite defaults as configured on this installation");
}
/** "4 of 4 structural checks passed" — counts checks, it is not an accuracy figure */
function checksLabel(src) {
  if (!src || !src.checks) return "—";
  const n = src.checks.length, k = src.checks.filter(c => c.pass).length;
  return k + " of " + n + " structural checks passed";
}
/** Thresholds saved by an earlier version (browser storage, visit project) lack the ids added since.
    Fill only the missing ids with the value of the preset in use, so a new working rule is not silently
    switched off; a value the operator cleared (null) is kept. Returns "label = value unit" for each one filled. */
function fillMissingThresholds(thresh, preset) {
  const added = [];
  if (!thresh || typeof thresh !== "object") return added;
  THRESH_DEFS.forEach(d => {
    if (Object.prototype.hasOwnProperty.call(thresh, d.id)) return;
    thresh[d.id] = preset === "guide" ? d.guide : d.suite;
    added.push(d.label + " = " + (thresh[d.id] == null ? "not set" : thresh[d.id] + " " + d.u));
  });
  return added;
}
function T(id) { const v = S.thresh[id]; return (v === null || v === undefined || v === "") ? null : Number(v); }
function threshDef(id) { return THRESH_DEFS.find(d => d.id === id); }
function threshSrc(id) {
  const d = threshDef(id), v = T(id);
  if (v === null) return "not set";
  const preset = S.preset === "guide" ? "guide preset" : "VaDia Suite preset";
  const changed = S.preset === "guide" ? d.guide : d.suite;
  const isUser = Number(changed) !== Number(v);
  if (isUser) return "User-defined threshold — not universal";
  if (!d.src) return "ParlorLens rule — not a published value";
  return d.src === SRC.SUITE || d.src === SRC.GUIDE ? d.src + " (" + preset + ")" : d.src;
}

/* ==========================================================================
   FILE PARSERS
   --------------------------------------------------------------------------
   .vd6  — BioControl VaDia binary log. BioControl does not publish this
           format. The layout below was reverse-engineered from recordings made
           on this installation. It is NOT a validated schema; what supports it:

     Framing   8-byte frames: 1 data byte, 1 control byte (bit 7 always set),
               6 data bytes. The control byte's bits 0–5 flag the 6 data bytes
               that follow it in the same frame, bit 6 flags the first byte of
               the next frame. A flagged byte is stored as 0x55 and stands for
               0x1A — 0x1A is reserved for the start of a block header.
               Evidence: every flagged byte in the test files is 0x55 (4 647 and
               4 002 of them); un-escaping them makes every block header valid
               (105 and 56 headers were unreadable before) and removes 1 408 and
               1 208 single-sample jumps of exactly 5.9 kPa (0x55 − 0x1A = 59
               raw units).
     Blocks    after removing control bytes: 13-byte header (1A 50 06 01, rate,
               flag, year LE16, month, day, hour, minute, second), rate × 4
               channels × int16 LE samples, 4-byte trailer. The trailer's meaning
               is NOT established — it is not a CRC-32 (five common variants
               tried) or a simple sum — so it is not checked.
     Scaling   raw / 10 = kPa. Supported indirectly: using VaDia Suite's own
               markers, means of the decoded samples reproduce its stored
               teat-end and mouthpiece averages to 0.01–0.06 kPa (worst 0.12)
               and its favourable-time % to 0.17 points, on 9 test milkings.
               A sample-by-sample comparison against a raw export of the same
               file has not been possible.

   Every check below is a gate: a file that fails one is refused, not shown
   with a warning. Passing the checks shows the file has the expected
   structure; it does not prove the conversion is right.
   ========================================================================== */

const VD6 = {
  SIG: [0x1a, 0x50, 0x06, 0x01],   // block header signature
  HDR: 13,                          // signature(4) + rate(1) + flag(1) + year(2) + month, day, hour, minute, second
  TRAILER: 4,                       // per-block trailer — purpose not established, not verified
  SCALE: 10,                        // raw int16 / 10 => kPa
  ESC_STORED: 0x55, ESC_MEANS: 0x1a // escaped byte as stored, and what it stands for
};

function parseVD6(buffer, fileName) {
  const raw = new Uint8Array(buffer);
  const notes = [], checks = [];
  const refuse = msg => { throw new Error(msg + " This file is not shown — open it in VaDia Suite instead."); };
  if (raw.length < 2048) throw new Error("File is too small to be a VaDia recording.");
  const nFrames = Math.floor(raw.length / 8);
  const tail = raw.length - nFrames * 8;

  /* --- 1. frame sync: control byte with bit 7 set in every frame -------- */
  let sync = 0;
  for (let f = 0; f < nFrames; f++) if (raw[f * 8 + 1] & 0x80) sync++;
  checks.push({ name: "Frame synchronisation", value: sync + " of " + nFrames + " frames",
    pass: sync === nFrames, detail: "Control byte with bit 7 set at offset 1 of every 8-byte frame" });
  if (sync !== nFrames) refuse("Frame synchronisation failed in " + (nFrames - sync) + " of " + nFrames + " frames.");

  /* --- 2. un-escape: flagged bytes stored as 0x55 stand for 0x1A --------- */
  const u8 = raw.slice(0, nFrames * 8);
  let flagged = 0, badFlag = 0;
  for (let f = 0; f < nFrames; f++) {
    const c = u8[f * 8 + 1];
    for (let bit = 0; bit < 7; bit++) {
      if (!((c >> bit) & 1)) continue;
      const idx = bit < 6 ? f * 8 + 2 + bit : f * 8 + 8;
      if (idx >= u8.length) continue;
      flagged++;
      if (u8[idx] !== VD6.ESC_STORED) badFlag++;
      else u8[idx] = VD6.ESC_MEANS;
    }
  }
  checks.push({ name: "Byte escaping", value: flagged + " escaped bytes" + (badFlag ? ", " + badFlag + " inconsistent" : ""),
    pass: badFlag === 0, detail: "Every byte flagged in a control byte must be stored as 0x55 (standing for 0x1A)" });
  if (badFlag) refuse(badFlag + " flagged bytes are not stored the way this reader expects — an unknown variant of the format.");

  /* --- 3. strip control bytes ------------------------------------------- */
  const D = new Uint8Array(nFrames * 7);
  let p = 0;
  for (let f = 0; f < nFrames; f++) {
    const o = f * 8;
    D[p] = u8[o]; D[p+1] = u8[o+2]; D[p+2] = u8[o+3]; D[p+3] = u8[o+4];
    D[p+4] = u8[o+5]; D[p+5] = u8[o+6]; D[p+6] = u8[o+7]; p += 7;
  }
  const dv = new DataView(D.buffer, D.byteOffset, D.byteLength);

  /* --- 4. walk the blocks strictly, one after another from the start ---- */
  const blocks = [];
  let off = 0, fs = 0, rateMismatch = 0, badHeader = 0;
  while (off + VD6.HDR <= D.length) {
    const sigOK = D[off] === VD6.SIG[0] && D[off+1] === VD6.SIG[1] && D[off+2] === VD6.SIG[2] && D[off+3] === VD6.SIG[3];
    if (!sigOK) { badHeader++; break; }
    const rate = D[off + 4];
    const yr = D[off+6] | (D[off+7] << 8), mo = D[off+8], da = D[off+9], hh = D[off+10], mi = D[off+11], ss = D[off+12];
    const timeOK = yr >= 2010 && yr <= 2100 && mo >= 1 && mo <= 12 && da >= 1 && da <= 31 && hh <= 23 && mi <= 59 && ss <= 59;
    if (!timeOK || rate < 20 || rate > 250) { badHeader++; break; }
    if (!fs) fs = rate;
    if (rate !== fs) { rateMismatch++; break; }
    const len = VD6.HDR + rate * 8 + VD6.TRAILER;
    if (off + len > D.length) break;                       // incomplete last block — reported below
    blocks.push({ off, rate, t: new Date(yr, mo - 1, da, hh, mi, ss) });
    off += len;
  }
  const leftover = D.length - off;
  if (blocks.length < 2) refuse("No readable sequence of one-second data blocks was found.");
  checks.push({ name: "Block structure", value: blocks.length + " blocks, " + leftover + " bytes left over",
    pass: badHeader === 0 && leftover < VD6.HDR + fs * 8 + VD6.TRAILER,
    detail: "Blocks read back to back from the start of the file, each " + (VD6.HDR + fs * 8 + VD6.TRAILER) + " bytes, no unreadable header" });
  if (badHeader) refuse("Block " + (blocks.length + 1) + " does not start with a valid header — the file is damaged or a variant this reader does not know.");
  checks.push({ name: "Sampling rate", value: fs + " Hz in every block",
    pass: rateMismatch === 0, detail: "The rate in each block header must be the same — this reader does not support changing rates" });
  if (rateMismatch) refuse("The sampling rate changes inside the recording (block " + (blocks.length + 1) + "). This reader does not support that.");
  if (leftover) notes.push("The file ends with " + leftover + " bytes that do not make a complete block (an incomplete final second); they are ignored.");
  if (tail) notes.push(tail + " trailing bytes do not make a complete 8-byte frame; they are ignored.");

  /* --- 5. timeline ------------------------------------------------------- */
  let mono = 0; const gaps = [];
  for (let k = 1; k < blocks.length; k++) {
    const dt = (blocks[k].t - blocks[k-1].t) / 1000;
    if (dt > 0) mono++;
    if (dt > 1.5) gaps.push({ after: k - 1, seconds: dt });
  }
  checks.push({ name: "Timeline", value: mono + " of " + (blocks.length - 1) + " steps forward",
    pass: mono === blocks.length - 1, detail: "Block timestamps strictly increasing" });
  if (mono !== blocks.length - 1) refuse("Block timestamps go backwards or repeat " + (blocks.length - 1 - mono) + " times.");

  /* --- 6. decode --------------------------------------------------------- */
  const n = blocks.length * fs;
  const ch = [new Float32Array(n), new Float32Array(n), new Float32Array(n), new Float32Array(n)];
  const blockT = new Float64Array(blocks.length);
  const t0 = blocks[0].t;
  let plaus = 0;
  for (let b = 0; b < blocks.length; b++) {
    blockT[b] = (blocks[b].t - t0) / 1000;
    let o = blocks[b].off + VD6.HDR;
    const base = b * fs;
    for (let s = 0; s < fs; s++) for (let c = 0; c < 4; c++) {
      const v = dv.getInt16(o, true) / VD6.SCALE; o += 2;
      ch[c][base + s] = v;
      if (v >= -5 && v <= 110) plaus++;
    }
  }
  const plausRatio = plaus / (n * 4);
  checks.push({ name: "Physical plausibility", value: (plausRatio * 100).toFixed(3) + " % of samples",
    pass: plausRatio >= 0.999, detail: "Decoded samples inside −5 to 110 kPa" });
  if (plausRatio < 0.999) refuse("Only " + (plausRatio * 100).toFixed(2) + " % of decoded values are physically plausible.");

  const passed = checks.filter(c => c.pass).length;
  if (gaps.length) notes.push(gaps.length + " pause" + (gaps.length > 1 ? "s" : "") + " in the timeline, where the device stopped logging (usually between milkings, below its vacuum trigger). Durations use the clock, so pauses are not counted as milking time.");
  notes.push("The block trailer (4 bytes) is not checked — its meaning has not been established. Passing these checks shows the file has the expected structure; it does not prove the conversion to kPa is right.");
  logAudit("VD6 decoded", fileName + " — " + blocks.length + " blocks, " + fs + " Hz, " + flagged + " escaped bytes restored, " + passed + " of " + checks.length + " structural checks passed");
  return {
    signal: { fs, t0, ch, n, blockT, nBlocks: blocks.length, gaps, unit: "kPa" },
    source: { name: fileName, bytes: raw.length, kind: "vd6", checks, notes, passed, total: checks.length,
              parser: "ParlorLens .vd6 reader — reverse-engineered, not a BioControl product" }
  };
}

/* ------------------------------------------------------------------ text */
function sniffDelimiter(line) {
  const c = { ";": 0, ",": 0, "\t": 0, "|": 0 };
  for (const ch of line) if (ch in c) c[ch]++;
  return Object.keys(c).reduce((a, b) => c[b] > c[a] ? b : a, ";");
}
function splitCSV(line, d) {
  const out = []; let cur = "", q = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (q) { if (ch === '"') { if (line[i+1] === '"') { cur += '"'; i++; } else q = false; } else cur += ch; }
    else if (ch === '"') q = true;
    else if (ch === d) { out.push(cur); cur = ""; }
    else cur += ch;
  }
  out.push(cur); return out;
}
function toNum(s, decimalComma) {
  if (s === null || s === undefined) return NaN;
  s = String(s).trim().replace(/\s/g, "");
  if (!s) return NaN;
  if (decimalComma) s = s.replace(/\./g, "").replace(",", ".");
  const v = Number(s);
  return isFinite(v) ? v : NaN;
}

/** Decide what a VaDia Suite CSV export actually is. */
function classifyCSV(header) {
  const h = header.toLowerCase();
  if (h.includes("puls. nr") || (h.includes("ratio") && h.includes("limp"))) return "pt";
  if (h.includes("average short milk tube vacuum") || h.includes("overmilking")) return "mtt";
  if (h.includes("number of milkings") || h.includes("turns per hour")) return "mpe";
  return "raw";
}

function parseDelimited(text, fileName) {
  text = text.replace(/^﻿/, "");
  const lines = text.split(/\r?\n/).filter(l => l.trim().length);
  if (lines.length < 2) throw new Error("The file has no data rows.");
  const d = sniffDelimiter(lines[0]);
  const kind = classifyCSV(lines[0]);
  let cols = splitCSV(lines[0], d).map(s => s.trim()).filter((s, i, a) => !(i === a.length - 1 && s === ""));
  const body = lines.slice(1).map(l => splitCSV(l, d));
  const decimalComma = d === ";" && body.some(r => r.some(v => /^-?\d+,\d+$/.test(String(v).trim())));

  if (kind === "raw") return parseRawSeries(cols, body, decimalComma, fileName, d);

  const rows = [], notes = [];
  let avg = null;
  body.forEach(r => {
    const o = {};
    cols.forEach((c, i) => { o[c] = (r[i] === undefined ? "" : r[i].trim()); });
    const first = (r[0] || "").trim();
    if (first === "" && kind === "mtt") avg = o; else rows.push(o);
  });
  logAudit("Summary CSV imported", fileName + " — " + kind.toUpperCase() + " export, " + rows.length + " rows");
  return {
    tables: { kind, cols, rows, avg, decimalComma },
    source: {
      name: fileName, bytes: text.length, kind: "csv-" + kind, confidence: 100,
      checks: [{ name: "Export type", value: kind.toUpperCase(), pass: true,
                 detail: kind === "mtt" ? "VaDia Suite Milking Time Test summary export"
                       : kind === "pt"  ? "VaDia Suite Pulsator Test export"
                       : "VaDia Suite Milking Parlour Efficiency export" },
               { name: "Rows", value: String(rows.length), pass: rows.length > 0, detail: "Data rows excluding the averages line" }],
      notes: ["This is a summary export. It carries values VaDia Suite already computed — one row per cow, unit or pulsator — not the vacuum waveform. Waveform analysis needs the .vd6 file or a raw sample export."],
      parser: "VaDia Suite " + kind.toUpperCase() + " CSV export reader"
    }
  };
}

/** Raw sample series: any delimited table of numeric columns, optional time column. */
function parseRawSeries(cols, body, decimalComma, fileName, d) {
  const numeric = [];
  cols.forEach((c, i) => {
    let ok = 0, tot = 0;
    for (let r = 0; r < Math.min(body.length, 200); r++) {
      const v = body[r][i]; if (v === undefined || v === "") continue;
      tot++; if (isFinite(toNum(v, decimalComma))) ok++;
    }
    if (tot > 0 && ok / tot > 0.9) numeric.push(i);
  });
  if (numeric.length < 1) throw new Error("No numeric columns were found. Check the delimiter and decimal separator.");

  // A column whose values increase monotonically in small steps is the time axis.
  let timeCol = -1;
  for (const i of numeric) {
    let inc = 0, tot = 0, prev = NaN;
    for (let r = 0; r < Math.min(body.length, 500); r++) {
      const v = toNum(body[r][i], decimalComma); if (!isFinite(v)) continue;
      if (isFinite(prev)) { tot++; if (v > prev) inc++; }
      prev = v;
    }
    if (tot > 20 && inc / tot > 0.98) { timeCol = i; break; }
  }
  const dataCols = numeric.filter(i => i !== timeCol).slice(0, 4);
  const n = body.length;
  const ch = dataCols.map(() => new Float32Array(n));
  const tcol = timeCol >= 0 ? new Float64Array(n) : null;
  for (let r = 0; r < n; r++) {
    dataCols.forEach((ci, k) => { ch[k][r] = toNum(body[r][ci], decimalComma); });
    if (tcol) tcol[r] = toNum(body[r][timeCol], decimalComma);
  }
  while (ch.length < 4) ch.push(new Float32Array(n));

  let fs = 200;
  if (tcol && n > 10) {
    const span = tcol[n - 1] - tcol[0];
    if (span > 0) {
      const perUnit = (n - 1) / span;                       // samples per time unit
      fs = perUnit > 20 ? Math.round(perUnit) : Math.round(perUnit * 1000); // seconds vs milliseconds
      if (!(fs >= 10 && fs <= 5000)) fs = 200;
    }
  }
  const blockT = new Float64Array(Math.ceil(n / fs));
  for (let b = 0; b < blockT.length; b++) blockT[b] = b;
  logAudit("Raw series imported", fileName + " — " + dataCols.length + " channels, " + n + " samples, assumed " + fs + " Hz");
  return {
    signal: { fs, t0: new Date(), ch, n, blockT, nBlocks: blockT.length, gaps: [], unit: "kPa" },
    source: {
      name: fileName, bytes: n, kind: "raw", confidence: 70,
      checks: [
        { name: "Columns mapped", value: dataCols.map(i => cols[i]).join(", "), pass: true, detail: "First four numeric columns" },
        { name: "Time column", value: timeCol >= 0 ? cols[timeCol] : "none found", pass: true,
          detail: timeCol >= 0 ? "Sampling rate derived from it" : "Sampling rate assumed — set it before analysing" },
        { name: "Sampling rate", value: fs + " Hz", pass: true, detail: timeCol >= 0 ? "Derived" : "Assumed, confirm on the Channels step" }
      ],
      notes: ["Column-to-channel assignment and the vacuum unit are assumed. Confirm both on the Channels step before reading any result.",
              "Sampling rate " + (timeCol >= 0 ? "was derived from the time column" : "could not be derived and defaults to 200 Hz") + "."],
      parser: "Generic delimited sample-series reader"
    }
  };
}

function parseJSONFile(text, fileName) {
  const j = JSON.parse(text);
  const fs = Number(j.fs || j.sampleRate || j.samplingRate || 200);
  const src = j.channels || j.ch;
  if (!Array.isArray(src) || !src.length) throw new Error('JSON needs a "channels" array of { name, data:[...] }.');
  const n = Math.max.apply(null, src.map(c => (c.data || c.values || []).length));
  const ch = [];
  for (let k = 0; k < 4; k++) {
    const arr = new Float32Array(n);
    const s = src[k] && (src[k].data || src[k].values);
    if (s) for (let i = 0; i < s.length; i++) arr[i] = Number(s[i]);
    ch.push(arr);
  }
  const blockT = new Float64Array(Math.ceil(n / fs));
  for (let b = 0; b < blockT.length; b++) blockT[b] = b;
  logAudit("JSON imported", fileName + " — " + src.length + " channels, " + n + " samples at " + fs + " Hz");
  return {
    signal: { fs, t0: j.startTime ? new Date(j.startTime) : new Date(), ch, n, blockT, nBlocks: blockT.length, gaps: [], unit: j.unit || "kPa" },
    source: { name: fileName, bytes: text.length, kind: "json", confidence: 85,
      checks: [{ name: "Channels", value: String(src.length), pass: true, detail: src.map(c => c.name || "?").join(", ") },
               { name: "Sampling rate", value: fs + " Hz", pass: true, detail: "Read from the file" }],
      notes: ["Channel roles come from the file if present; confirm them on the Channels step."],
      parser: "JSON sample-series reader" }
  };
}

function detectFileType(name, head) {
  const ext = (name.split(".").pop() || "").toLowerCase();
  if (ext === "vd6" || ext === "vd5") return ext;
  if (ext === "json") return "json";
  if (ext === "csv" || ext === "txt" || ext === "tsv") return "text";
  if (head && head[0] === 0x1a && head[1] === 0x50) return "vd6";
  return "text";
}

/** Demo signal — clearly synthetic, never presented as measured data. */
function buildDemo() {
  const fs = 200, secs = 420, n = fs * secs;
  const ch = [new Float32Array(n), new Float32Array(n), new Float32Array(n), new Float32Array(n)];
  const work = 44.5;
  for (let i = 0; i < n; i++) {
    const t = i / fs;
    const cyc = t % 1;                                  // 60 cycles/min
    // SPT: trapezoidal pulsation, a 160 / b 470 / c 110 / d 260 ms
    let spt;
    if (cyc < 0.16) spt = work * (cyc / 0.16);
    else if (cyc < 0.63) spt = work - 1.6 * Math.sin((cyc - 0.16) / 0.47 * Math.PI);
    else if (cyc < 0.74) spt = work * (1 - (cyc - 0.63) / 0.11);
    else spt = 0;
    ch[0][i] = spt + (Math.random() - 0.5) * 0.25;

    const attached = t > 40 && t < 400;
    let smt = 0, mpc = 0, mpc2 = 0;
    if (attached) {
      const el = t - 40;
      const flow = el < 25 ? el / 25 : el < 90 ? 1 : el < 300 ? 1 - (el - 90) / 260 : 0.05;
      const bimodal = el > 12 && el < 28 ? 2.4 * Math.sin((el - 12) / 16 * Math.PI) : 0;   // delayed letdown dip
      smt = work - 7.5 * flow + bimodal + (cyc < 0.63 ? -1.1 : 1.1) * (0.6 + 0.5 * flow);
      const om = el > 300 ? Math.min(1, (el - 300) / 6) : 0;          // quarter empty: the liner climbs, mouthpiece vacuum rises
      mpc = 18 + 5 * flow + 15 * om + (cyc < 0.63 ? -1.2 : 1.2);
      mpc2 = 21 + 4 * flow + 13 * om + (cyc < 0.63 ? -1.0 : 1.0);
      if (el > 250 && el < 252.4) { smt -= 16 * Math.sin((el - 250) / 2.4 * Math.PI); mpc -= 9; }  // slip event
    }
    ch[1][i] = smt + (Math.random() - 0.5) * 0.3;
    ch[2][i] = mpc + (Math.random() - 0.5) * 0.3;
    ch[3][i] = mpc2 + (Math.random() - 0.5) * 0.3;
  }
  const blockT = new Float64Array(secs);
  for (let b = 0; b < secs; b++) blockT[b] = b;
  logAudit("Demo data generated", "Synthetic 7-minute milking — not measured data");
  return {
    signal: { fs, t0: new Date(), ch, n, blockT, nBlocks: secs, gaps: [], unit: "kPa", demo: true },
    source: { name: "Synthetic demo recording", bytes: 0, kind: "demo", confidence: 0,
      checks: [{ name: "Data origin", value: "Generated", pass: false, detail: "Synthetic waveform — not a measurement" }],
      notes: ["DEMO DATA. Every number produced from it is synthetic. Reports generated in demo mode are watermarked and must not be delivered to a farm."],
      parser: "Built-in demo generator" }
  };
}

/* ==========================================================================
   ANALYSIS ENGINES
   Every routine returns the numbers it used and how it used them, so the
   report can show the working. Where a rule is not documented the routine
   returns a null result with a reason instead of guessing.
   ========================================================================== */

function chIndex(role) {
  for (const k in S.mapping) if (S.mapping[k] === role) return Number(k);
  return -1;
}
function chArray(role) { const i = chIndex(role); return i >= 0 && S.signal ? S.signal.ch[i] : null; }

/** sample index -> seconds from start of recording (honours logging gaps) */
function tAt(i) {
  const s = S.signal; if (!s) return 0;
  const b = Math.min(s.nBlocks - 1, Math.floor(i / s.fs));
  return s.blockT[b] + (i - b * s.fs) / s.fs;
}
/** seconds from start of recording -> first sample at or after that moment (inverse of tAt) */
function idxAtT(t) {
  const s = S.signal; if (!s) return Math.round(t * 200);
  let lo = 0, hi = s.nBlocks - 1;
  if (t <= s.blockT[0]) return 0;
  while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (s.blockT[mid] <= t) lo = mid; else hi = mid - 1; }
  const off = t - s.blockT[lo];
  if (off >= 1) return Math.min(s.n, (lo + 1) * s.fs);          // inside a logging gap: next recorded sample
  return Math.min(s.n, lo * s.fs + Math.round(off * s.fs));
}
/** true when the logger recorded nothing for more than `maxS` seconds between two samples */
function gapInside(i0, i1, maxS) {
  const s = S.signal; if (!s) return false;
  const b0 = Math.floor(i0 / s.fs), b1 = Math.min(s.nBlocks - 1, Math.floor((i1 - 1) / s.fs));
  for (let b = b0; b < b1; b++) if (s.blockT[b + 1] - s.blockT[b] > 1 + (maxS || 0)) return true;
  return false;
}
function clockAt(i) {
  const s = S.signal; if (!s) return "—";
  return clockOf(new Date(s.t0.getTime() + tAt(i) * 1000));
}
function totalSeconds() { const s = S.signal; return s ? tAt(s.n - 1) : 0; }
function range() {
  const s = S.signal; if (!s) return [0, 0];
  const m = S.markers;
  return [m.attach != null ? m.attach : 0, m.takeoff != null ? m.takeoff : s.n];
}

/* ------------------------------------------------- milking session splitter
   A VaDia visit file normally holds a whole milking — many cows one after
   another on the same cluster. Analysing it as one milking averages the
   cows together with the gaps between them, which is meaningless. This finds
   the periods where a cluster was actually attached so each can be analysed
   on its own, the way VaDia Suite's Split function does.
   ------------------------------------------------------------------------- */
function detectSessions() {
  const s = S.signal; if (!s) return [];
  const smt = chArray("SMT") || s.ch[1];
  return vdFindMilkings(smt, s.fs, s.n).filter(m => m.real).map((m, k) => ({
    n: k + 1, i0: m.att, i1: m.end, m, seconds: tAt(m.end) - tAt(m.att), startClock: clockAt(m.att), endClock: clockAt(m.end)
  }));
}

/* -------------------------------------------------- vacuum stats per channel */
function computeVacuumStats(from, to) {
  const s = S.signal; if (!s) return [];
  from = from == null ? 0 : from; to = to == null ? s.n : to;
  return s.ch.map((arr, i) => {
    const st = stats(arr, from, to);
    return { i, role: S.mapping[i], name: "CH" + (i + 1), min: st.min, max: st.max,
             mean: st.mean, sd: st.sd, p5: pct(arr, 0.05, from, to), p95: pct(arr, 0.95, from, to), n: st.n };
  });
}

/* ------------------------------------------------------- pulsation analysis
   Phase boundaries follow the ISO 6690 / ISO 3918 convention: a reference
   level `ref` kPa above the cycle minimum and `ref` kPa below the cycle
   maximum. a = rise between the two levels, b = above the upper level,
   c = fall between them, d = below the lower level.
   ------------------------------------------------------------------------- */
function detectPulsationCycles(arr, from, to, fs) {
  const ref = T("puls_ref");
  if (ref == null) return { ok: false, reason: "Phase reference level is not set." };
  const vmax = pct(arr, 0.98, from, to), vmin = pct(arr, 0.02, from, to);
  const amp = vmax - vmin;
  if (!isFinite(amp) || amp < 3 * ref)
    return { ok: false, reason: "This channel does not show a pulsation waveform (peak-to-peak " +
             fmt(amp) + " kPa over the analysed window)." };
  const lo = vmin + ref, hi = vmax - ref;

  // Rising crossings of the lower reference level, with hysteresis so that
  // noise sitting on the threshold cannot split one cycle into two.
  const marg = Math.max(0.15, amp * 0.04);
  const rises = [];
  let armed = arr[from] < lo - marg;
  for (let i = from + 1; i < to; i++) {
    const v = arr[i];
    if (armed && v >= lo) { rises.push(i); armed = false; }
    else if (!armed && v < lo - marg) armed = true;
  }
  if (rises.length < 4) return { ok: false, reason: "Fewer than three complete pulsation cycles in the analysed window." };

  // Median spacing, then drop any crossing that arrives too soon after the
  // previous accepted one — a second crossing inside one cycle is noise.
  const gapsAll = [];
  for (let k = 1; k < rises.length; k++) gapsAll.push(rises[k] - rises[k - 1]);
  gapsAll.sort((a, b) => a - b);
  const medGap = gapsAll[Math.floor(gapsAll.length / 2)];
  const keep = [rises[0]];
  let suppressed = 0;
  for (let k = 1; k < rises.length; k++) { if (rises[k] - keep[keep.length - 1] >= medGap * 0.6) keep.push(rises[k]); else suppressed++; }

  const raw = [];
  for (let k = 0; k < keep.length - 1; k++) raw.push([keep[k], keep[k + 1]]);
  const lens = raw.map(r => r[1] - r[0]).slice().sort((a, b) => a - b);
  const med = lens[Math.floor(lens.length / 2)];

  // Cycles more than 20 % shorter or longer than the median are left out of the
  // phase timing (they are usually two cycles merged or one split) — but they are
  // counted and listed, because genuine irregularity is a finding in itself.
  const cycles = [], rejected = [];
  for (const [i0, i1] of raw) {
    const len = i1 - i0;
    if (len < med * 0.8 || len > med * 1.2) { rejected.push({ i0, i1, len, reason: len < med ? "more than 20 % shorter than the median cycle" : "more than 20 % longer than the median cycle" }); continue; }
    let iHiUp = -1, iHiDn = -1, iLoDn = -1, cMax = -Infinity, cMin = Infinity;
    for (let i = i0; i < i1; i++) {
      const v = arr[i];
      if (v > cMax) cMax = v; if (v < cMin) cMin = v;
      if (v >= hi) { if (iHiUp < 0) iHiUp = i; iHiDn = i; }
      if (v >= lo) iLoDn = i;
    }
    if (iHiUp < 0) { rejected.push({ i0, i1, len, reason: "never reached the upper reference level" }); continue; }
    const a = iHiUp - i0, b = iHiDn - iHiUp, c = iLoDn - iHiDn, d = i1 - iLoDn;
    // b-phase dip: largest fall inside the milk phase, measured across the
    // b-phase with the outer 10 % trimmed off — the phase boundary itself sits
    // `ref` kPa below the cycle maximum by definition, so including the ramps
    // would report the reference level back rather than a real dip.
    let dip = 0, dipAt = 0;
    const trim = Math.floor(b * 0.1), p0 = iHiUp + trim, p1 = iHiDn - trim;
    if (p1 > p0) {
      let pMax = -Infinity, pMin = Infinity, pMinI = p0;
      for (let i = p0; i <= p1; i++) { const v = arr[i]; if (v > pMax) pMax = v; if (v < pMin) { pMin = v; pMinI = i; } }
      dip = pMax - pMin; dipAt = (pMinI - iHiUp) / Math.max(1, b);
    }
    cycles.push({ i0, i1, len, a, b, c, d, vmax: cMax, vmin: cMin, dip, dipAt });
  }
  if (cycles.length < 3) return { ok: false, reason: "Too few clean pulsation cycles to summarise (" + cycles.length + " of " + raw.length + "; " + rejected.length + " irregular)." };
  return { ok: true, cycles, lo, hi, vmax, vmin, ref, rejected, found: raw.length, suppressed, allLen: raw.map(r => r[1] - r[0]) };
}

function pulsationSummary(det, fs) {
  if (!det.ok) return det;
  const c = det.cycles, ms = 1000 / fs, mean = f => c.reduce((s, x) => s + f(x), 0) / c.length;
  const A = mean(x => x.a) * ms, B = mean(x => x.b) * ms, C = mean(x => x.c) * ms, D = mean(x => x.d) * ms;
  const L = mean(x => x.len) * ms;
  // rate over every cycle found, irregular ones included — they are real time on the teat
  const allL = det.allLen && det.allLen.length ? det.allLen.reduce((a, b) => a + b, 0) / det.allLen.length * ms : L;
  const rate = 60000 / allL, rateRegular = 60000 / L;
  const milk = (A + B) / L * 100, rest = (C + D) / L * 100;
  // alternate-cycle asymmetry: on an alternating pulsator consecutive cycles serve opposite sides
  const ev = c.filter((_, i) => i % 2 === 0), od = c.filter((_, i) => i % 2 === 1);
  const bE = ev.length ? ev.reduce((s, x) => s + x.b, 0) / ev.length : NaN;
  const bO = od.length ? od.reduce((s, x) => s + x.b, 0) / od.length : NaN;
  const limp = isFinite(bE) && isFinite(bO) ? Math.abs(bE - bO) / (L / ms) * 100 : NaN;
  const dip = mean(x => x.dip), dipMax = c.reduce((m, x) => Math.max(m, x.dip), 0);
  const dipAt = mean(x => x.dipAt || 0) * 100;
  const vmaxMean = mean(x => x.vmax);
  const sd = f => { const m = mean(f); return Math.sqrt(mean(x => (f(x) - m) * (f(x) - m))); };
  return { ok: true, n: c.length, nFound: det.found || c.length, nExcluded: (det.rejected || []).length, rejected: det.rejected || [], rateRegular,
           cycles: c, a: A, b: B, c: C, d: D, cycleMs: L, rate,
           ratioMilk: milk, ratioRest: rest, limp, dip, dipMax, vmax: vmaxMean,
           openMs: A + B, restMs: C + D, rateSd: sd(x => 60000 / (x.len * ms)),
           lo: det.lo, hi: det.hi, ref: det.ref,
           aPct: A / L * 100, bPct: B / L * 100, cPct: C / L * 100, dPct: D / L * 100 };
}

/* ------------------------------------------- cyclic vacuum fluctuation (SMT) */
function cyclicFluctuation(smt, cycles) {
  if (!smt || !cycles || !cycles.length) return null;
  let sMin = 0, sMax = 0, sMean = 0, sAmp = 0, n = 0, worst = 0, worstAt = 0;
  for (const cy of cycles) {
    let mn = Infinity, mx = -Infinity, sum = 0, k = 0;
    for (let i = cy.i0; i < cy.i1; i++) { const v = smt[i]; if (!isFinite(v)) continue; if (v < mn) mn = v; if (v > mx) mx = v; sum += v; k++; }
    if (!k) continue;
    const amp = mx - mn;
    sMin += mn; sMax += mx; sMean += sum / k; sAmp += amp; n++;
    if (amp > worst) { worst = amp; worstAt = cy.i0; }
  }
  if (!n) return null;
  return { n, min: sMin / n, max: sMax / n, mean: sMean / n, amp: sAmp / n, worstAmp: worst, worstAt };
}

/** Single-cycle measurement at an operator-placed spot — this is what VaDia
    Suite's own CVF Min/Avg/Max columns report. Verified against nine cows on a
    real recording: in 8 of 9 the published triple is reproduced by a 1–2 second
    span inside the milking, to within 0.15 kPa. */
function cvfAtPoint(smt, cycles, idx) {
  if (!smt || !cycles || !cycles.length || idx == null) return null;
  let best = null, bestD = Infinity;
  for (const cy of cycles) {
    const d = Math.abs((cy.i0 + cy.i1) / 2 - idx);
    if (d < bestD) { bestD = d; best = cy; }
  }
  if (!best) return null;
  const st = stats(smt, best.i0, best.i1);
  return { i0: best.i0, i1: best.i1, min: st.min, mean: st.mean, max: st.max, amp: st.max - st.min };
}

/* ------------------------------------------------------------ MPC behaviour */
function mpcFavourable(arr, from, to) {
  const lo = T("mpcFav_lo"), hi = T("mpcFav_hi");
  if (arr == null || lo == null || hi == null) return null;
  let inBand = 0, above = 0, below = 0, n = 0;
  for (let i = from; i < to; i++) {
    const v = arr[i]; if (!isFinite(v)) continue;
    n++; if (v < lo) below++; else if (v > hi) above++; else inBand++;
  }
  if (!n) return null;
  return { pct: inBand / n * 100, abovePct: above / n * 100, belowPct: below / n * 100, n, lo, hi };
}

/** Negative pressure gradient: time where teat-end vacuum sits below mouthpiece vacuum. */
function npgAnalysis(smt, mpc, from, to) {
  if (!smt || !mpc) return null;
  let n = 0, hits = 0, area = 0, worst = 0, worstAt = from;
  for (let i = from; i < to; i++) {
    const a = smt[i], b = mpc[i]; if (!isFinite(a) || !isFinite(b)) continue;
    n++;
    if (a < b) { hits++; const dgap = b - a; area += dgap; if (dgap > worst) { worst = dgap; worstAt = i; } }
  }
  if (!n) return null;
  return { pct: hits / n * 100, meanGap: hits ? area / hits : 0, worst, worstAt, n };
}

/* ------------------------------------------------- irregular vacuum events */
function detectVacuumEvents(arr, from, to, fs) {
  const drop = T("ivf_drop"), minMs = T("ivf_ms");
  if (arr == null) return { ok: false, reason: "No teat-end vacuum channel is mapped." };
  if (drop == null || minMs == null)
    return { ok: false, reason: "Event detection needs a drop magnitude and a minimum duration. Both are unset because no universal value is documented — enter the values your own reference uses on the Thresholds step." };
  const win = Math.max(1, Math.round(fs * 2));            // 2-second trailing baseline
  const minLen = Math.max(1, Math.round(fs * minMs / 1000));
  const events = [];
  let sum = 0, cnt = 0, runStart = -1, runMin = Infinity;
  for (let i = from; i < to; i++) {
    const v = arr[i]; if (!isFinite(v)) continue;
    if (i - from >= win) { const old = arr[i - win]; if (isFinite(old)) { sum -= old; cnt--; } }
    const base = cnt > 0 ? sum / cnt : v;
    sum += v; cnt++;
    if (base - v >= drop) {
      if (runStart < 0) { runStart = i; runMin = v; }
      if (v < runMin) runMin = v;
    } else if (runStart >= 0) {
      if (i - runStart >= minLen)
        events.push({ i0: runStart, i1: i, depth: base - runMin, ms: (i - runStart) / fs * 1000 });
      runStart = -1;
    }
  }
  return { ok: true, events, drop, minMs };
}

/* ------------------------------------------------------------ auto markers */
function suggestMarkers() {
  const s = S.signal; if (!s) return {};
  const list = S.sessions && S.sessions.length ? S.sessions : detectSessions();
  if (!list.length) return {};
  const k = clamp(S.sessionIdx || 0, 0, list.length - 1), g = list[k];
  const arr = { smt: chArray("SMT") || s.ch[1], spt: chArray("SPT"), mpc: chArray("MPC"), mpc2: chArray("MPC2") };
  // the same engine as the audit, with any markers already moved by hand on this milking
  const E = analyseMilkingVD(g.m || { att: g.i0, end: g.i1 }, k, arr, s.fs, null, (S.handMarkers || {})[g.i0]);
  logAudit("Markers placed", "Milking " + g.n + " of " + list.length + " — attachment, peak flow, overmilking, take-off and end by the VaDia Suite manual ch. 22 rules" +
    (E.hand.length ? "; moved by hand earlier: " + E.hand.join(", ") : ""));
  S.markerAuto = Object.assign({}, E.rule, { flowEnd: E.fe });
  S.markerKey = g.i0;
  return { attach: E.att, peakStart: E.pf, overmilkStart: E.om1, overmilkStart2: E.om2, flowEnd: E.fe, takeoff: E.to, end: E.end,
           cvfPoint: E.cvf ? E.cvf.at : S.markerAuto.cvfPoint };
}

/* ------------------------------------------------------ bimodality (vacuum) */
function bimodalCheck() {
  const s = S.signal, m = S.markers;
  const smt = chArray("SMT");
  if (!s || !smt || m.attach == null) return { ok: false, reason: "Needs a mapped SMT channel and an attachment marker." };
  const win = T("bimodal_win") || 120;
  const a = m.attach, b = Math.min(s.n, a + Math.round(win * s.fs));
  if (b - a < s.fs * 20) return { ok: false, reason: "Less than 20 s of record after attachment." };
  // smooth to 1 Hz so the pulsation ripple does not dominate
  const step = s.fs, k = Math.floor((b - a) / step), sm = new Float64Array(k);
  for (let j = 0; j < k; j++) { let sum = 0; for (let i = 0; i < step; i++) sum += smt[a + j * step + i]; sm[j] = sum / step; }
  // Ignore the attachment ramp: until the cluster is actually under vacuum the
  // trace is climbing from zero, and reading that climb as a letdown recovery
  // would flag every milking. Start once vacuum is up and settled.
  const work = pct(smt, 0.9, a, b);
  let j0 = 0;
  while (j0 < k && sm[j0] < work * 0.75) j0++;
  j0 = Math.min(k - 1, j0 + 5);
  if (k - j0 < 15) return { ok: false, reason: "Less than 15 s of settled vacuum after attachment." };
  // teat-end vacuum falls as flow starts; a recovery back up inside the window suggests flow stopped and restarted
  let minJ = j0; for (let j = j0; j < k; j++) if (sm[j] < sm[minJ]) minJ = j;
  let peakJ = minJ; for (let j = minJ; j < k; j++) if (sm[j] > sm[peakJ]) peakJ = j;
  const rise = sm[peakJ] - sm[minJ];
  const thr = T("bimodal_drop");
  return { ok: true, rise, atSec: peakJ, minSec: minJ, windowS: win, threshold: thr,
           series: sm, startIdx: a, settledSec: j0,
           verdict: thr == null ? null : (rise >= thr ? "flag" : "clear") };
}

/* ---------------------------------------------------------- fall-off test */
function fallOffAnalysis(from, to) {
  const s = S.signal; if (!s) return { ok: false, reason: "No signal loaded." };
  const arr = chArray("SMT") || chArray("RCV") || s.ch[1];
  if (!arr) return { ok: false, reason: "Map a teat-end or receiver vacuum channel first." };
  const band = T("fot_band") != null ? T("fot_band") : 0.35;
  const pre = stats(arr, from, Math.min(to, from + s.fs * 2));
  // steepest sustained fall in the window = the fall-off instant
  let best = 0, bestI = -1;
  const w = Math.round(s.fs * 0.15);
  for (let i = from + w; i < to - w; i++) { const dd = arr[i - w] - arr[i + w]; if (dd > best) { best = dd; bestI = i; } }
  if (bestI < 0 || best < 3) return { ok: false, reason: "No sudden vacuum drop was found in the selected window." };
  let minV = Infinity, minI = bestI;
  for (let i = bestI; i < Math.min(to, bestI + s.fs * 3); i++) if (arr[i] < minV) { minV = arr[i]; minI = i; }
  // recovery: first sample back inside the stability band around the pre-drop level, held for 0.5 s
  const target = pre.mean - band, hold = Math.round(s.fs * 0.5);
  let rec = -1, run = 0;
  for (let i = minI; i < to; i++) {
    if (arr[i] >= target) { run++; if (run >= hold) { rec = i - hold; break; } } else run = 0;
  }
  let over = 0;
  if (rec > 0) for (let i = rec; i < Math.min(to, rec + s.fs * 2); i++) over = Math.max(over, arr[i] - pre.mean);
  return { ok: true, systemVac: pre.mean, dropTo: minV, drop: pre.mean - minV,
           recoverS: rec > 0 ? (rec - minI) / s.fs : null, overshoot: over, band,
           atIdx: bestI, minIdx: minI, recIdx: rec };
}

/* ---------------------------------------------------------------- slug test */
function slugAnalysis(from, to) {
  const s = S.signal; if (!s) return { ok: false, reason: "No signal loaded." };
  const dist = T("slug_distance"), diam = T("slug_diam");
  const a = s.ch[0], b = s.ch[1];
  // cross-correlate the two channels over the window to find the slug transit lag
  const N = Math.min(to - from, s.fs * 20);
  if (N < s.fs * 2) return { ok: false, reason: "Select at least 2 s containing the slug passing both sensors." };
  const maxLag = Math.round(s.fs * 3);
  let bestLag = 0, bestC = -Infinity;
  const mA = stats(a, from, from + N).mean, mB = stats(b, from, from + N).mean;
  for (let L = 1; L < maxLag; L++) {
    let c = 0;
    for (let i = 0; i + L < N; i += 2) c += (a[from + i] - mA) * (b[from + i + L] - mB);
    if (c > bestC) { bestC = c; bestLag = L; }
  }
  const lagS = bestLag / s.fs;
  const velocity = (dist != null && lagS > 0) ? dist / lagS : null;
  const dropA = stats(a, from, from + N), dropB = stats(b, from, from + N);
  return { ok: true, lagS, velocity, dist, diam,
           dropA: dropA.max - dropA.min, dropB: dropB.max - dropB.min };
}

/* -------------------------------------------------- milk-flow resistance */
function resistanceAnalysis(from, to) {
  const s = S.signal; if (!s) return { ok: false, reason: "No signal loaded." };
  const order = ["SMT", "LMC", "LMS", "ML"];
  const present = order.filter(r => chIndex(r) >= 0);
  if (present.length < 2) return { ok: false, reason: "Map at least two of SMT, LMC, LMS and ML to compare sections." };
  const rows = present.map(r => { const st = stats(chArray(r), from, to); return { role: r, ...st }; });
  const steps = [];
  for (let i = 0; i < rows.length - 1; i++)
    steps.push({ from: rows[i].role, to: rows[i + 1].role, drop: rows[i + 1].mean - rows[i].mean });
  return { ok: true, rows, steps };
}

/* ==========================================================================
   FINDINGS
   A finding is never just a number: it carries the data it used, the
   calculation, the threshold and where that threshold came from, what kind
   of result it is, and how much weight it can carry.
