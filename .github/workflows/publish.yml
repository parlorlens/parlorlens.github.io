# Every change to ParlorLens.html (or release-notes.txt) publishes the web app.
# Devices that have ParlorLens open or installed see "ParlorLens vNN is ready — Update now".
name: Publish ParlorLens
on:
  push:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the web app from ParlorLens.html
        run: python3 build_site.py ParlorLens.html site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
